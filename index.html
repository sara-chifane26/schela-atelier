  v.querySelectorAll("[data-ctman]").forEach(el=>el.onchange=()=>{ const m = ctMan(); if(el.value) m[el.dataset.ctman]=el.value; else delete m[el.dataset.ctman]; render(); });
  v.querySelectorAll("[data-ctna]").forEach(b=>b.onclick=()=>{ const m = ctMan(), k = b.dataset.ctna; if(m[k]==="na") delete m[k]; else m[k]="na"; render(); });
  const askItems = items => { const have = new Set(S.lipsuri.map(l=>norm(lden(l)))); let n = 0; for(const i of items){ if(have.has(norm(lden(i)))) continue; S.lipsuri.push({id:newId("l"), cod:i.cod||"", den:i.den, cap:i.cap, dela:i.dela||""}); n++; } return n; };
  v.querySelectorAll("[data-ctask]").forEach(b=>b.onclick=()=>{ const i = (ctMatch()||[]).flatMap(d=>d.items).find(i=>i.key===b.dataset.ctask); if(i){ askItems([i]); render(); } });
  const dtl=$("#dosToLips"); if(dtl) dtl.onclick=()=>{ const d = (ctMatch()||[]).find(d=>d.id===CTSEL); if(!d) return; const n = askItems(d.items.filter(i=>!i.group && !i.doc && !i.na)); render(); alert(`${pl(n,"document adăugat","documente adăugate")} la Lipsuri; le ceri de la Cereri, grupate pe cine trebuie să le trimită.`); };
  const fs=$("#fstare"); if(fs) fs.onchange=()=>{ FILTER.stare=fs.value; render(); };

  // row edits
  v.querySelectorAll("[data-f]").forEach(el=>{
    const h=()=>{
      const d=S.docs.find(x=>x.id===el.dataset.id); if(!d) return;
      d[el.dataset.f]=el.value;
      if(el.dataset.f==="data"){ d.dataSrc = el.value ? "manual" : ""; el.classList.remove("isest"); const s=el.nextElementSibling; if(s) s.remove(); }
      autosave();
    };
    el.onchange=h;
    if(el.tagName==="INPUT"&&el.type==="text") el.oninput=h;
  });
  v.querySelectorAll("[data-sel]").forEach(el=>{
    el.onchange=()=>{ const d=S.docs.find(x=>x.id===el.dataset.sel); if(d){ d.sel=el.checked; el.closest("tr").classList.toggle("sel",el.checked);} autosave(); };
  });

  // bulk
  const ba=$("#btnSelAll"); if(ba) ba.onclick=()=>{ const ids=new Set(filtered().map(d=>d.id)); S.docs.forEach(d=>{ if(ids.has(d.id)) d.sel=true; }); render(); };
  const bn=$("#btnSelNone"); if(bn) bn.onclick=()=>{ S.docs.forEach(d=>d.sel=false); render(); };
  const bsrc=$("#bulkSrc"); if(bsrc) bsrc.onchange=()=>{ if(!bsrc.value) return; S.docs.forEach(d=>{ if(d.sel) d.sursa=bsrc.value; }); render(); };
  const bdel=$("#btnDel"); if(bdel) bdel.onclick=()=>{ const n=S.docs.filter(d=>d.sel).length; if(!n) return alert("Nu ai selectat nimic."); if(!confirm("Scoți "+n+" documente din inventar? Rămân 30 de zile în coșul de gunoi; fișierele de pe calculator nu sunt atinse.")) return; toTrash("doc", S.docs.filter(d=>d.sel)); S.docs=S.docs.filter(d=>!d.sel); markDups(); render(); };

  const brc=$("#btnReclass"); if(brc) brc.onclick=()=>{
    let n=0;
    S.docs.forEach(d=>{ if(d.cap==="Neclasificat"){ const c=guessCap(d.name,d.path); if(c!=="Neclasificat"){ d.cap=c; n++; } } });
    render(); alert(n ? n+" documente încadrate. Verifică-le cu filtrul pe capitol." : "Niciun document neclasificat nu se potrivește cu regulile.");
  };

  // duplicate
  v.querySelectorAll("[data-viz]").forEach(b=>b.onclick=()=>{
    const d=S.docs.find(x=>x.id===b.dataset.viz); if(!d) return;
    const g=dupGroups().find(g=>g.docs.includes(d));
    if(g) g.docs.forEach(x=>x.viz=false);
    d.viz=true; markDups(); render();
  });

  // lipsuri
  const bal=$("#btnAddL");
  if(bal) bal.onclick=()=>{
    const den=$("#lDen").value.trim();
    if(!den) return alert("Scrie denumirea documentului.");
    S.lipsuri.push({id:newId("l"), den, cap:$("#lCap").value, dela:$("#lDela").value.trim()});
    $("#lDen").value=""; $("#lDela").value=""; render();
  };
  v.querySelectorAll("[data-dell]").forEach(b=>b.onclick=()=>{
    const [l] = S.lipsuri.splice(+b.dataset.dell,1);
    if(l) toTrash("lipsa", l, S.cereri.filter(c=>c.items.includes(l.id)));
    if(l) S.cereri.forEach(c=>{ c.items = c.items.filter(id=>id!==l.id); });
    S.cereri = S.cereri.filter(c=>c.items.length);
    render();
  });
  v.querySelectorAll("[data-unrez]").forEach(b=>b.onclick=()=>{ delete S.lipsuri[+b.dataset.unrez].rez; render(); });

  // conformitate
  v.querySelectorAll("[data-cf]").forEach(el=>el.onchange=()=>{ cfState()[el.dataset.cf] = el.value; render(); });
  v.querySelectorAll("[data-cfm]").forEach(b=>b.onclick=()=>{
    const [id, val] = b.dataset.cfm.split(":"); const c = cfState();
    if(val) c.marks[id] = val; else delete c.marks[id];
    render();
  });
  v.querySelectorAll("[data-v-go]").forEach(b=>b.onclick=()=>{ const [vw, tb] = b.dataset.vGo.split(":"); VIEW=vw; if(tb) EXTAB=tb; render(); });
  const cfl=$("#cfToLips"); if(cfl) cfl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l))));
    let n = 0;
    for(const x of cfEval().filter(x=>x.st==="miss" && !x.r.auto)){
      if(have.has(norm(x.r.titlu))) continue;
      S.lipsuri.push({id:newId("l"), cod:"", den:x.r.titlu, cap:x.r.cap, dela:x.r.dela||""}); n++;
    }
    render(); alert(n ? `${pl(n,"cerință adăugată","cerințe adăugate")} la Lipsuri, cu „de la cine” completat.` : "Toate lipsurile sunt deja în listă.");
  };

  // carte tehnică
  // parametrii fiecărei specialități se păstrează separat; numărul, codul și documentele suplimentare sunt comune
  v.querySelectorAll("[data-ctp]").forEach(el=>el.onchange=()=>{
    const [t, k] = el.dataset.ctp.split("|"); const ct = ctState();
    (ct.pp[t] = ct.pp[t] || {})[k] = el.value; render();
  });
  v.querySelectorAll("[data-ctc]").forEach(el=>el.onchange=()=>{ ctState().p[el.dataset.ctc] = el.value; render(); });
  const ctl=$("#ctToLips"); if(ctl) ctl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l))));
    let n = 0;
    for(const i of ctMissing(false)){
      if(have.has(norm(lden(i)))) continue;
      S.lipsuri.push({id:newId("l"), cod:i.cod||"", den:i.den, cap:i.cap, dela:i.dela||""}); n++;
    }
    render(); alert(n ? `${pl(n,"document adăugat","documente adăugate")} la Lipsuri, cu „de la cine” completat.` : "Toate lipsurile sunt deja în listă.");
  };
  const ctp=$("#ctPrint"); if(ctp) ctp.onclick=async()=>{ if(await downloadModel("borderou", null)) return; $("#print").innerHTML = buildBorderouri(); setTimeout(()=>window.print(), 60); };

  // cereri
  v.querySelectorAll("[data-setdela]").forEach(el=>el.onchange=()=>{
    const who = el.value.trim(); if(!who) return;
    el.dataset.setdela.split(",").forEach(id=>{ const l=lipsaById(id); if(l) l.dela = who; });
    render();
  });
  v.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{
    const card = b.closest(".grp");
    const ids = [...card.querySelectorAll("[data-lid]:checked")].map(x=>x.dataset.lid);
    if(!ids.length) return alert("Bifează cel puțin un document.");
    const g = pendingGroups()[+b.dataset.prep];
    openComposer("new", {id:newId("c"), catre:g.name, email:"", items:ids, termen:card.querySelector("[data-term]").value, trimis:"", reamintiri:[], inchisa:false});
  });
  const cById = id => S.cereri.find(c=>c.id===id);
  v.querySelectorAll("[data-cview]").forEach(b=>b.onclick=()=>openComposer("view", cById(b.dataset.cview)));
  v.querySelectorAll("[data-crem]").forEach(b=>b.onclick=()=>{
    const c = cById(b.dataset.crem); if(!c) return;
    const base = c.termen && c.termen > todayIso() ? c.termen : todayIso();
    openComposer("rem", c, addDays(base, 3));
  });
  v.querySelectorAll("[data-cclose]").forEach(b=>b.onclick=()=>{ const c=cById(b.dataset.cclose); if(c){ c.inchisa=!c.inchisa; render(); } });
  v.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{
    const c=cById(b.dataset.cdel); if(!c) return;
    if(!confirm(`Ștergi cererea către ${c.catre}? Documentele lipsă rămân în listă și pot fi cerute din nou.`)) return;
    toTrash("cerere", c); S.cereri = S.cereri.filter(x=>x!==c); render();
  });

  // materiale
  const ma=$("#matAdd"); if(ma) ma.onclick=()=>{
    const lines = parseLines($("#matBulk").value); if(!lines.length) return alert("Scrie cel puțin un material.");
    const have = new Set(S.mat.map(m=>norm(m.den)));
    let n = 0;
    for(const l of lines){ const [den, furn] = l.split(";").map(x=>(x||"").trim()); if(!den || have.has(norm(den))) continue; S.mat.push({id:newId("m"), den, furn:furn||"", kw:"", docId:"", ok:false}); have.add(norm(den)); n++; }
    render(); if(!n) alert("Materialele erau deja în listă.");
  };
  v.querySelectorAll("[data-mf]").forEach(el=>{ const [i,k] = el.dataset.mf.split(":"); el.onchange=()=>{ if(S.mat[+i]){ S.mat[+i][k]=el.value.trim(); if(k!=="furn") S.mat[+i].ok=false; render(); } }; });
  v.querySelectorAll("[data-mdoc]").forEach(el=>el.onchange=()=>{ const m=S.mat[+el.dataset.mdoc]; if(m){ m.docId=el.value; m.ok=false; render(); } });
  v.querySelectorAll("[data-mok]").forEach(el=>el.onchange=()=>{ const m=S.mat[+el.dataset.mok]; if(m){ m.ok=el.checked; render(); } });
  v.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{ toTrash("mat", S.mat.splice(+b.dataset.mdel,1)); render(); });
  const mtl=$("#matToLips"); if(mtl) mtl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l)))); let n = 0;
    for(const m of S.mat.filter(m=>matStatus(m).st==="lipsa")){
      const den = `Certificat de calitate / declarație de performanță – ${m.den}`;
      if(have.has(norm(den))) continue;
      S.lipsuri.push({id:newId("l"), cod:"", den, cap:"Calitate", dela:m.furn||"Furnizor"}); n++;
    }
    render(); alert(n ? `${pl(n,"document adăugat","documente adăugate")} la Lipsuri; le poți cere de la Cereri, grupate pe furnizori.` : "Toate lipsurile sunt deja în listă.");
  };

  // execuție
  v.querySelectorAll("[data-extab]").forEach(b=>b.onclick=()=>{ EXTAB=b.dataset.extab; render(); });
  const fsa=$("#fSugAdd"); if(fsa) fsa.onclick=()=>{
    const sug = S.dom.flatMap(d=>(FD_SUG[d]||[]).map(den=>({den, dom:d}))).filter(x=>!S.faze.some(f=>norm(f.den)===norm(x.den)));
    v.querySelectorAll("[data-fsug]").forEach(el=>{ if(el.checked){ const x = sug[+el.dataset.fsug]; if(x) S.faze.push({id:newId("f"), den:x.den, dom:x.dom, data:"", conv:"", pv:false}); } });
    render();
  };
  const fad=$("#fAdd"); if(fad) fad.onclick=()=>{ S.faze.push({id:newId("f"), den:"", dom:"", data:"", conv:"", pv:false}); render(); const ins=v.querySelectorAll('[data-ff$=":den"]'); if(ins.length) ins[ins.length-1].focus(); };
  v.querySelectorAll("[data-ff]").forEach(el=>{ const [i,k] = el.dataset.ff.split(":"); el.onchange=()=>{ const f=S.faze[+i]; if(f){ f[k]=el.value; render(); } }; });
  v.querySelectorAll("[data-fpv]").forEach(el=>el.onchange=()=>{ const f=S.faze[+el.dataset.fpv]; if(f){ f.pv=el.checked; render(); } });
  v.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{ toTrash("faza", S.faze.splice(+b.dataset.fdel,1)); render(); });
  v.querySelectorAll("[data-fconv]").forEach(b=>b.onclick=()=>{ const f=S.faze[+b.dataset.fconv]; if(f) openTextModal("Convocare ISC – model", convocareText(f), "Model de pornire: completează ora, persoana de contact și antetul firmei; verifică forma cerută de inspectoratul județean."); });
  v.querySelectorAll("[data-sg]").forEach(el=>el.onchange=()=>{ const [id,k] = el.dataset.sg.split(":"); (S.sem[id] = S.sem[id] || {})[k] = el.checked; render(); });
  const stl=$("#semToLips"); if(stl) stl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l)))); let n = 0;
    const nm = Object.fromEntries(SIGN);
    for(const d of pvNesemnate()){
      const den = `Semnături lipsă (${pvState(d).miss.map(k=>nm[k]).join(", ")}) – ${d.name.replace(/\.[a-z0-9]{1,5}$/i,"")}`;
      if(have.has(norm(den))) continue;
      S.lipsuri.push({id:newId("l"), cod:"", den, cap:"Execuție", dela:"Executant"}); n++;
    }
    render(); alert(n ? `${pl(n,"PV adăugat","PV-uri adăugate")} la Lipsuri.` : "Toate sunt deja în listă.");
  };
  const dim=$("#dispImport"); if(dim) dim.onclick=()=>{
    for(const d of dispNeinregistrate()){
      // ce modifică: textul de după număr și dată, dacă documentul are text
      let desc = "";
      if(d.txt){ desc = d.txt.replace(/^.*?dispozi\w*\s+de\s+santier/,"").replace(/^\s*nr\.?\s*[:.]?\s*[0-9a-z./-]+/,"").replace(new RegExp("^\\s*(din|data)?\\s*[:.]?\\s*([0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4}|[0-9]{1,2}\\s+(" + LUNI.join("|") + ")\\s+[0-9]{4})"),"").replace(/^[\s\-–:,.]+/,"").slice(0,140); }
      S.disp.push({id:newId("s"), nr:d.nr||findNr(d.name), data: d.dataSrc==="estimat" ? "" : (d.data||""), desc, desen:false, asbuilt:false, docId:d.id});
    }
    render();
  };
  const dad=$("#dispAdd"); if(dad) dad.onclick=()=>{ S.disp.push({id:newId("s"), nr:"", data:"", desc:"", desen:false, asbuilt:false, docId:""}); render(); };
  v.querySelectorAll("[data-df]").forEach(el=>{ const [i,k] = el.dataset.df.split(":"); el.onchange=()=>{ const x=S.disp[+i]; if(x){ x[k]=el.value; render(); } }; });
  v.querySelectorAll("[data-dck]").forEach(el=>el.onchange=()=>{ const [i,k] = el.dataset.dck.split(":"); const x=S.disp[+i]; if(x){ x[k]=el.checked; render(); } });
  v.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=()=>{ toTrash("disp", S.disp.splice(+b.dataset.ddel,1)); render(); });

  v.querySelectorAll("[data-addfiles]").forEach(b=>b.onclick=()=>$("#inGlobal").click());
  const csa=$("#csugAdd"); if(csa) csa.onclick=()=>{
    const sg = certSugestii(); let n = 0;
    v.querySelectorAll("[data-csug]").forEach(el=>{ if(!el.checked) return; const x = sg[+el.dataset.csug]; if(!x) return; S.mat.push({id:newId("m"), den:x.i.den, furn:x.i.furn, kw:"", docId:x.d.id, ok:false}); n++; });
    render(); if(n) alert(`${pl(n,"material adăugat","materiale adăugate")}, fiecare legat de certificatul lui. Verifică dacă documentul corespunde și bifează „Corespunde”.`);
  };
  // lista beneficiarului
  const bu=$("#benUp"), ib=$("#inBen"); if(bu&&ib){ bu.onclick=()=>ib.click(); ib.onchange=()=>{ const f = ib.files[0]; ib.value=""; if(f) importBenList(f); }; }
  const bop=$("#benOpen"); if(bop) bop.onclick=async()=>{ let f=null; try{ f = await IDB.get("ben:"+S.id); }catch(e){} if(!f) return alert("Originalul nu mai e în acest browser (poate a fost încărcat pe alt calculator)."); const u = URL.createObjectURL(f); window.open(u, "_blank"); setTimeout(()=>URL.revokeObjectURL(u), 60000); };
  // aranjarea dosarului și textul din PDF-uri
  const car=$("#ctArrange"); if(car) car.onclick=openArrange;
  // sursa fișierelor: folderul legat sau alegerea folderului acum
  const withSource = async cb => {
    const inp = $("#inSrc");
    const pick = () => { if(!inp) return; inp.onchange = () => { const fs = [...inp.files]; inp.value = ""; if(fs.length) cb(filesMap(fs)); }; inp.click(); };
    if(!S.folder) return pick();          // fără folder legat: alegi folderul acum
    const m = await sourceFilesMap(); if(m) return cb(m);
    if(confirm("Nu am acces la folderul legat. Alegi folderul acum?")) pick();
  };
  const bpt=$("#btnPdfTxt"); if(bpt) bpt.onclick=()=>withSource(readPdfTexts);
  const boc=$("#btnOcr"); if(boc) boc.onclick=()=>withSource(m=>{
    const list = S.docs.filter(needsOcr).map(d=>({d, f: m.get(d.path+"|"+d.name+"|"+d.size) || m.get("|"+d.name+"|"+d.size)})).filter(x=>x.f);
    if(!list.length) return alert("Nu am găsit scanurile în folderul ales.");
    if(list.length>15 && !confirm(`Sunt ${list.length} scanuri; OCR-ul durează câteva secunde pe fiecare. Continui?`)) return;
    busy(true, "Se încarcă cititorul OCR (prima dată durează mai mult)…"); runOcr(list);
  });
  const blf=$("#btnLinkF"); if(blf) blf.onclick=linkFolder;
  const bcf=$("#btnCheckF"); if(bcf) bcf.onclick=checkFolder;
  v.querySelectorAll("[data-sgall]").forEach(b=>b.onclick=()=>{ const d = S.docs.find(x=>x.id===b.dataset.sgall); if(!d) return; const st = pvState(d); const o = S.sem[d.id] = S.sem[d.id] || {}; st.need.forEach(k=>o[k]=true); render(); });
  const sga=$("#semAll"); if(sga) sga.onclick=()=>{ const l = pvNesemnate(); if(!confirm(`Marchezi ${pl(l.length,"PV","PV-uri")} ca semnate de toți cei care trebuie să semneze? Fă asta doar dacă ai verificat documentele.`)) return; l.forEach(d=>{ const o = S.sem[d.id] = S.sem[d.id] || {}; pvNeeds(d).forEach(k=>o[k]=true); }); render(); };

  // rezultate
  const bo=$("#btnOpis"); if(bo) bo.onclick=()=>{ $("#print").innerHTML=buildOpis(); setTimeout(()=>window.print(),60); };
  const bcsv=$("#btnCsv"); if(bcsv) bcsv.onclick=exportCsv;
  const brap=$("#btnRaport"); if(brap) brap.onclick=exportRaport;
}

/* Boloboc */
$("#bbFab").onclick = () => { const b = $("#bb"); b.classList.toggle("on"); if(b.classList.contains("on")) bbRender(); };

/* top bar */
$("#btnSave").onclick=()=>{
  if(!CUR) return;
  S.savedAt = new Date().toISOString(); autosave(); renderBanner();
  const name=(S.meta.proiect||"proiect").replace(/[^\w\-]+/g,"_")+"_schela.json";
  download(name, JSON.stringify(S,null,2));
};
$("#btnLoad").onclick=()=>$("#fileLoad").click();
$("#fileLoad").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(extOf(f.name)!=="json"){ e.target.value=""; return alert(`„${f.name}” nu e un proiect Schela. Aici se deschide doar fișierul .json salvat cu „Salvează proiect”. Documentele lucrării se adaugă la Inventar.`); }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||!o.meta) throw new Error("format");
      // aceeași lucrare (același identificator) se înlocuiește; altfel intră în listă ca lucrare nouă
      if(o.id && IDX.some(l=>l.id===o.id) && !confirm(`Lucrarea „${o.meta.proiect||"fără nume"}” există deja în listă. O înlocuiești cu versiunea din fișier?`)) o.id = "";
      autosave();
      importLucrare(o); VIEW="proiect"; render();
      alert("Lucrare deschisă: "+(S.meta.proiect||"fără nume")+" — "+S.docs.length+" documente.");
    }catch(err){ alert("Fișierul nu pare a fi un proiect Schela."); }
  };
  r.readAsText(f); e.target.value="";
};
$("#inGlobal").onchange=e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length && CUR) addFiles(fs); };
$(".brand").onclick=()=>{ if(CUR) closeLucrare(); VIEW="acasa"; render(); };


window.addEventListener("beforeunload", autosave);
// la redimensionarea ferestrei, câmpurile care cresc își recalculează înălțimea
window.addEventListener("resize", ()=>document.querySelectorAll("textarea.grow").forEach(el=>{ el.style.height="auto"; el.style.height=el.scrollHeight+2+"px"; }));

autoload();
markDups();
render();
refreshModele().catch(()=>{});
</script>
</body>
</html>
