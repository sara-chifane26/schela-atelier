/* ---- TEXTUL DIN PDF ----
   Pentru fișierele cu nume neclar („scan001.pdf”) aplicația citește local începutul textului din PDF
   (cititorul pdf.js se încarcă o singură dată de pe cdnjs; documentele nu pleacă din calculator).
   Scanurile fără strat de text nu pot fi citite (ar trebui OCR). */
const PDFJS_SRC = window.PDFJS_SRC || "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = window.PDFJS_WORKER || "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let PDFJS_P = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(PDFJS_P) return PDFJS_P;
  PDFJS_P = new Promise(res=>{
    const s = document.createElement("script"); s.src = PDFJS_SRC;
    const t = setTimeout(()=>res(null), 10000);
    s.onload = () => { clearTimeout(t); try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(window.pdfjsLib); }catch(e){ res(null); } };
    s.onerror = () => { clearTimeout(t); res(null); };
    document.head.appendChild(s);
  }).then(l=>{ if(!l) PDFJS_P = null; return l; });
  return PDFJS_P;
}
async function pdfText(file){
  const lib = await loadPdfJs(); if(!lib) return null;
  try{
    const job = (async()=>{
      const doc = await lib.getDocument({data: await file.arrayBuffer()}).promise;
      let t = "";
      for(let i=1; i<=Math.min(2, doc.numPages); i++){
        const c = await (await doc.getPage(i)).getTextContent();
        t += " " + c.items.map(x=>x.str).join(" ");
        if(t.length > 900) break;
      }
      doc.destroy && doc.destroy();
      return norm(t).replace(/\s+/g," ").trim().slice(0,800);
    })();
    return await Promise.race([job, new Promise(r=>setTimeout(()=>r(null), 15000))]);
  }catch(e){ return null; }
}
// citește textul pentru documentele PDF din inventar care nu îl au încă (după ce alegi din nou folderul)
const filesMap = files => { const m = new Map(); for(const f of files){ const path = (f.webkitRelativePath||"").split("/").slice(0,-1).join("/"); m.set(path+"|"+f.name+"|"+f.size, f); m.set("|"+f.name+"|"+f.size, f); } return m; };
const needsText = d => (["pdf","docx","doc"].includes(d.ext) && d.txt===undefined) || (d.ext==="pdf" && !d.sigChecked);
async function readPdfTexts(m){
  const todo = S.docs.filter(needsText);
  if(todo.some(d=>d.ext==="pdf")){ busy(true, "Se încarcă cititorul de PDF…"); if(!await loadPdfJs()) alert("Cititorul de PDF nu s-a putut încărca (e nevoie de internet la prima folosire). Citesc doar documentele Word."); }
  let n = 0, txt = 0;
  for(const d of todo){
    const f = m.get(d.path+"|"+d.name+"|"+d.size) || m.get("|"+d.name+"|"+d.size); if(!f) continue;
    busy(true, `Se citește textul… ${++n} din ${todo.length}`);
    if(d.ext==="pdf" && !d.sigChecked){ d.sig = (await pdfSigInfo(f)) || undefined; d.sigChecked = true; }
    if(d.txt!==undefined) continue;
    const t = await fileText(f); if(t===undefined) continue;
    d.txt = t; if(t) txt++;
    enrichDoc(d);
  }
  busy(false); render();
  alert(`Am citit ${pl(n,"document","documente")}; ${txt} au text, din care am luat numărul și data unde le-am găsit.${n-txt ? " "+(n-txt)+" sunt scanuri fără text (ar trebui OCR)." : ""}`);
}

/* ---- TEXTUL DIN WORD (.docx) ----
   Un .docx e o arhivă zip; textul e în word/document.xml. Îl despachetăm în pagină, fără biblioteci,
   cu DecompressionStream (Chrome, Edge, Firefox, Safari recente). Fișierele .doc vechi nu se pot citi așa. */
async function docxText(file){
  try{
    if(typeof DecompressionStream!=="function") return null;
    const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
    // sfârșitul directorului central
    let e = -1;
    for(let i=buf.length-22; i>=Math.max(0, buf.length-66000); i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
    if(e<0) return null;
    let p = dv.getUint32(e+16,true); const n = dv.getUint16(e+10,true);
    for(let k=0; k<n; k++){
      if(dv.getUint32(p,true)!==0x02014b50) return null;
      const meth = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
      const fl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
      const name = new TextDecoder().decode(buf.subarray(p+46, p+46+fl));
      if(name==="word/document.xml"){
        const ds = off + 30 + dv.getUint16(off+26,true) + dv.getUint16(off+28,true);
        const raw = buf.subarray(ds, ds+csize);
        let xml;
        if(meth===0) xml = new TextDecoder().decode(raw);
        else if(meth===8) xml = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
        else return null;
        const t = xml.replace(/<\/w:p>/g," ").replace(/<w:tab\/>/g," ").replace(/<[^>]+>/g,"")
          .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'");
        return norm(t).replace(/\s+/g," ").trim().slice(0,800);
      }
      p += 46 + fl + xl + cl;
    }
    return null;
  }catch(err){ return null; }
}
// textul de început al unui document, dacă se poate citi local (PDF cu text sau Word .docx)
async function fileText(f){
  const x = extOf(f.name);
  if(f.size > 40*1048576) return undefined;
  if(x==="docx") return (await docxText(f)) || "";
  if(x==="doc") return (await docText(f)) || "";
  if(x==="pdf" && window.pdfjsLib) return (await pdfText(f)) || "";
  return undefined;
}

/* ---- NUMĂRUL ȘI DATA DIN DOCUMENT ----
   Se iau din denumire, apoi din textul de început („Proces-verbal nr. 12 din 03.11.2026”). */
const LUNI = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
// lunile în română, engleză, germană, franceză, spaniolă, turcă (fără diacritice) → numărul lunii
const LUNI_X = {};
[LUNI,
 ["january","february","march","april","may","june","july","august","september","october","november","december"],
 ["januar","februar","marz","april","mai","juni","juli","august","september","oktober","november","dezember"],
 ["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"],
 ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],
 ["ocak","subat","mart","nisan","mayis","haziran","temmuz","agustos","eylul","ekim","kasim","aralik"]
].forEach(l=>l.forEach((m,i)=>{ LUNI_X[m] = i+1; }));
Object.assign(LUNI_X, {jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,setiembre:9,oct:10,nov:11,dec:12,jänner:1,janner:1});
const LUNI_RX = Object.keys(LUNI_X).sort((a,b)=>b.length-a.length).join("|");
function findNr(s){
  const t = norm(String(s||"").replace(/\.(pdf|docx?|xlsx?|jpe?g|png|tiff?|dwg|zip)$/i,""));
  // nr. / no. / n° / nº / number / nummer / numero / sayi
  const m = t.match(/(?:\bnr\.?|\bno\.?|\bn[°º]|\bnumber|\bnummer|\bnumero|\bsayi)\s*(?:de\s+inregistrare\s*)?[:.]?\s*([0-9]{1,6}(?:[./-][0-9a-z]{1,6})?)\b/) || t.match(/\b(?:pv|ds|dop)\s*[-_]?\s*([0-9]{1,5})\b/);
  return m ? m[1].replace(/[./-]$/,"") : "";
}
function findDateText(s){
  const t = norm(s);
  const cands = [];
  let m; const r1 = /(?:^|[^0-9])(0?[1-9]|[12]\d|3[01])[./-](0?[1-9]|1[0-2])[./-](20\d{2})(?![0-9])/g;
  while((m = r1.exec(t))){ if(validIso(m[3],m[2],m[1])) cands.push({i:m.index, iso:`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}); }
  // „12 martie 2026”, „12. März 2026”, „12 de marzo de 2026”, „12 Mart 2026”
  const r2 = new RegExp("(?:^|[^0-9])(0?[1-9]|[12]\\d|3[01])\\.?\\s+(?:de\\s+)?(" + LUNI_RX + ")\\.?\\s+(?:de\\s+)?(20\\d{2})", "g");
  while((m = r2.exec(t))){ const mo = String(LUNI_X[m[2]]).padStart(2,"0"); if(validIso(m[3],mo,m[1])) cands.push({i:m.index, iso:`${m[3]}-${mo}-${m[1].padStart(2,"0")}`}); }
  // „March 12, 2026”
  const r3 = new RegExp("\\b(" + LUNI_RX + ")\\.?\\s+(0?[1-9]|[12]\\d|3[01])(?:st|nd|rd|th)?,?\\s+(20\\d{2})", "g");
  while((m = r3.exec(t))){ const mo = String(LUNI_X[m[1]]).padStart(2,"0"); if(validIso(m[3],mo,m[2])) cands.push({i:m.index, iso:`${m[3]}-${mo}-${m[2].padStart(2,"0")}`}); }
  // „2026-03-12” (ISO)
  const r4 = /(?:^|[^0-9])(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(?![0-9])/g;
  while((m = r4.exec(t))){ if(validIso(m[1],m[2],m[3])) cands.push({i:m.index, iso:`${m[1]}-${m[2]}-${m[3]}`}); }
  if(!cands.length) return "";
  // data de lângă „din” / „data” are prioritate; altfel prima din text
  const near = cands.find(c=>/(din|data|incheiat|astazi|date|dated|datum|vom|du|le|fecha|tarih|issued)\s*[:.,]?\s*$/.test(t.slice(Math.max(0,c.i-14), c.i+1)));
  return (near || cands.sort((a,b)=>a.i-b.i)[0]).iso;
}

// ce material și ce producător scrie pe un certificat / o declarație
function certInfo(d){

/* ---- ADĂUGARE PRIN TRAGERE (drag and drop) ---- */
async function dropToFiles(dt){
  const out = [];
  const items = [...(dt.items||[])].map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if(!items.length) return [...(dt.files||[])].map(f=>({f, path:""}));
  async function walk(entry, dir){
    if(entry.isFile){ try{ const f = await new Promise((res,rej)=>entry.file(res,rej)); out.push({f, path:dir}); }catch(e){} return; }
    if(entry.isDirectory){
      const sub = dir ? dir+"/"+entry.name : entry.name, rd = entry.createReader();
      for(;;){ const b = await new Promise((res,rej)=>rd.readEntries(res,rej)); if(!b.length) break; for(const e of b) await walk(e, sub); }
    }
  }
  for(const e of items) await walk(e, "");
  return out;
}

/* ---- SEMNĂTURI ELECTRONICE ÎN PDF ----
   Un PDF semnat digital conține un dicționar /Type /Sig, cu certificatul semnatarului în /Contents.
   Citim numele din câmpul /Name și din certificat (CN, OID 2.5.4.3), fără să validăm criptografic semnătura. */
const CA_WORDS = /\b(ca|root|authority|autoritate|certsign|digisign|trans sped|transsped|alfasign|qualified|calificat|trust|issuing|class|tsa|timestamp|ocsp)\b/i;
async function pdfSigInfo(file){
  try{
    if(file.size > 40*1048576) return null;
    const bytes = new Uint8Array(await file.arrayBuffer());
    const s = new TextDecoder("latin1").decode(bytes);
    if(!/\/Type\s*\/Sig\b|\/ByteRange\s*\[/.test(s)) return null;
    const names = new Set();
    let m; const rn = /\/Name\s*\(([^)]{2,80})\)/g;
    while((m = rn.exec(s))) names.add(m[1].trim());
    const rc = /\/Contents\s*<([0-9A-Fa-f]{200,})>/g;
    while((m = rc.exec(s))){
      const hex = m[1].toLowerCase();
      // 06 03 55 04 03 = OID commonName, urmat de un șir (UTF8 0c, Printable 13, BMP 1e, IA5 16, T61 14)
      let i = 0;
      while((i = hex.indexOf("0603550403", i)) >= 0){
        const tag = hex.substr(i+10,2), len = parseInt(hex.substr(i+12,2),16);
        if(["0c","13","16","14","1e"].includes(tag) && len>1 && len<128){
          const raw = hex.substr(i+14, len*2); let txt = "";
          if(tag==="1e"){ for(let k=0;k<raw.length;k+=4) txt += String.fromCharCode(parseInt(raw.substr(k,4),16)); }
          else { const b = new Uint8Array(raw.match(/../g).map(x=>parseInt(x,16))); txt = new TextDecoder(tag==="0c"?"utf-8":"latin1").decode(b); }
          if(!CA_WORDS.test(norm(txt))) names.add(txt.trim());
        }
        i += 10;
      }
    }
    const count = (s.match(/\/Type\s*\/Sig\b/g)||[]).length || 1;
    return {n: count, names:[...names].slice(0,8)};
  }catch(e){ return null; }
}
// ce roluri acoperă semnăturile electronice ale unui PV: după persoanele lucrării și după „inspectorat”
function autoSig(d){
  const out = {};
  if(!d.sig || !d.sig.names) return out;
  const toks = n => new Set(norm(n).replace(/\b(ing|ec|dr|arh)\b\.?/g," ").split(/[^a-z]+/).filter(w=>w.length>=3));
  const RK = {[ROLURI[0]]:"dir", [ROLURI[1]]:"rte", [ROLURI[2]]:"pr"};
  for(const nm of d.sig.names){
    const t = toks(nm);
    if(/inspector|\bisc\b/.test(norm(nm))) out.isc = nm;
    for(const p of S.pers){
      const k = RK[p.rol]; if(!k || !p.nume) continue;
      const pt = [...toks(p.nume)];
      if(pt.length && pt.filter(w=>t.has(w)).length >= Math.min(2, pt.length)) out[k] = nm;
    }
  }
  return out;
}

/* ---- WORD VECHI (.doc) ----
   Fișierul e un „compound file”; textul stă în fluxul WordDocument. Îl găsim și scoatem
   primele rânduri lizibile (Unicode sau cp1252) — suficient pentru titlu, număr și dată. */
async function docText(file, raw){
  try{
    const b = new Uint8Array(await file.arrayBuffer()), dv = new DataView(b.buffer);
    if(dv.getUint32(0,true)!==0xE011CFD0) return null;
    const ss = 1 << dv.getUint16(0x1E,true), sec = n => 512 + n*ss, END = 0xFFFFFFFA;
    // tabela de alocare (FAT), din DIFAT
    const difat = []; for(let i=0;i<109;i++){ const v = dv.getUint32(0x4C+i*4,true); if(v<END) difat.push(v); }
    let dif = dv.getUint32(0x44,true), g = 0;
    while(dif < END && g++ < 1000){ for(let i=0;i<ss/4-1;i++){ const v = dv.getUint32(sec(dif)+i*4,true); if(v<END) difat.push(v); } dif = dv.getUint32(sec(dif)+ss-4,true); }
    const fat = []; for(const fs of difat) for(let i=0;i<ss/4;i++) fat.push(dv.getUint32(sec(fs)+i*4,true));
    const chain = (st, t) => { const out=[]; let c=st, k=0; while(c<END && k++<500000){ out.push(c); c = t[c]; } return out; };
    const readBig = (st, size) => { const out = new Uint8Array(size); let o=0; for(const c of chain(st, fat)){ const n = Math.min(ss, size-o); if(n<=0) break; out.set(b.subarray(sec(c), sec(c)+n), o); o+=n; } return out; };
    // directorul
    const ents = {};
    let root = null;
    for(const ds of chain(dv.getUint32(0x30,true), fat)) for(let e=0; e<ss/128; e++){
      const p = sec(ds)+e*128, nl = dv.getUint16(p+0x40,true); if(nl<2) continue;
      let nm = ""; for(let k=0;k<nl-2;k+=2) nm += String.fromCharCode(dv.getUint16(p+k,true));
      const ent = {st:dv.getUint32(p+0x74,true), size:dv.getUint32(p+0x78,true), type:b[p+0x42]};
      if(ent.type===5) root = ent; else ents[nm] = ent;
    }
    // fluxurile mici (< 4096 octeți) stau în „mini stream”
    const cutoff = dv.getUint32(0x38,true);
    let mini = null, minifat = null;
    const readStream = ent => {
      if(ent.size >= cutoff) return readBig(ent.st, ent.size);
      if(!mini){ mini = readBig(root.st, root.size); minifat = []; const mf = readBig(dv.getUint32(0x3C,true), dv.getUint32(0x40,true)*ss); for(let i=0;i<mf.length/4;i++) minifat.push(new DataView(mf.buffer).getUint32(i*4,true)); }
      const out = new Uint8Array(ent.size); let o = 0;
      for(const c of chain(ent.st, minifat)){ const n = Math.min(64, ent.size-o); if(n<=0) break; out.set(mini.subarray(c*64, c*64+n), o); o+=n; }
      return out;
    };
    if(!ents.WordDocument) return null;
    const w = readStream(ents.WordDocument), wv = new DataView(w.buffer);
    const flags = wv.getUint16(0x0A,true);
    if(flags & 0x0100) return "";                                   // document criptat
    const tbl = ents[(flags & 0x0200) ? "1Table" : "0Table"]; if(!tbl) return null;
    const t = readStream(tbl), tv = new DataView(t.buffer);
    const fcClx = wv.getUint32(0x01A2,true), lcbClx = wv.getUint32(0x01A6,true);
    // Clx: înregistrări Prc (0x01) urmate de Pcdt (0x02) cu tabela de bucăți de text
    let q = fcClx;
    while(q < fcClx+lcbClx && t[q]===0x01) q += 3 + tv.getUint16(q+1,true);
    if(t[q]!==0x02) return null;
    const lcb = tv.getUint32(q+1,true), pl0 = q+5, n = (lcb-4)/12;
    let txt = "";
    for(let i=0; i<n && txt.length<(raw?40000:1500); i++){
      const cp0 = tv.getUint32(pl0+i*4,true), cp1 = tv.getUint32(pl0+(i+1)*4,true);
      const pcd = pl0 + (n+1)*4 + i*8, fcv = tv.getUint32(pcd+2,true);
      const comp = (fcv & 0x40000000) !== 0, len = cp1-cp0;
      if(comp){ const fc = (fcv & 0x3FFFFFFF)/2; txt += new TextDecoder("windows-1252").decode(w.subarray(fc, fc+len)); }
      else { txt += new TextDecoder("utf-16le").decode(w.subarray(fcv, fcv+len*2)); }
    }
    // codurile de câmp (0x13 … 0x14 rezultat 0x15) și caracterele de control
    txt = txt.replace(/\x13[^\x14\x15]*\x14?/g,"");
    if(raw) return txt.replace(/\x07\x07/g,"\n").replace(/\x07\r?/g," | ").replace(/\r/g,"\n").replace(/[\x00-\x09\x0b-\x1f]/g," ");
    txt = txt.replace(/[\x00-\x1f]/g," ");
    return norm(txt).replace(/\s+/g," ").trim().slice(0,800);
  }catch(e){ return null; }
}

function ocrGuessLang(t){
  const w = new Set(norm(t).split(/[^a-z]+/)); let best = null, bs = 0;
  for(const [l, hs] of Object.entries(OCR_HINTS)){ const sc = hs.filter(h=>w.has(h)).length; if(sc>bs){ bs=sc; best=l; } }
  return bs>=3 ? best : null;
}
const OCR_OPT = window.OCR_OPT || {workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js", corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1", langPath:"https://tessdata.projectnaptha.com/4.0.0"};
let OCR_P = null;
function loadOcr(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(OCR_P) return OCR_P;
  OCR_P = new Promise(res=>{
    const s = document.createElement("script"); s.src = OCR_SRC;
    const t = setTimeout(()=>res(null), 20000);
    s.onload = () => { clearTimeout(t); res(window.Tesseract||null); };
    s.onerror = () => { clearTimeout(t); res(null); };
    document.head.appendChild(s);
  }).then(l=>{ if(!l) OCR_P = null; return l; });
  return OCR_P;
}
async function pdfFirstPageImage(file){
  const lib = await loadPdfJs(); if(!lib) return null;
  const doc = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const page = await doc.getPage(1);
  const vp0 = page.getViewport({scale:1}), scale = Math.min(2.5, 1800 / Math.max(vp0.width, vp0.height));
  const vp = page.getViewport({scale});
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
  doc.destroy && doc.destroy();
  return c;
}
async function runOcr(files){
  const T = await loadOcr();
  if(!T){ busy(false); alert("Cititorul OCR nu s-a putut încărca. E nevoie de internet la prima folosire."); return; }
  const workers = {};
  const getW = async langs => workers[langs] || (workers[langs] = await T.createWorker(langs.split("+"), 1, OCR_OPT));
  let worker;
  try{ worker = await getW(OCR_LANGS); }catch(e){ busy(false); alert("Cititorul OCR nu a pornit: " + (e && e.message || e)); return; }
  let n = 0, ok = 0;
  for(const {d, f} of files){
    busy(true, `OCR… ${++n} din ${files.length} (câteva secunde pe pagină)`);
    try{
      const src = d.ext==="pdf" ? await pdfFirstPageImage(f) : f;
      if(!src) continue;
      let r = await worker.recognize(src);
      const lg = ocrGuessLang(r.data.text||"");
      if(lg){ busy(true, `OCR… ${n} din ${files.length} — documentul pare în ${({deu:"germană",fra:"franceză",spa:"spaniolă",tur:"turcă"})[lg]}, îl citesc din nou`); try{ r = await (await getW(lg+"+eng")).recognize(src); }catch(e){} }
      const t = norm(r.data.text||"").replace(/\s+/g," ").trim().slice(0,800);
      if(t.length > 20){ d.txt = t; d.ocr = true; enrichDoc(d); ok++; } else d.ocr = true;
    }catch(e){ d.ocr = true; }
  }
  for(const w of Object.values(workers)) try{ await w.terminate(); }catch(e){}
  busy(false); render();
  alert(`OCR gata: ${pl(ok,"document citit","documente citite")} din ${files.length}. Verifică datele și numerele preluate; la scanurile neclare citirea poate greși.`);
}

   Legătura spre folder (inclusiv de pe server, mapat ca disc) se păstrează în browser; la „Verifică folderul”

const IDB = {
  db(){ return new Promise((res,rej)=>{ const r = indexedDB.open("schela_foldere", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.db(); return new Promise(res=>{ const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); }); },
  async set(k,v){ const db = await this.db(); return new Promise(res=>{ const t = db.transaction("h","readwrite"); t.objectStore("h").put(v,k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); },
  async del(k){ const db = await this.db(); return new Promise(res=>{ const t = db.transaction("h","readwrite"); t.objectStore("h").delete(k); t.oncomplete = () => res(true); }); }
};
const FH = new Map();   // legăturile din sesiunea curentă (și dacă browserul nu le poate păstra)
const canLink = () => typeof window.showDirectoryPicker === "function" && typeof indexedDB !== "undefined";
async function linkFolder(){
  let h; try{ h = await window.showDirectoryPicker({mode:"read"}); }catch(e){ return; }
  FH.set(S.id, h); try{ await IDB.set(S.id, h); }catch(e){}
  S.folder = {name:h.name, at:""}; render();
  if(confirm(`Folderul „${h.name}” e legat de lucrare. Îl verific acum și aduc fișierele noi?`)) checkFolder();
}
async function folderHandle(ask){
  if(!canLink()) return null;
  let h = FH.get(S.id) || null;
  if(!h){ try{ h = await IDB.get(S.id); }catch(e){ return null; } if(h) FH.set(S.id, h); }
  if(!h) return null;
  try{
    let p = await h.queryPermission({mode:"read"});
    if(p!=="granted" && ask) p = await h.requestPermission({mode:"read"});
    return p==="granted" ? h : null;
  }catch(e){ return null; }
}
async function folderFiles(h){
  const out = [];
  async function walk(dir, path){
    for await (const [name, e] of dir.entries()){
      if(e.kind==="file"){ try{ out.push({f: await e.getFile(), path}); }catch(err){} }
      else await walk(e, path+"/"+name);
    }
  }
  await walk(h, h.name);
  return out;
}
async function checkFolder(){
  const h = await folderHandle(true);
  if(!h){ alert("Nu am acces la folderul legat. Leagă-l din nou (poate a fost mutat sau serverul nu e conectat)."); return; }
  busy(true, `Se parcurge „${h.name}”…`);
  const files = await folderFiles(h);
  busy(false);
  S.folder = {name:h.name, at:new Date().toISOString()};
  addFiles(files);
}
// fișierele lucrării pentru aranjare, citirea textului sau OCR: din folderul legat sau ales acum
async function sourceFilesMap(){
  const h = await folderHandle(true); if(!h) return null;
  busy(true, `Se parcurge „${h.name}”…`);
  const fl = await folderFiles(h); busy(false);
  const m = new Map(); for(const {f, path} of fl){ m.set(path+"|"+f.name+"|"+f.size, f); m.set("|"+f.name+"|"+f.size, f); }
  return m;
}

function rubOf(d){
  if(d.rub && rubById(d.rub)) return d.rub;
  const base = d.name.replace(/\.[a-z0-9]{1,6}$/i,"");
  const head = (d.txt||"").slice(0,120);
  for(const src of [base, base+" "+head]){
    const t = toks(src), w = new Set(words(src));
    for(const {r, k} of RUB_N){
      if(r.need && !r.need.every(x=>w.has(x)) && !k.some(p=>t.includes(p))) continue;
      if(k.some(p=>t.includes(p))) return r.id;
      if(r.q && qualType({name:base, txt:head})) return r.id;
    }
  }
  return CAP_RUB[d.cap] || "alte";
}

/* ---- LISTA BENEFICIARULUI ----
   Lista documentelor cerute în plus de beneficiar, încărcată ca PDF, Word, Excel, text sau poză.
   Aplicația scoate documentele (rânduri numerotate, cu liniuță sau coloana cu denumiri dintr-un tabel)
   și ți le arată să le confirmi; fișierul original se păstrează în browser, la lucrare. */
async function zipTexts(file, want){
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = -1;
  for(let i=buf.length-22; i>=Math.max(0, buf.length-66000); i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) return {};
  let p = dv.getUint32(e+16,true); const n = dv.getUint16(e+10,true), out = {};
  for(let k=0; k<n; k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const meth = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
    const fl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    const name = new TextDecoder().decode(buf.subarray(p+46, p+46+fl));
    if(want(name)){
      const ds = off + 30 + dv.getUint16(off+26,true) + dv.getUint16(off+28,true), raw = buf.subarray(ds, ds+csize);
      out[name] = meth===0 ? new TextDecoder().decode(raw) : meth===8 ? await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text() : "";
    }
    p += 46 + fl + xl + cl;
  }
  return out;
}
const xmlDec = s => s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(a,c)=>String.fromCharCode(+c)).replace(/&amp;/g,"&");
// primul tabel din primul sheet al unui .xlsx, ca rânduri de celule
async function xlsxRows(file){
  const z = await zipTexts(file, n => n==="xl/sharedStrings.xml" || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const shared = []; (z["xl/sharedStrings.xml"]||"").replace(/<si>([\s\S]*?)<\/si>/g, (a, si) => { shared.push(xmlDec((si.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,"")).join(""))); return ""; });
  const sheet = Object.keys(z).filter(n=>n.startsWith("xl/worksheets/")).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)))[0];
  if(!sheet) return [];
  const rows = [];
  z[sheet].replace(/<row[^>]*>([\s\S]*?)<\/row>/g, (a, r) => {
    const row = [];
    r.replace(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, (m, attrs, inner) => {
      const ref = (attrs.match(/r="([A-Z]+)\d+"/)||[])[1] || "", t = (attrs.match(/t="(\w+)"/)||[])[1];
      let col = 0; for(const ch of ref) col = col*26 + ch.charCodeAt(0)-64; col = Math.max(0, col-1);
      let v = "";
      if(t==="inlineStr") v = xmlDec(((inner||"").match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||"");
      else { const x = ((inner||"").match(/<v>([\s\S]*?)<\/v>/)||[])[1]; v = x===undefined ? "" : t==="s" ? (shared[+x]||"") : xmlDec(x); }
      row[col] = v.trim(); return "";
    });
    rows.push(row); return "";
  });
  return rows;
}
async function docxLines(file){
  const z = await zipTexts(file, n => n==="word/document.xml");
  const x = z["word/document.xml"] || "";
  // rândurile de tabel: celulele separate prin „ | ”, paragrafele din celulă lipite
  const rowsX = x.replace(/<w:tr[ >][\s\S]*?<\/w:tr>/g, tr => tr.replace(/<\/w:p>/g," ").replace(/<\/w:tc>/g," | ").replace(/<[^>]+>/g,"").replace(/\s*\|\s*$/,"") + "\n");
  return xmlDec(rowsX.replace(/<\/w:p>/g,"\n").replace(/<w:tab\/>/g," ").replace(/<w:br\/>/g,"\n").replace(/<[^>]+>/g,"")).split("\n");
}
async function pdfLines(file){
  const lib = await loadPdfJs(); if(!lib) return null;
  const doc = await lib.getDocument({data: await file.arrayBuffer()}).promise, out = [];
  for(let i=1; i<=Math.min(15, doc.numPages); i++){
    const c = await (await doc.getPage(i)).getTextContent();
    let line = "", y = null;
    for(const it of c.items){
      const iy = it.transform ? Math.round(it.transform[5]) : y;
      if(y!==null && Math.abs(iy-y)>2){ out.push(line); line = ""; }
      line += (line && !/\s$/.test(line) ? " " : "") + it.str; y = iy;
      if(it.hasEOL){ out.push(line); line = ""; y = null; }
    }
    if(line) out.push(line);
  }
  return out;
}
async function ocrLines(file){
  const T = await loadOcr(); if(!T) return null;
  const src = extOf(file.name)==="pdf" ? await pdfFirstPageImage(file) : file;
  const w = await T.createWorker(OCR_LANGS.split("+"), 1, OCR_OPT);
  const r = await w.recognize(src); await w.terminate();
  return (r.data.text||"").split("\n");
}
// din rânduri de tabel: coloana cu denumirile documentelor
function listFromRows(rows){
  rows = rows.filter(r=>r && r.some(c=>c && c.trim()));
  if(!rows.length) return [];
  const HEAD = /denumire|document|descriere|description|titlu|title|bezeichnung|designation|denominacion|aciklama|belge/;
  // antetul tabelului: un rând cu cel puțin două celule, dintre care una „denumire / document / nr. crt.”
  const filled = r => r.filter(c=>c && c.trim()).length;
  let hi = rows.findIndex(r=>filled(r)>=2 && (r.some(c=>c && HEAD.test(norm(c))) || r.some(c=>c && /^(nr\.?\s*crt\.?|nr\.?|no\.?|crt\.?)$/.test(norm(c).trim()))));
  let col = -1;
  if(hi>=0) col = rows[hi].findIndex(c=>c && HEAD.test(norm(c)) && !/^(nr|no|crt)/.test(norm(c).trim()));
  const body = rows.slice(hi+1);
  const letters = k => body.reduce((a,r)=>a + ((r[k]||"").match(/[a-zA-ZăâîșțĂÂÎȘȚ]/g)||[]).length, 0);
  if(col>=0 && letters(col) < body.length*3) col = -1;
  if(col<0){
    const w = Math.max(...body.map(r=>r.length));
    let best = 0;
    for(let k=0;k<w;k++){ const sc = body.reduce((a,r)=>a + ((r[k]||"").match(/[a-zA-ZăâîșțĂÂÎȘȚ]/g)||[]).length, 0); if(sc>best){ best=sc; col=k; } }
  }
  return body.map(r=>(r[col]||"").trim());
}
// din rânduri de text: cele numerotate sau cu liniuță; dacă nu sunt, toate rândurile cu text
function listFromLines(lines){
  lines = lines.map(l=>String(l||"").replace(/\s+/g," ").trim()).filter(Boolean);
  const tab = lines.filter(l=>l.includes(" | "));
  if(tab.length >= 3) return listFromRows(tab.map(l=>l.split(" | ").map(c=>c.trim())));
  const BUL = /^\s*(?:\(?\d{1,3}[.)]|\d{1,3}\s*[-–]|[a-z][.)]|[-–•*·▪►✓])\s+/i;
  const bul = lines.filter(l=>BUL.test(l)).map(l=>l.replace(BUL,""));
  return bul.length >= 2 ? bul : lines;
}
function cleanList(items){
  const seen = new Set(), out = [];
  for(let x of items){
    x = String(x||"").replace(/^[\s\-–•*·:;.,|]+|[\s\-–•*:;,|]+$/g,"").trim();
    if(x.length<4 || !/[a-zA-ZăâîșțĂÂÎȘȚ]{3}/.test(x)) continue;
    const n = norm(x);
    if(/:\s*$/.test(x) || /^(lista (documentelor|documente)|documente(le)? (necesare|solicitate|cerute|suplimentare)|nr\.? ?crt|denumire( document)?$|document$|observatii|responsabil$|semnatura|intocmit|verificat|aprobat|pagina \d)/.test(n)) continue;
    if(seen.has(n)) continue; seen.add(n); out.push(x.slice(0,200));
  }
  return out.slice(0,200);
}
async function readBenList(file){
  const x = extOf(file.name);
  try{
    if(x==="xlsx" || x==="xlsm") return cleanList(listFromRows(await xlsxRows(file)));
    if(x==="docx") return cleanList(listFromLines(await docxLines(file)));
    if(x==="doc"){ const t = await docText(file, true); return t ? cleanList(listFromLines(t.split("\n"))) : []; }
    if(x==="csv") return cleanList(listFromRows((await file.text()).split(/\r?\n/).map(l=>l.split(/[;,\t]/))));
    if(x==="txt") return cleanList(listFromLines((await file.text()).split(/\r?\n/)));
    if(x==="pdf"){
      const l = await pdfLines(file);
      if(l && l.join("").replace(/\s/g,"").length > 30) return cleanList(listFromLines(l));
      const o = await ocrLines(file); return o ? cleanList(listFromLines(o)) : null;
    }
    if(["jpg","jpeg","png","tif","tiff","webp","bmp"].includes(x)){ const o = await ocrLines(file); return o ? cleanList(listFromLines(o)) : null; }
  }catch(e){ return null; }
  return [];
}

/* ---- COMPLETAREA MODELELOR WORD ---- */
// toate fișierele dintr-un .docx (zip), despachetate
async function zipAll(file){
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = -1; for(let i=buf.length-22; i>=Math.max(0, buf.length-66000); i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("nu e un fișier Word .docx");
  let p = dv.getUint32(e+16,true); const n = dv.getUint16(e+10,true), out = [];
  for(let k=0; k<n; k++){
    const meth = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), fl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    const name = new TextDecoder().decode(buf.subarray(p+46, p+46+fl));
    const ds = off + 30 + dv.getUint16(off+26,true) + dv.getUint16(off+28,true), raw = buf.subarray(ds, ds+csize);
    const data = meth===0 ? raw.slice() : new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    out.push({name, data});
    p += 46 + fl + xl + cl;
  }
  return out;
}
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
// arhivă zip fără compresie (Word o deschide fără probleme)
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,f.data.length,true); h.setUint32(22,f.data.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,f.data.length,true); c.setUint32(24,f.data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + f.data.length;
  }
  const csize = central.reduce((a,x)=>a+x.length,0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
const xmlEsc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// Word împarte uneori „{lucrare}” în mai multe bucăți de text; le unim în paragrafele care au acolade
function mergeRuns(xml){
  return xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/g, p => {
    const ts = p.match(/<w:t(?: [^>]*)?>[\s\S]*?<\/w:t>/g) || [];
    const txt = ts.map(t=>t.replace(/<[^>]+>/g,"")).join("");
    if(!/\{[a-z_]*\}?/.test(txt) || ts.length<2) return p;
    const head = p.match(/^<w:p[^>]*>(?:<w:pPr>[\s\S]*?<\/w:pPr>)?/)[0];
    const rpr = (p.match(/<w:r[ >][\s\S]*?(<w:rPr>[\s\S]*?<\/w:rPr>)/)||[])[1] || "";
    return `${head}<w:r>${rpr}<w:t xml:space="preserve">${txt}</w:t></w:r></w:p>`;
  });
}
const fillFields = (xml, f) => xml.replace(/\{([a-z_]+)\}/g, (a,k) => f[k]!==undefined ? xmlEsc(f[k]) : a);
function fillBody(body, fields, rows){
  body = mergeRuns(body);
  if(rows) body = body.replace(/<w:tr[ >][\s\S]*?<\/w:tr>/g, tr => /\{(document|poz)\}/.test(tr) ? rows.map(r=>fillFields(tr, r)).join("") : tr);
  return fillFields(body, fields);
}
// completează modelul o dată sau de mai multe ori (ex. un opis pe fiecare dosar), cu pagină nouă între ele
async function fillModel(file, sets){
  const files = await zipAll(file), doc = files.find(f=>f.name==="word/document.xml");
  const xml = new TextDecoder().decode(doc.data);
  const b0 = xml.indexOf("<w:body>")+8, sp = xml.lastIndexOf("<w:sectPr"), b1 = sp>b0 ? sp : xml.lastIndexOf("</w:body>");
  const body = xml.slice(b0, b1);
  const BR = `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
  const out = xml.slice(0,b0) + sets.map(s=>fillBody(body, s.fields, s.rows)).join(BR) + xml.slice(b1);
  // antetul și subsolul paginii pot avea și ele câmpuri
  for(const f of files){
    if(f===doc) f.data = new TextEncoder().encode(out);
    else if(/^word\/(header|footer)\d*\.xml$/.test(f.name)) f.data = new TextEncoder().encode(fillBody(new TextDecoder().decode(f.data), sets[0].fields));
  }
  return zipStore(files);
}

function dosarSet(d){

    return {poz:String(n), cod:i.cod||"", document:i.den, nr: doc ? (doc.nr||findNr(doc.name)||"") : "", data_doc: doc && doc.dataSrc!=="estimat" ? roDate(doc.data) : "", stare: doc ? "atașat" : "LIPSĂ"}; });

async function downloadModel(kind, ids){
  let f = null; try{ f = await IDB.get("model:"+kind); }catch(e){}

}

      for(const l of wrap(m.proiect||"", FB, 14, W-2*M-40)){ page.drawText(l, {x:(W-FB.widthOfTextAtSize(l,14))/2, y, size:14, font:FB, color:INK}); y -= 20; }
      y -= 16;

  // dosarele
  const dos = ctMatch() || [], missing = [], notPdf = [], bad = [];
  let done = 0; const total = dos.reduce((a,d)=>a+d.items.filter(i=>i.doc && !i.na).length, 0);
  for(const d of dos){
    if(opt.goale===false && !d.got) continue;
    if(opt.opis){
      newPage();
      text(`OPIS — Dosar ${d.id} · ${dosTitle(d)}`, {size:14, font:FB, color:BLUE});
      text(`${CT_CH[d.ch]} · Lucrare: ${S.meta.proiect||""}`, {size:8, color:MUTED}); y -= 6;
      const cx = [M, M+32, W-M-150, W-M-70];
      const hdr = () => { page.drawRectangle({x:M, y:y-14, width:W-2*M, height:16, color:rgb(0.906,0.925,0.918)}); ["Poz.","Document","Nr.","Data"].forEach((h,i)=>page.drawText(h,{x:cx[i]+3, y:y-10, size:8, font:FB, color:MUTED})); y -= 20; };
      hdr();
      let n = 0;
      for(const i of d.items.filter(i=>!i.na)){
        if(y < M+30){ newPage(); hdr(); }
        if(i.group){ text(i.group.toUpperCase(), {size:8, font:FB, color:BLUE, gap:5}); continue; }
        n++;
        const doc = i.doc, den = (i.cod?i.cod+" – ":"") + i.den + (doc?"":" — LIPSĂ");
        const ls = wrap(den, F, 9, cx[2]-cx[1]-8);
        page.drawText(String(n), {x:cx[0]+3, y:y-9, size:9, font:F, color:INK});
        ls.forEach((l,k)=>page.drawText(l, {x:cx[1]+3, y:y-9-k*11, size:9, font:F, color:doc?INK:RED}));
        if(doc){ page.drawText(String(doc.nr||findNr(doc.name)||"").slice(0,14), {x:cx[2]+3, y:y-9, size:9, font:F, color:INK}); if(doc.dataSrc!=="estimat" && doc.data) page.drawText(roDate(doc.data), {x:cx[3]+3, y:y-9, size:9, font:F, color:INK}); }
        y -= 11*ls.length + 5;
        page.drawLine({start:{x:M,y:y+2}, end:{x:W-M,y:y+2}, thickness:0.4, color:rgb(0.87,0.9,0.89)});
      }
      if(S.meta.semnatar || FIRMA.semnatar){ y -= 10; text(`Întocmit: ${S.meta.semnatar || FIRMA.semnatar}`, {size:9, color:MUTED}); }
    }
    for(const i of d.items){
      if(i.group || i.na || !i.doc) { if(!i.group && !i.na && !i.doc && !d.later) missing.push(`${d.id}: ${i.den}`); continue; }
      const f = files.get(i.doc.path+"|"+i.doc.name+"|"+i.doc.size) || files.get("|"+i.doc.name+"|"+i.doc.size);
      progress && progress(++done, total);
      if(!f){ bad.push(i.doc.name+" (negăsit în folder)"); continue; }
      const x = extOf(f.name);
      try{
        if(x==="pdf"){ const src = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption:true}); (await out.copyPages(src, src.getPageIndices())).forEach(p=>out.addPage(p)); }
        else if(["jpg","jpeg","png"].includes(x)){
          const b = new Uint8Array(await f.arrayBuffer()), img = x==="png" ? await out.embedPng(b) : await out.embedJpg(b);
          const pg = out.addPage([W,H]), k = Math.min((W-40)/img.width, (H-40)/img.height);
          pg.drawImage(img, {x:(W-img.width*k)/2, y:(H-img.height*k)/2, width:img.width*k, height:img.height*k});
        }
        else notPdf.push(i.doc.name);
      }catch(e){ bad.push(i.doc.name+" (nu s-a putut citi)"); }
    }
  }
  // numărul filei
  if(opt.file){
    const pages = out.getPages(), N = pages.length;
    pages.forEach((p,k)=>{ const {width} = p.getSize(); const t = `Fila ${k+1} / ${N}`; p.drawText(t, {x:width-M-F.widthOfTextAtSize(t,8), y:18, size:8, font:F, color:MUTED}); });
  }
  const bytes = await out.save();
  return {blob:new Blob([bytes], {type:"application/pdf"}), pages:out.getPageCount(), notPdf, bad, missing};
}

/* ---- COȘUL DE GUNOI ----
   Ce ștergi nu dispare imediat: stă 30 de zile în coș și se poate restaura exact cum era.
   Coșul lucrării (documente, lipsuri, cereri, persoane, materiale, faze, dispoziții) stă în lucrare;
   lucrările șterse stau într-un coș separat, pe pagina de intrare. */
const TRASH_DAYS = 30, KEY_TRASH = "schela_cos_lucrari_v1";
const TR_KIND = {doc:"Document", lipsa:"Lipsă", cerere:"Cerere", pers:"Persoană", mat:"Material", faza:"Fază determinantă", disp:"Dispoziție de șantier"};
const trLabel = t => t.kind==="doc" ? t.item.name : t.kind==="lipsa" ? lden(t.item) : t.kind==="cerere" ? `către ${t.item.catre}` : t.kind==="pers" ? (t.item.nume||"fără nume")+" · "+t.item.rol : t.kind==="mat" ? t.item.den : t.kind==="faza" ? (t.item.den||"fază fără nume") : t.kind==="disp" ? `nr. ${t.item.nr||"—"} ${t.item.desc||""}` : "";
const fresh30 = at => (Date.now() - new Date(at).getTime()) < TRASH_DAYS*86400000;
function purgeTrash(){ if(Array.isArray(S.trash)) S.trash = S.trash.filter(t=>fresh30(t.at)); }
// mută în coș; „extra” păstrează ce trebuie refăcut la restaurare (ex. cererile din care a fost scoasă o lipsă)
function toTrash(kind, items, extra){
  if(!Array.isArray(S.trash)) S.trash = [];
  const at = new Date().toISOString(), ids = [];
  for(const it of [].concat(items)){ const t = {id:newId("t"), kind, at, item:JSON.parse(JSON.stringify(it)), extra:extra?JSON.parse(JSON.stringify(extra)):null}; S.trash.unshift(t); ids.push(t.id); }
  toast(`${ids.length>1 ? pl(ids.length, TR_KIND[kind].toLowerCase()+" ștearsă", "elemente șterse") : TR_KIND[kind]+" șters"+(["lipsa","cerere","pers","faza","disp"].includes(kind)?"ă":"")} · în coș ${TRASH_DAYS} de zile`, () => { ids.forEach(restoreTrash); render(); });
}
function restoreTrash(tid){
  const i = (S.trash||[]).findIndex(t=>t.id===tid); if(i<0) return;
  const t = S.trash.splice(i,1)[0], it = t.item;
  if(t.kind==="doc"){ if(!S.docs.some(d=>d.id===it.id)) S.docs.push(Object.assign(it,{sel:false})); markDups(); }
  if(t.kind==="lipsa"){ if(!S.lipsuri.some(l=>l.id===it.id)) S.lipsuri.push(it); (t.extra||[]).forEach(c=>{ const cur = S.cereri.find(x=>x.id===c.id); if(cur){ if(!cur.items.includes(it.id)) cur.items.push(it.id); } else S.cereri.push(c); }); }
  if(t.kind==="cerere"){ if(!S.cereri.some(c=>c.id===it.id)) S.cereri.push(it); }
  if(t.kind==="pers") S.pers.push(it);
  if(t.kind==="mat") S.mat.push(it);
  if(t.kind==="faza") S.faze.push(it);
  if(t.kind==="disp") S.disp.push(it);
}
// lucrările șterse
const readCos = () => { try{ const a = JSON.parse(localStorage.getItem(KEY_TRASH)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } };
const saveCos = a => { try{ localStorage.setItem(KEY_TRASH, JSON.stringify(a)); }catch(e){} };
function purgeCos(){
  const a = readCos(), keep = [];
  for(const x of a){ if(fresh30(x.at)) keep.push(x); else { try{ localStorage.removeItem(KEY_L(x.id)); IDB.del(x.id); IDB.del("ben:"+x.id); }catch(e){} } }
  if(keep.length!==a.length) saveCos(keep);
}
function restoreLucrare(id){
  const a = readCos(), x = a.find(y=>y.id===id); if(!x) return;
  const o = readLucrare(id); if(!o){ saveCos(a.filter(y=>y.id!==id)); return alert("Lucrarea nu mai poate fi restaurată."); }
  IDX = IDX.filter(l=>l.id!==id); IDX.unshift(Object.assign({}, x.entry || {id, proiect:o.meta.proiect||"", dom:o.dom||[], n:(o.docs||[]).length}, {upd:Date.now()})); saveIdx();
  saveCos(a.filter(y=>y.id!==id));
}
function deleteForever(id){
  try{ localStorage.removeItem(KEY_L(id)); IDB.del(id); IDB.del("ben:"+id); }catch(e){}
  saveCos(readCos().filter(y=>y.id!==id));
}

/* ---- SALVAREA ÎN AFARA BROWSERULUI ----
   Copia automată: în folderul legat al lucrării se scrie „Schela - <lucrare>.json” (și ultimele 5 versiuni
   în „Schela - copii”), la câteva minute cât lucrezi și când ieși din pagină. Merge în Chrome și Edge. */
const backupName = () => safeName("Schela - " + (S.meta.proiect || "lucrare")) + ".json";
let BK_LAST = "", BK_BUSY = false;
async function backupHandle(ask){
  const h = await folderHandle(false); if(!h) return null;
  try{
    let p = await h.queryPermission({mode:"readwrite"});
    if(p!=="granted" && ask) p = await h.requestPermission({mode:"readwrite"});
    return p==="granted" ? h : null;
  }catch(e){ return null; }
}
async function doBackup(ask){
  if(!CUR || !S.autoBackup || BK_BUSY) return false;
  const js = JSON.stringify(S); if(js===BK_LAST && !ask) return true;
  BK_BUSY = true;
  try{
    const h = await backupHandle(ask); if(!h){ S.backupOff = true; return false; }
    S.backupOff = false; S.backupAt = new Date().toISOString(); S.savedAt = S.backupAt;
    const data = JSON.stringify(S, null, 1);
    const w = await (await h.getFileHandle(backupName(), {create:true})).createWritable(); await w.write(data); await w.close();
    const dir = await h.getDirectoryHandle("Schela - copii", {create:true});
    const stamp = S.backupAt.slice(0,16).replace(/[:T]/g,"-");
    const w2 = await (await dir.getFileHandle(safeName((S.meta.proiect||"lucrare")+" "+stamp)+".json", {create:true})).createWritable(); await w2.write(data); await w2.close();
    const vers = []; for await (const [n, e] of dir.entries()) if(e.kind==="file" && n.startsWith(safeName(S.meta.proiect||"lucrare")+" ")) vers.push(n);
    vers.sort(); for(const n of vers.slice(0, Math.max(0, vers.length-5))) try{ await dir.removeEntry(n); }catch(e){}
    BK_LAST = JSON.stringify(S);
    return true;
  }catch(e){ S.backupOff = true; return false; }
  finally{ BK_BUSY = false; }
}
setInterval(()=>{ if(CUR && S.autoBackup) doBackup(false).then(ok=>{ if(!ok) renderBanner(); }); }, 3*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && CUR && S.autoBackup) doBackup(false); });
// banda de sus: copia automată oprită sau lucrare nesalvată de 7 zile
function bannerHtml(){
  if(!CUR || !S.docs.length || /^demo/.test(S.id)) return "";
  if(S.autoBackup && S.backupOff) return `<div class="note warn bnr">Copia automată în folderul lucrării e oprită (browserul cere din nou permisiunea). <button class="btn sm" id="bkResume">Reia salvarea automată</button></div>`;
  if(S.autoBackup) return "";
  const last = S.savedAt ? new Date(S.savedAt).getTime() : 0, d = last ? Math.floor((Date.now()-last)/86400000) : null;
  if(last && d < 7) return "";
  return `<div class="note warn bnr"><b>${last ? `Lucrarea n-a mai fost salvată în afara browserului de ${d} zile.` : "Lucrarea e salvată doar în acest browser."}</b> Dacă browserul e curățat sau schimbi calculatorul, se pierde.
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;margin-left:6px"><button class="btn sm" id="bnSave">Salvează acum (.json)</button>${canLink() ? `<button class="btn g sm" id="bnAuto">Salvare automată în folderul lucrării</button>` : ""}</span></div>`;
}
function renderBanner(){ const b = $("#banner"); if(b){ b.innerHTML = bannerHtml(); bindBanner(); } }
function bindBanner(){
  const s1 = $("#bnSave"); if(s1) s1.onclick = () => $("#btnSave").click();

  const s3 = $("#bkResume"); if(s3) s3.onclick = async () => { const ok = await doBackup(true); if(!ok) alert("Nu am primit permisiunea de scriere în folder. Leagă din nou folderul lucrării."); render(); };

async function enableAutoBackup(){
  if(!S.folder){ alert("Leagă întâi folderul lucrării (Inventar → Leagă folderul lucrării). Copia automată se scrie acolo, lângă documente."); VIEW = "inventar"; return render(); }

}

function cfState(){
  if(!S.conf) S.conf = {faza:"executie", ac:"da", isc:"da", cladire:"nu", marks:{}};
  if(!S.conf.marks) S.conf.marks = {};
  return S.conf;
}
function cfDetect(r){
  if(r.id==="produse" && !S.mat.length){ const q = live().find(d=>qualType(d)); if(q){ const t = qualType(q); return {state:"da", doc:q, info:`${t.tip}${t.l!=="ro"?" în "+t.limba:""}`}; } }
  if(r.id==="produse" && S.mat.length){
    const ms = S.mat.map(matStatus), l = ms.filter(x=>x.st==="lipsa").length, v = ms.filter(x=>x.st==="verif").length;
    return l ? {state:"nu", info:`${pl(l,"material fără document de calitate","materiale fără document de calitate")} (vezi Materiale)`} : {state:"da", info: v ? `toate materialele au document; ${v} de verificat dacă corespund` : "toate materialele au document verificat"};
  }
  if(r.auto==="sem"){
    const pv = live().filter(isPVdoc); if(!pv.length) return {state:"nu", info:"niciun proces-verbal în inventar"};
    const n = pvNesemnate().length;
    return n ? {state:"nu", info:`${pl(n,"PV cu semnături lipsă","PV-uri cu semnături lipsă")} (vezi Execuție)`} : {state:"da", info:`${pl(pv.length,"PV semnat","PV-uri semnate")}`};
  }
  if(r.auto==="disp"){
    if(!S.disp.length) return {state:"da", info: dispNeinregistrate().length ? "există dispoziții în inventar neînregistrate (vezi Execuție)" : "nicio dispoziție de șantier înregistrată"};
    const fd = S.disp.filter(x=>!x.desen).length, na = S.disp.filter(x=>!x.asbuilt).length;
    return fd||na ? {state:"nu", info:[fd?`${fd} fără desen`:"", na?`${na} neincluse în as built`:""].filter(Boolean).join(", ")} : {state:"da", info:"toate au desen și sunt în as built"};
  }
  if(r.auto==="faze"){
    if(!S.faze.length) return {state:"nu", info:"treci fazele din program la Execuție"};
    const late = S.faze.filter(f=>fazaStatus(f).k==="late").length;
    return late ? {state:"nu", info:`${pl(late,"convocare întârziată","convocări întârziate")}`} : {state:"da", info:"convocările sunt la zi"};
  }
  if(r.auto==="pers"){
    if(!S.dom.length) return {state:"nu", info:"Bifează domeniile lucrării la Proiect"};
    const lip = acoperire().filter(x=>!x.dir.length || !x.rte.length);
    return lip.length ? {state:"nu", info:"Fără diriginte sau RTE: " + lip.map(x=>x.d.name).join(", ")} : {state:"da", info:"fiecare domeniu are diriginte și RTE"};
  }
  if(r.auto==="carte"){
    if(!activeTpls().length) return {state:"nu", info:"Bifează domeniile lucrării la Proiect"};
    const miss = ctMissing(false).length;
    return miss ? {state:"nu", info:`${miss} documente lipsă în capitolele A și B`} : {state:"da", info:"capitolele A și B complete"};
  }
  const liveD = S.docs.filter(d=>!d.dup);
  for(const d of liveD){
    const h = new Set(words(d.name+" "+d.path));
    if((r.notKws||[]).some(k=>words(k).every(w=>h.has(w)))) continue;   // ex.: avizele de însoțire nu sunt avize de proiectare
    if((r.kws||[]).some(k=>words(k).every(w=>h.has(w))) || (r.rx && r.rx.test(norm(d.name)))) return {state:"da", doc:d};
  }
  // apoi în textul citit din PDF-uri, doar după frazele de 2+ cuvinte
  for(const d of liveD){
    if(!d.txt) continue;
    const h = new Set(words(d.txt));
    if((r.notKws||[]).some(k=>words(k).every(w=>h.has(w)))) continue;
    if((r.kws||[]).filter(k=>words(k).length>=2).some(k=>words(k).every(w=>h.has(w)))) return {state:"da", doc:d};
  }
  return {state:"nu"};
}
function cfEval(){
  const c = cfState();
  const cur = CF_FAZE.findIndex(f=>f.id===c.faza);
  const ts = activeTpls();
  // regulile unui domeniu sau ale unui tip de lucrare apar doar dacă lucrarea le are
  return CF_RULES.filter(r=>(!r.dom || S.dom.includes(r.dom)) && (!r.sub || r.sub.some(t=>ts.includes(t)))).map(r=>{
    const fi = CF_FAZE.findIndex(f=>f.id===r.faza);
    const mark = c.marks[r.id];
    if(r.cond && !r.cond(c)) return {r, st:"na", why:"nu se aplică acestei lucrări"};
    if(mark==="na") return {r, st:"na", why:"marcat „nu se aplică”"};
    const det = cfDetect(r);
    if(det.state==="da") return {r, st:"ok", det};
    if(mark==="ok") return {r, st:"ok", det:{info:"confirmat manual"}};
    return {r, st: fi>cur ? "later" : "miss", det};
  });
}

  {k:["cerinte beneficiar","documente suplimentare","operator retea cere","beneficiarul cere","lista beneficiar","lista de la beneficiar","excel beneficiar"], a:()=>`Lista primită de la beneficiar o încarci la <b>Carte tehnică → Parametrii lucrării și lista beneficiarului → Încarcă lista</b>: PDF, Word, <b>Excel</b> sau poză. Aplicația scoate documentele (rânduri numerotate, cu liniuță sau coloana cu denumiri din tabel), ți le arată să le confirmi și le pune într-un dosar separat; originalul rămâne la lucrare. ${CUR?go("carte","Deschide Cartea tehnică"):""}`},
  {k:["borderou","borderouri","tiparesc borderou"], a:()=>`Borderourile se tipăresc de la <b>Carte tehnică → Tipărește borderourile</b>: câte unul pe dosar, cu numerotarea calculată; documentele lipsă apar marcate LIPSĂ. Ca să obții PDF, alege „Salvare ca PDF” în fereastra de tipărire. ${go("carte","Deschide Cartea tehnică")}`},
  {k:["opis","pdf opis","tiparesc opis","opis dosar","opisul dosarului"], a:()=>`Fiecare dosar al cărții tehnice are opisul lui: în pagina dosarului apeși <b>Opisul dosarului</b> (poziția, documentul, numărul și data, cu lipsurile marcate), iar pe pagina cu dosarele <b>Tipărește opisurile dosarelor</b> le scoate pe toate, fiecare pe pagina lui. Opisul general al lucrării se generează de la <b>Rezultate → Generează opisul</b>. Conține documentele în vigoare, grupate pe capitole, plus lipsurile marcate LIPSĂ. Pentru PDF, alege „Salvare ca PDF” la tipărire. ${go("rezultate","Deschide Rezultate")}`},
  {k:["cerere","cer documente","trimit cerere","email cerere","adresa cerere"], a:()=>`La <b>Cereri</b>, lipsurile sunt grupate pe „de la cine se recuperează”. Alegi termenul și apeși <b>Pregătește cererea</b>: poți copia textul, îl poți deschide în email sau poți tipări o adresă formală. După <b>Marchează ca trimisă</b>, aplicația urmărește termenul și bifează singură documentele care sosesc. ${go("cereri","Deschide Cereri")}`},
  {k:["reamintire","nu a raspuns","nu trimite","intarzie"], a:()=>bbCereri()},
  {k:["am documentul","nu l-a recunoscut","nu gaseste documentul","nu se aplica"], a:()=>`Verificările se fac după denumirea fișierelor. Dacă ai un document pe care aplicația nu l-a recunoscut, apasă <b>Am documentul</b> la cerința respectivă din Conformitate. Dacă cerința nu e valabilă pentru lucrarea ta, apasă <b>Nu se aplică</b>. Denumirile clare (de exemplu „PV lucrari ascunse priza st 8”) ajută recunoașterea.`},
  {k:["salvez proiect","salvare","deschid proiect","pierd datele","unde se salveaza"], a:()=>`Fiecare lucrare se păstrează automat în browserul acestui calculator și apare în lista de pe pagina de intrare. Ca să nu-l pierzi și să-l poți muta pe alt calculator, apasă sus <b>Salvează proiect</b>: primești un fișier .json, pe care îl redeschizi cu <b>Deschide proiect</b>.`},
  {k:["confidential","date personale","trimite internet","sigur","cine vede"], a:()=>`Aplicația rulează doar în browserul tău. Fișierele sunt citite local (denumire, mărime, amprentă) și nu sunt trimise nicăieri; site-ul nu are server. Nici întrebările puse mie nu pleacă de pe calculator.`},
  {k:["golesc","sterg proiect","sterg lucrarea","incep de la zero","proiect nou","lucrare noua"], a:()=>`O <b>lucrare nouă</b> pornești de pe pagina de intrare: alegi domeniul și apeși <b>Lucrare nouă</b>; lucrările existente rămân în listă. O lucrare o scoți din browser de la <b>Proiect → Șterge lucrarea</b> sau din listă; salveaz-o întâi în fișier dacă vrei să o păstrezi.`},
  {k:["exemplu","demo","cum arata"], a:()=>`Pe site, pe pagina de intrare, butonul <b>Deschide exemplul</b> adaugă în listă o lucrare demonstrativă cu date fictive (fibră optică pe LEA 110 kV, la Instalații electrice).`},

  {k:["conformitate","verificare norme","verificare conformitate","legislatie"], a:()=>`La <b>Conformitate</b>, aplicația verifică dosarul față de HG 343/2017, Legea 10/1995 și procedura ISC (Ordinul MDRAP 1370/2014). Fiecare lipsă are gravitatea (control ISC, blochează recepția, recomandat) și temeiul legal. Alege faza lucrării ca să vezi ce e scadent acum. ${go("conformitate","Deschide Conformitate")}`},
  {k:["materiale","cum verific certificatele","verific certificatele","verificare certificate","certificate materiale","certificat nu corespunde","documente de calitate materiale","lista materiale"], a:()=>`La <b>Materiale</b> lipești lista materialelor principale (din deviz, ofertă sau avize), câte unul pe rând, opțional cu furnizorul după „;”. Aplicația caută documentul de calitate al fiecăruia în inventar; tu bifezi <b>Corespunde</b> după ce verifici că tipul, dimensiunile și producătorul se potrivesc cu materialul livrat. Ce lipsește trimiți la Lipsuri și ceri de la furnizori. ${CUR?go("materiale","Deschide Materiale"):""}`},
  {k:["semnaturi","pv nesemnat","pv nesemnate","cine semneaza pv","semnaturi lipsa"], a:()=>`La <b>Execuție → Semnături pe PV-uri</b> apar toate procesele-verbale din inventar. PDF-urile semnate electronic se bifează singure, după numele din certificat comparat cu persoanele de la Proiect; la cele scanate bifezi tu (sau „toate” pe rând). RTE și dirigintele semnează orice PV, iar la fazele determinante și la natura terenului și proiectantul și ISC. Cele incomplete le trimiți la Lipsuri. ${CUR?go("executie:sem","Vezi semnăturile"):""}`},
  {k:["convocare isc","cand convoc","calendar faze","termen convocare","3 zile lucratoare"], a:()=>`La <b>Execuție → Faze determinante</b> treci data estimată a fiecărei faze; aplicația calculează până când trebuie trimisă convocarea (cu cel puțin 3 zile lucrătoare înainte, fără sărbătorile legale) și îți pregătește un model de text. ${(()=>{ if(!CUR) return ""; const u = fazeUrgente(); return u.length ? `Acum ai <b>${u.length}</b> ${u.length===1?"convocare urgentă":"convocări urgente"}: ${u.slice(0,3).map(f=>esc(f.den)).join("; ")}.` : ""; })()} ${CUR?go("executie:faze","Vezi fazele"):""} <span class="bb-law">Ordinul MDRAP 1370/2014, art. 15</span>`},
  {k:["modificari proiect","registru dispozitii","dispozitie fara desen","inclus in as built","modificari de proiect"], a:()=>`Modificările de proiect le ții la <b>Execuție → Dispoziții de șantier</b>: fiecare dispoziție cu numărul, data, ce modifică, dacă are desen și dacă a intrat în as built. Aplicația preia singură dispozițiile găsite în inventar și îți arată ce lipsește înainte de recepție. ${CUR?go("executie:disp","Vezi dispozițiile"):""} <span class="bb-law">HG 343/2017, Anexa 6, pct. 7 lit. c)</span>`},
  {k:["aranjeaza dosarul","foldere dosare","copiez fisierele","stick","organizez dosarul","dosar pe calculator"], a:()=>`La <b>Carte tehnică → Aranjează dosarul pe calculator</b> aplicația face un folder cu subfolderele Dosar A1 … Dosar D1 și pune în ele copii ale fișierelor găsite, numerotate ca în borderou, plus lista documentelor. Originalele nu se ating. Merge în Chrome și Edge, pe calculator. ${CUR?go("carte","Deschide Cartea tehnică"):""}`},
  {k:["scan","nume neclar","citeste pdf","text pdf","continut pdf","ocr","scanuri","poze","doc vechi","word vechi"], a:()=>`Din PDF-uri și din Word (.docx și .doc) aplicația citește local începutul textului: recunoaște fișierele cu nume neclar și ia numărul și data. Pentru <b>scanuri și poze</b> apasă <b>Inventar → Citește scanurile (OCR)</b>: textul se citește în pagină, în limba română, câteva secunde pe pagină. La scanurile neclare verifică ce a preluat.`},
  {k:["limbi straine","engleza","germana","franceza","spaniola","turca","certificat in engleza","document strain","leistungserklarung","declaration of performance"], a:()=>`Documentele de calitate sunt recunoscute în <b>română, engleză, germană, franceză, spaniolă și turcă</b>: aplicația îți arată în ce limbă sunt și ce tip de document e, în română (de exemplu „Leistungserklärung” = <b>declarație de performanță</b>, „Abnahmeprüfzeugnis 3.1” = <b>certificat de inspecție EN 10204</b>, „Uygunluk Beyanı” = <b>declarație de conformitate</b>). Ia și produsul, producătorul, numărul și data, iar OCR-ul citește scanurile în toate cele șase limbi.`},
  {k:["server","folderul lucrarii","leaga folderul","verifica folderul","fisiere noi","sincronizare"], a:()=>`La <b>Inventar → Leagă folderul lucrării</b> alegi o singură dată folderul (și de pe server, dacă e mapat ca disc). Apoi <b>Verifică folderul</b> aduce doar fișierele noi, prin verificarea la intrare. Merge în Chrome și Edge; browserul cere permisiunea o dată pe sesiune. ${CUR?go("inventar","Deschide Inventarul"):""}`},
  // --- noțiuni de specialitate ---
  {k:["faza determinanta","faze determinante"], a:()=>`O <b>fază determinantă</b> e o etapă de execuție hotărâtoare pentru rezistența și stabilitatea construcției. Proiectantul le stabilește în <b>programul de control pe faze determinante</b>, beneficiarul și verificatorul îl acceptă, iar ISC îl aprobă. Executantul convoacă ISC cu <b>cel puțin 3 zile lucrătoare</b> înainte, iar lucrarea continuă doar după acceptul scris, consemnat în procesul-verbal de control. <span class="bb-law">Ordinul MDRAP 1370/2014, art. 9, 15, 18; Legea 10/1995, art. 23 lit. d)</span>`},
  {k:["lucrari ascunse","pv lucrari ascunse"], a:()=>`<b>PV-ul de lucrări ascunse</b> consemnează calitatea lucrărilor care urmează să fie acoperite (fundații, armături, prize de pământ îngropate etc.) și nu mai pot fi verificate ulterior. Se semnează de executant (RTE) și de dirigintele de șantier și intră în capitolul B al cărții tehnice. <span class="bb-law">HG 343/2017, Anexa 6, pct. 8 lit. b)</span>`},
  {k:["carte tehnica capitole","ce contine cartea tehnica","cartea tehnica","capitol a","capitol b","capitol c","capitol d"], a:()=>`<b>Cartea tehnică</b> are fișa de date sintetice și patru capitole: <b>A</b> proiectarea, <b>B</b> execuția, <b>C</b> recepția, <b>D</b> exploatarea, întreținerea și urmărirea comportării, plus jurnalul evenimentelor. Investitorul o întocmește (dirigintele o constituie ca secretar al comisiei) și o predă proprietarului în două etape: A și B la terminarea lucrărilor, C și D la recepția finală. <span class="bb-law">HG 343/2017, art. 11 alin. (3), art. 37, Anexa 6</span> ${go("carte","Vezi situația cărții")}`},
  {k:["as built","asbuilt"], a:()=>`Proiectul <b>as built</b> reflectă lucrarea așa cum a fost executată efectiv, cu toate modificările față de proiect. Comisia îl examinează la recepție ca parte din cartea tehnică; lipsa lui e o cauză frecventă de suspendare a recepției. <span class="bb-law">HG 343/2017, art. 15 alin. (3); Anexa 6, pct. 7 lit. c)</span>`},
  {k:["receptie terminare","receptia la terminarea","termene receptie","comisie receptie","dureaza receptia","durata receptie","termen receptie","cate zile receptie"], a:()=>`La <b>recepția la terminarea lucrărilor</b>: executantul anunță terminarea; investitorul are <b>5 zile</b> să acționeze, autoritățile <b>10 zile</b> să-și numească reprezentanții, iar investitorul numește comisia în <b>3 zile</b>. Comisia lucrează cu cel puțin <b>2/3</b> din membri; dacă suspendă recepția, remedierile au cel mult <b>90 de zile</b>. Procesul-verbal se transmite în <b>5 zile</b>. <span class="bb-law">HG 343/2017, art. 9, 10, 15, 17, 23</span>`},
  {k:["receptie finala","receptia finala","dupa garantie","cand receptia finala","receptie finala cand"], a:()=>`<b>Recepția finală</b> începe în cel mult <b>10 zile</b> de la expirarea perioadei de garanție. Comisia verifică PV-ul de recepție la terminare, raportul proprietarului privind comportarea în garanție, cartea tehnică completată și remedierea viciilor apărute. <span class="bb-law">HG 343/2017, art. 24, 27</span>`},
  {k:["rte","responsabil tehnic executie"], a:()=>`<b>RTE</b> (responsabilul tehnic cu execuția) e persoana autorizată a executantului care urmărește calitatea: verifică proiectul și planul de control, certificatele produselor, semnează PV-urile de faze determinante și de lucrări ascunse și participă la întocmirea cărții tehnice.`},
  {k:["diriginte","diriginte santier","dirigintele"], a:()=>`<b>Dirigintele de șantier</b> autorizat reprezintă investitorul: verifică autorizația și proiectul înainte de începere, controlează calitatea produselor și lucrărilor, semnează documentele de verificare și, ca secretar al comisiei de recepție, constituie cartea tehnică. <span class="bb-law">HG 343/2017, art. 11 alin. (3)</span>`},
  {k:["declaratie performanta","certificat calitate","agrement","documente materiale","declaratie conformitate"], a:()=>`Executantul poate folosi doar produse <b>certificate sau cu agrement tehnic</b>. Pentru fiecare material principal păstrezi documentul de calitate primit de la furnizor (declarație de performanță sau de conformitate, certificat, agrement) și verifici că se potrivește cu produsul pus în operă. <span class="bb-law">Legea 10/1995, art. 23 lit. f); HG 668/2017; HG 343/2017, Anexa 6, pct. 8 lit. b)</span>`},
  {k:["dispozitie santier","dispozitii santier"], a:()=>`<b>Dispoziția de șantier</b> e documentul prin care proiectantul modifică sau completează proiectul în timpul execuției. Trebuie să fie completă, cu desene, și se înregistrează în registrul unic de dispoziții; ISC constată des dispoziții lipsă sau fără desene. <span class="bb-law">HG 343/2017, Anexa 6, pct. 8 lit. b); Ordinul 839/2009, art. 67</span>`},
  {k:["jurnal evenimente","jurnalul evenimentelor"], a:()=>`<b>Jurnalul evenimentelor</b> face parte din cartea tehnică (capitolul D) și se ține de proprietar: consemnează evenimentele din exploatare (reparații, intervenții, evenimente deosebite). <span class="bb-law">HG 343/2017, Anexa 6, pct. 10 lit. h)</span>`},
  {k:["isc","inspectoratul","control isc","ce verifica isc","isc verifica","verifica isc"], a:()=>`<b>ISC</b> (Inspectoratul de Stat în Construcții) controlează calitatea pe faze determinante și participă la recepție, unde examinează documentele din art. 15 alin. (3), cu excepția devizului general. Deficiențele cele mai frecvente: program de faze determinante lipsă, documente de calitate lipsă, dispoziții de șantier fără desene, cartea tehnică incompletă și lipsa proiectului as built. ${go("conformitate","Verifică dosarul")} <span class="bb-law">Ordinul MDRAP 1370/2014; HG 343/2017, art. 15 alin. (4)</span>`}
];

const NO_L = () => `Deschide întâi o lucrare: alege domeniul de pe pagina de intrare sau o lucrare din listă.`;
function bbLipsuri(){
  if(!CUR) return NO_L();
  const out = [];
  if(!S.docs.length) return `Încă nu ai încărcat documente, așa că nu am ce verifica. Începe de la <b>Inventar → Adaugă folder</b>. ${go("inventar","Deschide Inventarul")}`;
  const ev = cfEval().filter(x=>x.st==="miss");
  const bl = ev.filter(x=>x.r.grav!=="recom");
  if(bl.length) out.push(`<b>${bl.length}</b> ${bl.length===1?"cerință legală lipsește":"cerințe legale lipsesc"} pentru faza curentă și pot bloca controlul ISC sau recepția:<ul>${bl.slice(0,6).map(x=>`<li>${esc(x.r.titlu)} <span class="bb-law">${esc(x.r.temei)}</span></li>`).join("")}</ul>${bl.length>6?`și încă ${bl.length-6}.`:""}`);
  if(activeTpls().length){ const m = ctMissing(false); if(m.length) out.push(`În cartea tehnică (capitolele A și B) lipsesc <b>${m.length}</b> documente, de exemplu: ${m.slice(0,3).map(i=>esc(lden(i))).join("; ")}.`); }
  const lo = openLipsuri().length; if(lo) out.push(`În lista de Lipsuri ai <b>${lo}</b> ${lo===1?"document deschis":"documente deschise"}.`);
  if(!out.length) return `Nu găsesc nimic lipsă pentru faza curentă. Verifică totuși faza aleasă la Conformitate și, dacă e cazul, completează parametrii cărții tehnice. ${go("conformitate","Deschide Conformitate")}`;
  return out.join("<br><br>") + `<br>${go("conformitate","Vezi Conformitate")} ${go("lipsuri","Vezi Lipsuri")}`;
}
function bbCereri(){
  if(!CUR) return NO_L();
  if(!S.cereri.length) return `Nu ai trimis încă nicio cerere. Le pregătești de la <b>Cereri</b>, din lipsurile grupate pe expeditor. ${go("cereri","Deschide Cereri")}`;
  const late = S.cereri.map(c=>({c, st:cerStatus(c)})).filter(x=>x.st.late);
  const open = S.cereri.filter(c=>!cerStatus(c).done).length;
  if(!late.length) return `Ai <b>${open}</b> ${open===1?"cerere deschisă":"cereri deschise"} și niciuna nu a depășit termenul. ${go("cereri","Deschide Cereri")}`;
  return `Au depășit termenul:<ul>${late.map(x=>`<li><b>${esc(x.c.catre)}</b> — ${x.st.total-x.st.got} ${x.st.total-x.st.got===1?"document":"documente"}, întârziere ${x.st.over} ${x.st.over===1?"zi":"zile"}</li>`).join("")}</ul>Trimite-le o <b>Reamintire</b> de la Cereri: mesajul conține doar documentele încă neprimite. ${go("cereri","Deschide Cereri")}`;
}
function bbNext(){
  if(!CUR) return `Alege domeniul lucrării de pe pagina de intrare și apasă <b>Lucrare nouă</b>, sau deschide o lucrare din listă.`;
  if(!S.dom.length) return `Bifează domeniile lucrării la Proiect: de ele depind cartea tehnică și verificările. ${go("proiect","Deschide Proiect")}`;
  const urgF = fazeUrgente();
  if(urgF.length){ const f = urgF[0], st = fazaStatus(f); return `Atenție la faza determinantă „${esc(f.den)}”: ${esc(st.txt)}. ${go("executie:faze","Vezi fazele")}`; }
  if(!S.docs.length) return `Primul pas: încarcă documentele lucrării de la <b>Inventar → Adaugă folder</b>. ${go("inventar","Deschide Inventarul")}`;
  const nev = dupGroups().filter(x=>!x.docs.some(d=>d.viz)).length;
  if(nev) return `Ai <b>${nev}</b> ${nev===1?"grup":"grupuri"} de duplicate fără versiunea în vigoare aleasă. Rezolvă-le întâi, ca opisul și verificările să lucreze pe documentele corecte. ${go("duplicate","Deschide Duplicate")}`;
  const bl = cfEval().filter(x=>x.st==="miss" && x.r.grav!=="recom").length;
  if(bl) return `Verifică lipsurile legale: ${bl} ${bl===1?"cerință":"cerințe"} la Conformitate. Cele care nu sunt de fapt lipsă le marchezi „Am documentul”; restul le trimiți la Lipsuri și le ceri de la Cereri. ${go("conformitate","Deschide Conformitate")}`;
  const nec = openLipsuri().filter(l=>!lipsaCerere(l)).length;
  if(nec) return `Ai ${nec} ${nec===1?"lipsă necerută":"lipsuri necerute"}. Pregătește cererile către cei care trebuie să le trimită. ${go("cereri","Deschide Cereri")}`;
  const est = S.docs.filter(d=>d.dataSrc==="estimat").length;
  if(est) return `Corectează cele ${est} date estimate (portocalii) din Inventar, ca opisul să aibă datele reale ale actelor. ${go("inventar","Deschide Inventarul")}`;
  return `Dosarul arată bine. Poți genera opisul și borderourile pentru predare. ${go("rezultate","Opis")} ${go("carte","Borderouri")}`;
}

function bbAnswer(q){
  const have = new Set(words(q));
  if(!have.size) return null;
  let best = null, bs = 0;
  // „opis” se potrivește cu „opisul”: comparăm după început, de la 4 litere în sus
  const hv = [...have];
  const has = w => have.has(w) || (w.length>=4 && hv.some(h=>h.length>=4 && (h.startsWith(w) || w.startsWith(h))));
  // o frază întreagă câștigă (cu cât mai lungă, cu atât mai specifică); parțial doar cu minimum două cuvinte comune
  const score = phrases => { let m = 0; for(const p of phrases){ const w = words(p); if(!w.length) continue; const hit = w.filter(has).length; const s = hit===w.length ? 10 + w.length : (hit>=2 ? hit/w.length*5 : 0); if(s>m) m=s; } return m; };
  for(const e of BB_CTX.concat(BB_KB)){ const s = score(e.k); if(s>bs){ bs=s; best=e; } }
  // cerințele din Conformitate răspund după titlul lor
  for(const r of CF_RULES){ const s = score([r.titlu.replace(/\(.*?\)/g,""), ...(r.kws||[])]); if(s>bs){ bs=s; best={a:()=>`<b>${esc(r.titlu)}</b>. ${esc(r.deCe)} <span class="bb-law">${esc(r.temei)}</span> ${go("conformitate","Vezi în Conformitate")}`}; } }
  return bs >= 2.5 ? best.a() : null;
}

function metrics(){
  const d = S.docs;
  const tot = d.length;
  const dupCount = dupGroups().reduce((a,g)=>a+g.docs.length,0);
  const superseded = d.filter(x=>x.dup).length;
  const ncl = d.filter(x=>x.cap==="Neclasificat").length;
  const scans = d.filter(x=>isScan(x.name)).length;
  const est = d.filter(x=>x.dataSrc==="estimat").length;
  const byCap = {};
  for(const c of CAPS) byCap[c] = d.filter(x=>x.cap===c).length;
  const cer = S.cereri.map(cerStatus);
  return {tot, dupCount, superseded, ncl, scans, est, byCap, lipsuri:openLipsuri().length,
    cerDeschise: cer.filter(x=>!x.done).length, cerIntarziate: cer.filter(x=>x.late).length,
    necerute: openLipsuri().filter(l=>!lipsaCerere(l)).length};
}

/* ---------------- opis ---------------- */
function buildOpis(){
  const m = S.meta;
  const order = CAPS.filter(c=>c!=="Neclasificat").concat(["Neclasificat"]);
  const roman = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  let n = 0, rows = "";
  order.forEach((cap, i)=>{
    const ds = S.docs.filter(d=>d.cap===cap && !d.dup);
    const ls = openLipsuri().filter(l=>l.cap===cap);
    if(!ds.length && !ls.length) return;
    rows += `<tr class="cap"><td colspan="5">${roman[i]||""}. ${esc(cap)}</td></tr>`;
    ds.sort((a,b)=>(a.data||"").localeCompare(b.data||"")||a.name.localeCompare(b.name));
    for(const d of ds){
      n++;
      rows += `<tr><td>${String(n).padStart(3,"0")}</td><td>${esc(d.name)}</td><td>${esc(d.sursa==="primit"?("primit · "+(d.dela||"—")):(d.sursa==="propriu"?"propriu":"—"))}</td><td>${esc(d.dataSrc==="estimat"?"":roDate(d.data))}</td><td>atașat</td></tr>`;
    }
    for(const l of ls){
      n++;
      rows += `<tr class="miss"><td>${String(n).padStart(3,"0")}</td><td>${esc(lden(l))}</td><td>${esc(l.dela||"—")}</td><td>—</td><td>LIPSĂ</td></tr>`;
    }
  });
  const now = new Date();
  const dt = now.toLocaleDateString("ro-RO")+", ora "+now.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
  return `
  ${antetHtml()}
  <div class="opis-h">
    <h2>OPIS — ${esc(m.proiect||"Proiect")}</h2>
    <div class="m">
      Firma: ${esc(m.firma||"—")} · Beneficiar: ${esc(m.beneficiar||"—")} · Contract: ${esc(m.contract||"—")}<br>
      Amplasament: ${esc(m.amplasament||"—")} · Emis ${dt} · ${n} poziții, din care ${openLipsuri().length} lipsă
    </div>
  </div>
  <table class="opis">
    <thead><tr><th style="width:38px">Poz.</th><th>Denumire document</th><th style="width:150px">Sursă</th><th style="width:74px">Data</th><th style="width:60px">Stare</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="5">Niciun document.</td></tr>`}</tbody>
  </table>
  <div class="pf">Opis generat cu Schela · Atelier. Documentele marcate LIPSĂ nu se regăsesc în dosarul predat și se recuperează de la sursele indicate.</div>`;
}

function roDate(iso){
  if(!iso) return "";
  const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}
function csvEsc(v){ const s=String(v??""); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportCsv(){
  const src = {nume:"din denumire", text:"din textul documentului", estimat:"estimata (data fisierului)", manual:"introdusa manual"};
  const head = ["Denumire","Cale","Capitol","Nr. document","Data document","Sursa datei","Sursa","De la cine","In vigoare","Inlocuit","In grup de duplicate","Extensie","Marime (bytes)","SHA-256"];
  const lines = [head.join(";")].concat(S.docs.map(d=>[
    d.name, d.path, d.cap, d.nr||"", d.data, src[d.dataSrc]||"", d.sursa, d.dela, d.viz?"da":"", d.dup?"da":"", d.grp?"da":"", d.ext, d.size, d.hash||""
  ].map(csvEsc).join(";")));
  download((S.meta.proiect||"inventar").replace(/[^\w\-]+/g,"_")+"_inventar.csv", "﻿"+lines.join("\r\n"), "text/csv;charset=utf-8");
}

function exportRaport(){
  const m = metrics();
  const rows = [
    ["Firma", S.meta.firma],
    ["Proiect", S.meta.proiect],
    ["Documente inventariate", m.tot],
    ["Documente in grupuri de duplicate", m.dupCount],
    ["Documente lipsa", m.lipsuri],

    ["Cereri deschise", m.cerDeschise],

    ...CAPS.map(c=>["Documente — "+c, m.byCap[c]])
  ];
  download((S.meta.proiect||"statistici").replace(/[^\w\-]+/g,"_")+"_statistici.csv",
    "﻿"+[["Indicator","Valoare"].join(";")].concat(rows.map(r=>r.map(csvEsc).join(";"))).join("\r\n"),
    "text/csv;charset=utf-8");
}
