<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Schela · Atelier</title>
<style>
:root{
  --ground:#F1F3F2; --surface:#FBFCFB; --surface-2:#E7ECEA; --surface-3:#F5F7F6;
  --ink:#14212B; --muted:#5B6B76; --faint:#8496A1;
  --line:#CBD5D6; --line-soft:#DEE5E4;
  --blue:#235C82; --blue-soft:#DCE7EE;
  --ochre:#A9620F; --ochre-soft:#F2E4D2;
  --green:#2F6B4F; --green-soft:#DFEBE4;
  --red:#9C3B2E; --red-soft:#F3E0DC;
  --fd:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:var(--fd);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-variant-numeric:tabular-nums;background:var(--ground);color:var(--ink);font-family:var(--fd);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:1px}

.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}

/* sidebar */
.side{background:#14212B;display:flex;flex-direction:column;padding:18px 0;overflow:auto}
.brand{padding:0 18px 18px;display:flex;align-items:baseline;gap:1px}
.brand b{font-size:22px;font-weight:800;color:#FBFCFB;letter-spacing:-.03em}
.brand i{font-style:normal;color:#7FB4D6;font-size:22px;font-weight:800}
.brand em{font-style:normal;font-size:12px;color:#6E8391;font-family:var(--fm);letter-spacing:.14em;text-transform:uppercase;margin-left:8px;align-self:center}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 11px;border:none;border-radius:4px;background:transparent;color:#A9BAC6;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:#1B2A36;color:#DEE7ED}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.nav .n{margin-left:auto;font-family:var(--fm);font-size:12px;color:#6E8391}
.nav button.on .n{color:#CFE2EF}
.sidefoot{margin-top:auto;padding:14px 18px 0;border-top:1px solid #22313E;margin-left:10px;margin-right:10px}
.sidefoot p{margin:0;font-size:12px;line-height:1.5;color:#6E8391}

/* main */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--surface);border-bottom:1px solid var(--line-soft);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--muted);flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{margin-left:auto}
.view{flex:1;overflow:auto;padding:18px 20px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:4px;background:var(--blue);color:#fff;border:1px solid var(--blue);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1C4B6B}
.btn.g{background:var(--surface);color:#3F5563;border-color:var(--line)}
.btn.g:hover{background:var(--surface-2)}
.btn.o{background:var(--ochre);border-color:var(--ochre)}
.btn.o:hover{background:#8E520C}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* cards */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.lbl{font-family:var(--fd);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
textarea{height:auto;padding:8px 10px;resize:vertical}
textarea.grow{resize:none;overflow:hidden;min-height:34px;line-height:1.35;padding:7px 10px}
.grid2 > .wide{grid-column:1/-1}
select{cursor:pointer}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:6px;padding:13px 15px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);margin-top:3px}
.stat.hot .v{color:var(--ochre)}
.stat.bad .v{color:var(--red)}
.stat.ok .v{color:var(--green)}

/* table */
.tw{background:var(--surface);border:1px solid var(--line-soft);border-radius:6px;overflow:auto;max-height:calc(100vh - 300px)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{position:sticky;top:0;background:var(--surface-2);font-family:var(--fd);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;z-index:2;white-space:nowrap}
tbody tr:hover{background:var(--surface-3)}
tbody tr.sel{background:var(--blue-soft)}
td.fn{font-family:var(--fm);font-size:13px;max-width:300px;word-break:break-all}
td .path{color:var(--faint);font-size:12px;display:block;margin-top:2px}
td select,td input[type=text],td input[type=date]{height:26px;padding:0 6px;font-size:13px;border-radius:3px}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:2px;font-size:12px;font-weight:600;white-space:nowrap}
.t-viz{background:var(--green-soft);color:var(--green)}
.t-dup{background:var(--ochre-soft);color:var(--ochre)}
.t-none{background:var(--surface-2);color:var(--faint)}
.chk{width:15px;height:15px;cursor:pointer}

/* filter bar */
.fbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar input[type=text]{width:220px;height:32px}
.fbar select{width:auto;min-width:130px;height:32px}
.count{font-family:var(--fm);font-size:13px;color:var(--muted);margin-left:auto}


/* dup groups */
.dg{background:var(--surface);border:1px solid var(--line-soft);border-radius:6px;margin-bottom:11px;overflow:hidden}
.dg-h{background:var(--ochre-soft);padding:9px 14px;font-size:14px;font-weight:600;color:var(--ochre);display:flex;gap:10px;align-items:center}
.dg-h .c{font-family:var(--fm);font-size:12.5px;margin-left:auto}
.dg table{font-size:13px}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h3{font-size:17px;color:var(--ink);margin:0 0 8px}
.empty p{max-width:44ch;margin:0 auto 16px;line-height:1.55;font-size:14.5px}

.note{background:var(--blue-soft);border-left:3px solid var(--blue);padding:12px 15px;border-radius:0 4px 4px 0;font-size:14px;line-height:1.5;margin-bottom:14px}
.note b{font-weight:700}
.warn{background:var(--ochre-soft);border-left-color:var(--ochre)}

td .est{display:block;font-size:12px;color:var(--ochre);margin-top:2px;font-weight:600;cursor:help}
td input.isest{color:var(--ochre);border-color:#E3C9A6;background:#FFFBF5}

.busy{position:fixed;inset:0;background:rgba(20,33,43,.45);display:none;align-items:center;justify-content:center;z-index:50}
.busy.on{display:flex}
.busy div{background:var(--surface);padding:18px 26px;border-radius:6px;font-size:14.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2)}

.t-new{background:var(--blue-soft);color:var(--blue)}
.t-late{background:var(--red-soft);color:var(--red)}
.ct-ch{margin-bottom:12px}
.bb-fab{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 13px;border-radius:23px;background:var(--blue);color:#fff;border:none;box-shadow:0 6px 18px rgba(20,33,43,.25);font-weight:600;font-size:15px;cursor:pointer}
.bb-fab:hover{background:#1C4B6B}
.bb{position:fixed;right:20px;bottom:78px;z-index:31;display:none;width:min(410px,calc(100vw - 24px))}
.bb.on{display:block}
.bb-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(20,33,43,.25);display:flex;flex-direction:column;max-height:min(620px,calc(100vh - 110px))}
.bb-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.bb-logo{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.bb-h b{display:block;font-size:15px}
.bb-h span{font-size:12px;color:var(--muted)}
.bb-x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.bb-log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.bb-msg{font-size:14px;line-height:1.5;padding:9px 12px;border-radius:8px;max-width:94%}
.bb-msg.bot{background:var(--surface-2);align-self:flex-start}
.bb-msg.me{background:var(--blue);color:#fff;align-self:flex-end}
.bb-msg ul{margin:6px 0;padding-left:18px}
.bb-msg .btn{margin:8px 6px 0 0}
.bb-law{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.bb-sug{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--line-soft)}
.bb-sug button{font-size:13px;border:1px solid var(--line);background:var(--surface-3);border-radius:14px;padding:4px 11px;cursor:pointer;color:var(--ink)}
.bb-sug button:hover{background:var(--surface-2)}
.bb-in{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line-soft)}
.bb-in input{flex:1;height:34px}
.view{padding-bottom:96px}
@media (max-width:760px){ .bb-fab{right:12px;bottom:12px} .bb{right:12px;bottom:68px} }
.cf-row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.cf-row:last-child{border-bottom:none}
.cf-main{flex:1;min-width:0}
.cf-t{font-weight:600;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.cf-why{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.45}
.cf-law{font-size:12px;color:var(--muted);margin-top:3px}
.cf-doc{font-size:12px;color:var(--green);margin-top:3px}
.cf-act{display:flex;flex-direction:column;gap:6px;flex:none}
.cf-row.later,.cf-row.na{opacity:.6}
@media (max-width:760px){ .cf-row{flex-direction:column} .cf-act{flex-direction:row;flex-wrap:wrap} }
.ct-cht{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 6px}
.ct-row{display:grid;grid-template-columns:90px 1fr 70px 170px;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.mut i{background:var(--faint)}
details.ct-det summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14.5px}
tr.grp-row td{background:var(--surface-3);font-weight:700;font-size:13px;color:var(--muted)}
@media (max-width:640px){ .ct-row{grid-template-columns:70px 1fr 60px} .ct-row .tag{grid-column:1/-1} }
/* telefon: meniul devine o bandă orizontală sus */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 12px 0 4px;flex:none}
  .brand em{display:none}
  .nav{flex-direction:row;padding:0;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px;width:auto}
  .sidefoot{display:none}
  .top{padding:10px 12px}
  .view{padding:14px 12px 96px}
  .grid2{grid-template-columns:1fr}
  .tw table{min-width:640px}
  .fbar input[type=text]{width:100%}
}
.nav b.late{color:#fff;background:var(--red);border-radius:8px;padding:0 6px;font-weight:600}
.grp{border:1px solid var(--line-soft);border-radius:6px;margin-bottom:10px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;background:var(--surface-3);border-bottom:1px solid var(--line-soft)}
.grp-b{display:flex;flex-direction:column;gap:5px;padding:10px 12px}
td .items{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:13px;color:var(--muted)}
td .items .ok{color:var(--green)}
.muted{color:var(--muted);font-size:13px}
tr.off td{opacity:.55}
tr.done td{background:#F4F8F5}
label.ck{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(20,33,43,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:8px;width:min(1100px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.mh{display:flex;align-items:baseline;gap:12px;padding:16px 18px 6px}
.mh h2{margin:0;font-size:20px;letter-spacing:-.02em}
.msum{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 18px 12px;font-size:14px;color:var(--muted)}
.msum b{color:var(--ink);font-family:var(--fm)}
.mf{display:flex;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-soft);margin-top:12px}
.mf .muted{margin-right:auto;max-width:60ch;line-height:1.45;font-size:13px}

/* print */
#print{display:none}
@media print{
  .app,.busy,.modal,.bb-fab,.bb{display:none!important}
  #print{display:block!important;padding:0}
  body{background:#fff;font-size:10.5pt}
  #print{font-family:var(--fd)}
  @page{size:A4 portrait;margin:16mm 14mm}
  .opis-h{border-bottom:2px solid #14212B;padding-bottom:10px;margin-bottom:16px}
  .opis-h h2{font-size:16pt;margin:0 0 4px}
  .opis-h .m{font-family:var(--fm);font-size:8pt;color:#5B6B76;line-height:1.6}
  table.opis{width:100%;border-collapse:collapse;font-size:9pt}
  table.opis th{background:#E7ECEA;font-size:7.5pt;letter-spacing:.04em;font-weight:600;padding:6px 8px;border-bottom:1px solid #CBD5D6}
  table.opis td{padding:5px 8px;border-bottom:1px solid #EDF1F0}
  table.opis td:nth-child(1),table.opis td:nth-child(4),table.opis td:nth-child(5){white-space:nowrap}
  table.opis tr.cap td{background:#EAF2F7;font-weight:700;color:#235C82;font-size:8.5pt;letter-spacing:.04em;text-transform:uppercase}
  table.opis tr.miss td{background:#FDF6EE;color:#A9620F}
  tr{break-inside:avoid}
  .bd{break-after:page;font-size:10.5pt;line-height:1.45}
  .bd:last-child{break-after:auto}
  .bd-h{border-collapse:collapse;margin-bottom:28px}
  .bd-h td{padding:2px 14px 2px 0;vertical-align:top}
  .bd-h td:first-child{font-weight:700;white-space:nowrap}
  .bd-t{text-align:center;font-weight:700;font-size:12.5pt;margin:10px 0 4px}
  .bd-c{text-align:center;font-size:9.5pt;color:#5B6B76;margin-bottom:22px}
  .bd-a{font-weight:700;margin-bottom:10px}
  .bd-i{margin:3px 0 3px 14px}
  .bd-s{margin:1px 0 1px 40px;font-size:9.5pt}
  .bd-miss{color:#9C3B2E;font-weight:700;font-size:8.5pt;margin-left:6px}
  .adr{font-size:11pt;line-height:1.55}
  .adr-h{font-size:12pt;border-bottom:1.5px solid #14212B;padding-bottom:8px;margin-bottom:18px;min-height:20px}
  .adr-nr{margin-bottom:18px}
  .adr-to{margin-bottom:6px}
  .adr-ref{margin-bottom:22px}
  .adr-body{white-space:normal}
  .pf{margin-top:14px;font-family:var(--fm);font-size:8pt;color:#5B6B76;border-top:1px solid #CBD5D6;padding-top:8px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Schela</b><i>.</i><em>Atelier</em></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <p>Totul rămâne pe calculatorul tău. Nimic nu se trimite nicăieri.</p>
      <p style="margin-top:8px">Salvează des: <b style="color:#A9BAC6">Proiect → Salvează</b></p>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="vtitle">Proiect</h1>
      <span class="sub" id="vsub"></span>
      <span class="spacer"></span>
      <button class="btn g sm" id="btnSave">Salvează proiect</button>
      <button class="btn g sm" id="btnLoad">Deschide proiect</button>
      <input type="file" id="fileLoad" accept=".json" hidden>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<button class="bb-fab" id="bbFab" aria-label="Întreabă-l pe Boloboc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="2"/><rect x="8.5" y="10" width="7" height="4" rx="2"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg><span>Boloboc</span></button>
<div class="bb" id="bb"></div>

<div id="print"></div>
<div class="modal" id="intake" role="dialog" aria-modal="true" aria-label="Verificare la intrare"></div>
<div class="busy" id="busy" role="status" aria-live="polite"><div id="busyT">Se citesc fișierele…</div></div>

<script>
"use strict";

/* ---------------- state ---------------- */
const CAPS = ["Proiectare","Execuție","SSM și SU","Calitate","Contracte","Aprovizionare","Corespondență","As-built","Neclasificat"];
const HASH_MAX = 200*1048576;   // fișierele mai mari nu primesc amprentă
const JUNK = /^(thumbs\.db|desktop\.ini|\.ds_store)$|^~\$|^\._/i;
const KEY = "schela_atelier_v1";

let S = blank();

function blank(){
  return {
    meta:{firma:"",proiect:"",beneficiar:"",contract:"",amplasament:"",perioada:"",inceput:new Date().toISOString().slice(0,10),semnatar:"",emitent:""},
    docs:[],
    lipsuri:[],
    cereri:[],
    ct:null,
    conf:null,
    note:""
  };
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/ș|ş/g,"s").replace(/ț|ţ/g,"t").replace(/ă|â/g,"a").replace(/î/g,"i");

function fmtSize(b){
  if(b==null) return "";
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(0)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}

/* ---------------- classification ---------------- */
/* Regulile se verifică în ordine; prima potrivire câștigă.
   Potrivirea se face pe cuvinte întregi („pv” nu mai prinde „PVC”). */
const RULES = [
  // avize și acte de proiectare cu formulare clară — înaintea avizelor de însoțire
  ["Proiectare", ["certificat de urbanism","aviz cte","aviz ctes","aviz de amplasament","aviz amplasament","aviz tehnic","aviz tehnic de racordare","atr","aviz de principiu","aviz isu","aviz de mediu","acord de mediu","aviz favorabil","aviz electrica","aviz distributie","aviz gaze","aviz apa canal","aviz politie","aviz politia rutiera","aviz drumuri","aviz cultura","aviz dsp","autorizatie de construire","autorizatie construire","expertiza","expertiza tehnica","audit energetic"]],
  ["Aprovizionare", ["aviz de insotire","aviz insotire","avize de insotire","aviz marfa","aviz","avize","nir","bon de consum","bon consum","bonuri de consum","fisa de magazie","livrare","dispozitie de livrare"]],
  ["Execuție", ["proces verbal","procese verbale","pv","receptie","atasament","atasamente","situatie de lucrari","situatie lucrari","situatii de lucrari","jurnal de santier","jurnal santier","ordin de incepere","trasare","faza determinanta","faze determinante","fd","comanda de lucru","condica"]],

// text → „ cuvinte separate ” (litere și cifre lipite se despart: pv12 → pv 12)
function toks(s){
  return " " + norm(s).replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2")
    .replace(/[^a-z0-9]+/g," ").trim() + " ";
}
const RULES_N = RULES.map(([cap, keys]) => [cap, keys.map(toks)]);
function matchCap(text){
  const t = toks(text);
  for(const [cap, keys] of RULES_N) for(const k of keys) if(t.includes(k)) return cap;
  return "";
}
// întâi denumirea fișierului, abia apoi numele folderelor
function guessCap(name, path){
  const base = String(name).replace(/\.[a-z0-9]{1,6}$/i,"");
  return matchCap(base) || matchCap(path||"") || "Neclasificat";
}
function validIso(y,m,d){
  const dt = new Date(Date.UTC(+y, +m-1, +d));
  return dt.getUTCFullYear()===+y && dt.getUTCMonth()===+m-1 && dt.getUTCDate()===+d;
}
function guessDate(name){
  const t = String(name);
  let m = t.match(/(?:^|\D)(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?!\d)/);
  if(m && validIso(m[1],m[2],m[3])) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/(?:^|\D)(0?[1-9]|[12]\d|3[01])[-_. ](0?[1-9]|1[0-2])[-_. ](20\d{2})(?!\d)/);
  if(m && validIso(m[3],m[2],m[1])) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
function baseKey(name){
  const raw = String(name).replace(/\.[a-z0-9]{1,6}$/i,"");
  const isCopy = /\(\s*\d+\s*\)|copy|copie/i.test(raw);
  let n = norm(raw).replace(/[^a-z0-9]+/g," ").trim();
  // dates: 28 08 2026 / 2026 08 28 / 28 08 26
  n = n.replace(/\b(0?[1-9]|[12]\d|3[01]) (0?[1-9]|1[0-2]) (20\d{2}|\d{2})\b/g," ");
  n = n.replace(/\b20\d{2} (0[1-9]|1[0-2]) (0[1-9]|[12]\d|3[01])\b/g," ");
  n = n.replace(/\b20\d{2}\b/g," ");
  // version markers
  n = n.replace(/\b(rev|revizia|v|ver|versiunea|varianta|nr) ?\d+\b/g," ");
  n = n.replace(/\b(final|finala|ultima|ultim|copy|copie|scan|scanat)\b/g," ");
  if(isCopy) n = n.replace(/\b\d{1,2}\b\s*$/,"");
  return n.replace(/\s+/g," ").trim();
}
function extOf(n){ const m=String(n).match(/\.([a-z0-9]{1,6})$/i); return m?m[1].toLowerCase():""; }
function isScan(n){ return ["jpg","jpeg","png","tif","tiff","heic","bmp","webp"].includes(extOf(n)); }

// completează câmpurile noi la proiectele salvate cu versiunea veche
function migrate(){
  for(const d of S.docs){
    if(d.hash===undefined) d.hash = "";
    if(d.dataSrc===undefined){
      const g = guessDate(d.name);
      d.dataSrc = !d.data ? "" : (g && g===d.data) ? "nume" : (d.data===d.mtime ? "estimat" : "manual");
    }
  }
  // cronometrul și contoarele au fost scoase — nu le mai păstrăm în proiect
  delete S.timers; delete S.running; delete S.runningSince; delete S.counters;
  // cererile au nevoie de un identificator stabil pentru fiecare lipsă
  S.lipsuri.forEach(l=>{ if(!l.id) l.id = newId("l"); });
  if(!Array.isArray(S.cereri)) S.cereri = [];
  if(S.meta.semnatar===undefined) S.meta.semnatar = "";
  if(S.meta.emitent===undefined) S.meta.emitent = "";
  if(S.ct===undefined) S.ct = null;
  if(S.conf===undefined) S.conf = null;
}
const pl = (n, one, many) => n + " " + (n===1 ? one : many);
function newId(p){ return p + Math.random().toString(36).slice(2,10); }

function download(name, text, type){
  const b = new Blob([text], {type: type||"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();

}

// amprenta conținutului (SHA-256), calculată local — găsește fișierele identice cu nume diferite
async function hashFile(f){
  if(!(window.crypto && crypto.subtle) || f.size > HASH_MAX) return "";
  try{
    const h = await crypto.subtle.digest("SHA-256", await f.arrayBuffer());
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return ""; }
}

/* ---- VERIFICARE LA INTRARE ----
   Niciun fișier nu intră direct în inventar. Fiecare e comparat cu ce există deja
   și cu lista de lipsuri, iar omul aprobă ce se adaugă. */
const STOP = new Set(["de","si","la","din","pentru","pt","nr","cu","in","pe","al","a","ale","privind","catre","sau","the","st","ce","un","va","ma","mi","ai","am","au","eu","le","ii","se","sa","cum","imi"]);
// prescurtări uzuale din denumirile de fișiere
const ABBR = {pv:"proces verbal", pvr:"proces verbal receptie", cc:"certificat calitate", dc:"declaratie conformitate", dop:"declaratie performanta"};
// cuvinte semnificative, reduse la primele 5 litere ca să nu conteze terminația (recepție/recepția)
function words(s){
  const raw = toks(String(s).replace(/\.[a-z0-9]{1,6}$/i,"")).trim().split(" ");
  const out = [];
  for(const w of raw){
    if(ABBR[w]){ out.push(...ABBR[w].split(" ")); continue; }
    out.push(w);
  }
  // cuvintele de 2 litere care rămân (TG, TE, PT, LES) sunt identificatori și contează
  return out.filter(w => w && !STOP.has(w) && (w.length>=2 || /\d/.test(w)))
            .map(w => /\d/.test(w) ? w : w.slice(0,5));
}
// cât de bine acoperă denumirea fișierului cuvintele din denumirea lipsei (0…1)
function lipsaScore(fileName, lipsaDen){
  const need = [...new Set(words(lipsaDen))]; if(!need.length) return 0;
  const have = new Set(words(fileName));
  // numerele (stâlpi, tronsoane, poziții) identifică documentul: dacă unul lipsește, nu e același document
  if(need.some(w=>(/\d/.test(w) || w.length===2) && !have.has(w))) return 0;
  return need.filter(w=>have.has(w)).length / need.length;
}
// codul unui document (ex. 26L05.2-19.1) apare în denumire? 19.1 nu se confundă cu 19.10 sau 19.1.1
const codeNorm = s => String(s||"").replace(/\s+/g,"").replace(/[–—_]/g,"-").toLowerCase();
function codeIn(fileName, cod){
  if(!cod) return false;
  const rx = codeNorm(cod).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return new RegExp(rx + "(?![0-9]|\\.[0-9])").test(codeNorm(fileName));
}
// fișierul poartă un cod din aceeași serie (ex. 26L05.2-…), chiar dacă altul
function hasSeriesCode(fileName, cod){
  const pre = codeNorm(cod).replace(/-[^-]*$/,"");
  return !!pre && codeNorm(fileName).includes(pre + "-");
}
const lden = l => (l.cod ? l.cod + " – " : "") + l.den;
const openLipsuri = () => S.lipsuri.filter(l=>!l.rez || !S.docs.some(d=>d.id===l.rez));

let INTAKE = null;   // {items, junk, again, first}

async function addFiles(list){
  const seen = new Set(S.docs.map(d=>d.path+"|"+d.name+"|"+d.size));
  const todo = []; let junk = 0, again = 0;
  for(const f of list){
    if(JUNK.test(f.name)){ junk++; continue; }
    const path = (f.webkitRelativePath||"").split("/").slice(0,-1).join("/");
    const k = path+"|"+f.name+"|"+f.size;
    if(seen.has(k)){ again++; continue; }
    seen.add(k); todo.push({f, path});
  }
  const cands = [];
  for(let i=0; i<todo.length; i++){
    const {f, path} = todo[i];
    if(i % 5 === 0){ busy(true, `Se verifică fișierele… ${i} din ${todo.length}`); await new Promise(r=>setTimeout(r,0)); }
    const fromName = guessDate(f.name);
    const mtime = f.lastModified ? new Date(f.lastModified).toISOString().slice(0,10) : "";
    cands.push({
      id: "d"+Math.random().toString(36).slice(2,10),
      name: f.name, path, size: f.size, ext: extOf(f.name), mtime,
      hash: await hashFile(f),
      cap: guessCap(f.name, path),
      data: fromName || mtime,
      dataSrc: fromName ? "nume" : (mtime ? "estimat" : ""),
      sursa:"", dela:"", viz:false, dup:false, grp:false, sel:false, obs:""
    });
  }
  busy(false);
  INTAKE = {items: judge(cands), junk, again, first: S.docs.length===0};
  if(!INTAKE.items.length){
    INTAKE = null;
    alert("Nimic nou de verificat." + (again?`\n${again} fișiere erau deja în inventar.`:"") + (junk?`\n${junk} fișiere de sistem ignorate.`:""));
    return;
  }
  renderIntake();
}

function judge(cands){
  const first = S.docs.length===0;
  const byHash = new Map(S.docs.filter(d=>d.hash).map(d=>[d.hash, d]));
  const byKey = new Map();
  S.docs.forEach(d=>{ const k=baseKey(d.name); if(k && /[a-z]{3}/.test(k) && !byKey.has(k)) byKey.set(k, d); });
  const free = openLipsuri();
  const taken = new Set();
  // între copii identice din același lot o păstrăm pe cea cu denumirea cea mai descriptivă (nu „scan_0042”)
  const descr = c => words(c.name).filter(w=>!/\d/.test(w) && !/^(scan|img|image|dsc|copy|copie|docum|file)/.test(w)).length + (guessDate(c.name)?1:0);
  cands = [...cands].sort((a,b)=> descr(b)-descr(a));
  return cands.map(c=>{
    // 1. copie identică a unui document existent sau a altui fișier din același lot
    if(c.hash && byHash.has(c.hash)){
      const o = byHash.get(c.hash);
      return {doc:c, kind:"copie", why: o.id ? `identic cu „${o.name}”` : `identic cu „${o.name}” din același lot`, act:"skip"};
    }
    if(c.hash) byHash.set(c.hash, {name:c.name});
    // 2. completează o lipsă
    let best = null, bs = 0;
    for(const l of free){
      if(taken.has(l)) continue;
      let s;
      if(l.cod && codeIn(c.name, l.cod)) s = 2;                 // codul exact câștigă
      else if(l.cod && hasSeriesCode(c.name, l.cod)) s = 0;      // alt cod din aceeași serie: alt document
      else s = lipsaScore(c.name, l.den);
      if(s>bs){ bs=s; best=l; }
    }
    if(best && bs >= 0.6){
      taken.add(best);
      return {doc:c, kind:"lipsa", lipsa:best, why:`completează lipsa „${lden(best)}”`, act:"add"};
    }
    // 3. versiune nouă a unui document existent
    const k = baseKey(c.name);
    if(k && byKey.has(k)){
      const o = byKey.get(k);
      const newer = (c.data||"") >= (o.data||"");
      return {doc:c, kind:"versiune", old:o, why:`aceeași denumire ca „${o.name}”`, act: newer ? "replace" : "skip"};
    }
    // 4. document nou
    return {doc:c, kind:"nou", why: first ? "prima încărcare" : "nu era în lista de lipsuri", act: first ? "add" : "skip"};
  });
}

function renderIntake(){
  const it = INTAKE; if(!it) return;
  const cnt = k => it.items.filter(x=>x.kind===k).length;

      <span><b>${cnt("copie")}</b> copii identice, respinse</span>

      ${it.junk?`<span><b>${it.junk}</b> fișiere de sistem ignorate</span>`:""}
    </div>
    ${!it.first && cnt("nou") ? `<div class="note warn" style="margin:0 18px 12px">Documentele noi care nu erau în lista de lipsuri sunt <b>debifate</b>. Bifează-le doar dacă dosarul are nevoie de ele.</div>` : ""}
    <div class="tw" style="max-height:52vh;margin:0 18px;border-radius:4px"><table>
      <thead><tr><th>Fișier</th><th style="width:150px">Verdict</th><th>De ce</th><th style="width:230px">Ce fac cu el</th></tr></thead>
      <tbody>${it.items.map((x,i)=>`<tr class="${x.act==="skip"?"off":""}">
        <td class="fn">${esc(x.doc.name)}${x.doc.path?`<span class="path">${esc(x.doc.path)}</span>`:""}</td>
        <td><span class="tag ${TAG[x.kind][0]}">${TAG[x.kind][1]}</span></td>
        <td style="font-size:13px;color:var(--muted)">${esc(x.why)}</td>
        <td>${ctl(x,i)}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="mf">
      <span class="muted">Verificarea compară conținutul exact (amprenta fișierului) și denumirile. Nu citește textul din document, deci două scanări diferite ale aceleiași hârtii nu sunt recunoscute ca identice.</span>
      <button class="btn g" id="inCancel">Renunță</button>
      <button class="btn" id="inOk" ${willAdd?"":"disabled"}>Adaugă ${willAdd} ${willAdd===1?"document":"documente"}</button>
    </div>
  </div>`;
  $("#intake").classList.add("on");
  $("#intake").querySelectorAll("[data-ic]").forEach(el=>el.onchange=()=>{ it.items[+el.dataset.ic].act = el.checked?"add":"skip"; renderIntake(); });
  $("#intake").querySelectorAll("[data-ia]").forEach(el=>el.onchange=()=>{ it.items[+el.dataset.ia].act = el.value; renderIntake(); });
  $("#inCancel").onclick = closeIntake;
  $("#inOk").onclick = commitIntake;
}
function closeIntake(){ INTAKE=null; $("#intake").classList.remove("on"); $("#intake").innerHTML=""; }

function commitIntake(){
  const it = INTAKE; if(!it) return;
  const openBefore = new Set(S.cereri.filter(c=>!cerStatus(c).done).map(c=>c.id));
  let n = 0, rez = 0, rep = 0;
  for(const x of it.items){
    if(x.act==="skip") continue;
    S.docs.push(x.doc); n++;
    if(x.kind==="lipsa"){ x.lipsa.rez = x.doc.id; if(x.lipsa.cap && x.doc.cap==="Neclasificat") x.doc.cap = x.lipsa.cap; rez++; }
    if(x.kind==="versiune" && x.act==="replace"){ markDups(); const g = dupGroups().find(g=>g.docs.includes(x.doc)); if(g) g.docs.forEach(d=>d.viz=false); x.doc.viz = true; rep++; }
  }
  closeIntake();
  markDups(); render();
  let msg = `${pl(n,"document adăugat","documente adăugate")}. Total: ${S.docs.length}.`;
  if(rez) msg += `\n${pl(rez,"lipsă rezolvată","lipsuri rezolvate")}.`;
  const doneNow = S.cereri.filter(c=>openBefore.has(c.id) && cerStatus(c).done);
  if(doneNow.length) msg += `\nCereri complete: ${doneNow.map(c=>c.catre).join(", ")}.`;
  if(rep) msg += `\n${pl(rep,"document înlocuit","documente înlocuite")} cu o versiune nouă.`;
  alert(msg);
}

/* ---- DUPLICATE ---- */
// grupuri = documente legate fie prin denumire asemănătoare, fie prin conținut identic
function dupGroups(){
  const parent = new Map();
  const find = x => { while(parent.get(x)!==x){ parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  const join = (a,b) => { a=find(a); b=find(b); if(a!==b) parent.set(a,b); };
  S.docs.forEach(d=>parent.set(d.id, d.id));
  const byHash = new Map(), byName = new Map();
  for(const d of S.docs){
    if(d.hash){ if(byHash.has(d.hash)) join(d.id, byHash.get(d.hash)); else byHash.set(d.hash, d.id); }
    const k = baseKey(d.name);
    if(k){ if(byName.has(k)) join(d.id, byName.get(k)); else byName.set(k, d.id); }
  }
  const g = new Map();
  for(const d of S.docs){ const r = find(d.id); if(!g.has(r)) g.set(r, []); g.get(r).push(d); }
  return [...g.entries()].filter(([,v])=>v.length>1).map(([r,v])=>{
    const hc = new Map(); v.forEach(d=>{ if(d.hash) hc.set(d.hash, (hc.get(d.hash)||0)+1); });
    return {
      key: r,
      // eticheta: cea mai descriptivă denumire din grup (nu „scan_0042”)
      label: v.map(d=>baseKey(d.name)).filter(k=>/[a-z]{3}/.test(k)).sort((a,b)=>b.length-a.length)[0] || v[0].name,
      exact: v.every(d=>d.hash && hc.get(d.hash)===v.length),
      twins: new Set(v.filter(d=>d.hash && hc.get(d.hash)>1).map(d=>d.id)),
      docs: v
    };
  });
}
function markDups(){
  const groups = dupGroups();
  const inGroup = new Set(), superseded = new Set();
  for(const g of groups){
    const hasWinner = g.docs.some(d=>d.viz);
    for(const d of g.docs){
      inGroup.add(d.id);
      if(hasWinner && !d.viz) superseded.add(d.id);
    }
  }
  for(const d of S.docs){
    d.grp = inGroup.has(d.id);
    d.dup = superseded.has(d.id);
    if(!d.grp) d.viz = false;   // grupul nu mai există → nici marcajul „în vigoare”
  }
}

function viewDuplicate(){
  const gs = dupGroups();
  if(!gs.length) return `<div class="card"><div class="empty"><h3>Niciun duplicat găsit</h3><p>Când adaugi documente, cele care par a fi versiuni ale aceluiași act apar aici grupate, ca să alegi care e cea în vigoare.</p></div></div>`;
  return `<div class="note warn"><b>Alege versiunea în vigoare</b> pentru fiecare grup. Celelalte rămân în inventar ca istoric, marcate ca duplicate. Grupurile sunt propuneri — dacă un grup e greșit, ignoră-l. Eticheta <span class="tag t-viz">conținut identic</span> înseamnă că fișierul e copia exactă a altuia din grup, chiar dacă are alt nume.</div>
  ${gs.map(g=>`
    <div class="dg">
      <div class="dg-h"><span>${esc(g.label||"(fără denumire)")}</span>${g.exact?`<span class="tag t-viz">toate identice</span>`:""}<span class="c">${g.docs.length} fișiere</span></div>
      <table><tbody>
        ${g.docs.map(d=>`<tr>
          <td style="width:110px"><button class="btn ${d.viz?"":"g"} sm" data-viz="${d.id}">${d.viz?"✓ în vigoare":"marchează"}</button></td>
          <td class="fn">${esc(d.name)}${!g.exact&&g.twins.has(d.id)?` <span class="tag t-viz">conținut identic</span>`:""}${d.path?`<span class="path">${esc(d.path)}</span>`:""}</td>
          <td class="num" style="width:90px">${esc(d.data||d.mtime||"")}</td>

        </tr>`).join("")}
      </tbody></table>
    </div>`).join("")}`;
}

/* ---- CERERI ----
   Lipsurile se grupează pe „de la cine se recuperează”. Pentru fiecare expeditor se
   generează o cerere cu termen; cererea se închide singură când documentele intră în inventar. */
function todayIso(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
const lipsaById = id => S.lipsuri.find(l=>l.id===id);
const isRez = l => !!(l && l.rez && S.docs.some(d=>d.id===l.rez));
const senderKey = s => norm(s).replace(/\s+/g," ").trim();

function cerStatus(c){
  const items = c.items.map(lipsaById).filter(Boolean);
  const got = items.filter(isRez).length;
  const done = !!c.inchisa || (items.length>0 && got===items.length);
  const over = !done && c.termen ? daysBetween(c.termen, todayIso()) : 0;
  return {items, got, total:items.length, done, late: over>0, over};
}
// cererea activă în care e inclusă o lipsă
function lipsaCerere(l){ return S.cereri.find(c=>!cerStatus(c).done && c.items.includes(l.id)); }
function pendingGroups(){
  const g = new Map();
  for(const l of openLipsuri()){
    if(lipsaCerere(l)) continue;
    const k = senderKey(l.dela);
    if(!g.has(k)) g.set(k, {name:(l.dela||"").trim(), items:[]});
    g.get(k).items.push(l);
  }
  return [...g.values()].sort((a,b)=> (a.name?0:1)-(b.name?0:1) || a.name.localeCompare(b.name));
}

function cerereText(c, reminder){
  const m = S.meta, st = cerStatus(c);
  const items = reminder ? st.items.filter(l=>!isRez(l)) : st.items;
  const list = items.map((l,i)=>`${i+1}. ${lden(l)}`).join("\n");
  const lucr = m.proiect ? `lucrării „${m.proiect}”${m.beneficiar?` (beneficiar: ${m.beneficiar})`:""}` : "lucrării";
  const head = reminder
    ? `Bună ziua,\n\nRevenim la solicitarea din data de ${roDate(c.trimis)} privind documentele ${lucr}. Următoarele documente nu au fost încă primite:`
    : `Bună ziua,\n\nPentru completarea documentației ${lucr}, vă rugăm să ne transmiteți următoarele documente:`;
  const term = c.termen ? `\n\n${reminder?"Vă rugăm să le transmiteți până la data de":"Termen solicitat:"} ${roDate(c.termen)}.` : "";
  const sig = [S.meta.semnatar, S.meta.emitent].filter(Boolean).join("\n");
  return `${head}\n\n${list}${term}\n\nVă mulțumim,${sig ? "\n"+sig : ""}`;
}

function viewCereri(){
  const groups = pendingGroups();
  const today = todayIso();

    const sa=cerStatus(a), sb=cerStatus(b);

  });
  const stTag = (c,st) => st.done ? (c.inchisa && st.got<st.total ? `<span class="tag t-none">închisă</span>` : `<span class="tag t-viz">completă</span>`)
    : st.late ? `<span class="tag t-late">întârziată ${st.over} ${st.over===1?"zi":"zile"}</span>`

  return `

  <div class="card">

      : !groups.length ? `<p class="muted" style="margin:0">Toate lipsurile deschise sunt deja cerute.</p>`
      : groups.map((g,gi)=>`<div class="grp" data-grp="${gi}">
        <div class="grp-h">
          ${g.name ? `<b>${esc(g.name)}</b>` : `<span class="tag t-late">fără expeditor</span> <input type="text" placeholder="De la cine se recuperează?" data-setdela="${g.items.map(l=>l.id).join(",")}" style="width:240px;height:28px">`}
          <span class="muted">${g.items.length} ${g.items.length===1?"document":"documente"}</span>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <span class="lbl" style="margin:0">Termen</span>
            <input type="date" data-term value="${addDays(today,7)}" style="width:150px;height:28px">
            <button class="btn sm" data-prep="${gi}" ${g.name?"":"disabled"}>Pregătește cererea</button>
          </span>
        </div>
        <div class="grp-b">${g.items.map(l=>`<label class="ck"><input type="checkbox" class="chk" data-lid="${l.id}" checked> ${esc(lden(l))} <span class="muted">· ${esc(l.cap)}</span></label>`).join("")}</div>
      </div>`).join("")}
  </div>

  <div class="card">
    <h3>Urmărire</h3>
    ${!S.cereri.length ? `<p class="muted" style="margin:0">Nicio cerere trimisă încă.</p>` : `<div class="tw" style="max-height:none"><table>
      <thead><tr><th>Către · documente</th><th style="width:96px">Trimisă</th><th style="width:96px">Termen</th><th style="width:74px">Primite</th><th style="width:140px">Stare</th><th style="width:250px"></th></tr></thead>
      <tbody>${sorted.map(c=>{ const st=cerStatus(c); return `<tr class="${st.done?"done":""}">
        <td><b>${esc(c.catre)}</b>${c.email?` <span class="muted">${esc(c.email)}</span>`:""}
          <div class="items">${st.items.map(l=>`<span class="${isRez(l)?"ok":""}">${isRez(l)?"✓":"○"} ${esc(lden(l))}</span>`).join("")}</div>
          ${c.reamintiri&&c.reamintiri.length?`<div class="muted" style="font-size:12.5px;margin-top:3px">Reamintiri: ${c.reamintiri.map(roDate).join(", ")}</div>`:""}</td>
        <td class="num">${roDate(c.trimis)}</td>
        <td class="num">${roDate(c.termen)}</td>
        <td class="num">${st.got} / ${st.total}</td>
        <td>${stTag(c,st)}</td>
        <td style="white-space:nowrap">
          <button class="btn g sm" data-cview="${c.id}">Text</button>
          ${st.done ? "" : `<button class="btn ${st.late?"o":"g"} sm" data-crem="${c.id}">Reamintire</button>`}
          ${c.inchisa ? `<button class="btn g sm" data-cclose="${c.id}">Redeschide</button>` : st.done ? "" : `<button class="btn g sm" data-cclose="${c.id}" title="Închide cererea fără să mai aștepți documentele rămase.">Închide</button>`}
          <button class="btn g sm" data-cdel="${c.id}" title="Șterge cererea; lipsurile rămân.">×</button>
        </td></tr>`;}).join("")}</tbody>
    </table></div>`}
  </div>`;
}

/* fereastra de compunere: cerere nouă, reamintire sau doar textul */
let CMOD = null;   // {mode:"new"|"rem"|"view", c}
function openComposer(mode, orig, initTerm){

   Listă-tip construită după structura cărții tehnice a unei lucrări de fibră optică pe LEA 110 kV.
   PV-urile se generează din parametri: tronsoane, balize, stâlpi cu priză de pământ. */

  A:"Capitolul A – Documentația privind proiectarea",
  B:"Capitolul B – Documentația privind execuția",
  C:"Capitolul C – Documentația privind recepția",
  D:"Capitolul D – Documentația privind urmărirea comportării în exploatare"
};
function parseTronsoane(s){
  return String(s||"").split(/[\n;]+/).map(x=>x.trim()).filter(Boolean)
    .map(x=>x.replace(/^st\.?\s*/i,"").replace(/\s*[-–—]\s*/,"–").replace("–"," – "));
}
function parseList(s){ return String(s||"").split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean); }
function parseBalize(s){
  return String(s||"").split(/[\n;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m = x.match(/^(.*?)\s*[:x×]\s*(\d+)\s*(buc\.?)?$/i);
    const st = (m?m[1]:x).replace(/^st\.?\s*/i,"").replace(/\s*[-–—]\s*/," – ");
    return {st, buc: m ? +m[2] : 1};
  });
}
const parseLines = s => String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);

/* Asamblează dosarele: piese specifice + piese comune + documentele suplimentare ale beneficiarului. */
function ctBuild(p, spec){
  const pre = (p.cod||"").trim();
  let n = 0;
  const num = arr => arr.map(i => (i.seq && pre && !i.cod) ? Object.assign(i, {cod:`${pre}-${++n}`}) : i);
  const dos = [
    {id:"A1", ch:"A", items:[...(spec.A1||[]), ...CT_COMMON.A1()]},
    {id:"A2", ch:"A", items:[...(spec.A2||[]), ...CT_COMMON.A2()]},
    {id:"B1", ch:"B", items:[...(spec.B1||[]), ...CT_COMMON.B1()]},
    {id:"B2", ch:"B", items:num([...(spec.B2||[]), ...CT_COMMON.B2()])},
    {id:"B3", ch:"B", items:num([...(spec.B3||[]), ...CT_COMMON.B3()])},
    {id:"B4", ch:"B", items:[...(spec.B4||[]), ...CT_COMMON.B4()]}
  ];
  if(spec.B5) dos.push({id:"B5", ch:"B", items:spec.B5});
  const extra = parseLines(p.extra);
  if(extra.length) dos.push({id: spec.B5 ? "B6" : "B5", ch:"B", items:[{group:"Documente suplimentare cerute de beneficiar"}, ...extra.map(x=>({den:x, cap:"Execuție", dela:"Executant"}))]});
  dos.push({id:"C1", ch:"C", later:"la recepție", items:CT_COMMON.C1()});
  dos.push({id:"D1", ch:"D", later:"în exploatare", items:CT_COMMON.D1()});
  return dos;
}

// fișierul stă într-un folder cu numele dosarului (ex. „B1”, „Dosar B1”)?
const inDos = (doc, id) => new RegExp("(^|[^a-z0-9])(dosar\\s*)?" + id + "([^0-9]|$)", "i").test(doc.path||"") ? 1 : 0;

// cât de bine se potrivește denumirea unui fișier cu un document așteptat (0…1)
function ctNameScore(den, fileName){
  const need = [...new Set(words(String(den).replace(/\(.*?\)/g," ")))];
  const have = [...new Set(words(fileName))];
  if(!need.length || !have.length) return 0;
  const hs = new Set(have);
  if(need.some(w=>(/\d/.test(w) || w.length===2) && !hs.has(w))) return 0;   // numerele și identificatorii scurți trebuie să coincidă
  const hit = need.filter(w=>hs.has(w)).length;
  const s1 = hit / need.length;                         // cât din documentul așteptat apare în denumire
  const s2 = hit >= 5 ? hit / have.length : 0;          // cât din denumire e explicat de documentul așteptat
  return Math.max(s1, s2) + hit/1000;                   // la egalitate câștigă potrivirea mai bogată
}

// potrivește fiecare document așteptat cu un fișier din inventar
function ctMatch(){
  const ct = S.ct; if(!ct || !CT_TPL[ct.tpl]) return null;
  const dos = CT_TPL[ct.tpl].dosare(ct.p);
  const live = S.docs.filter(d=>!d.dup);
  const used = new Set();
  const all = dos.flatMap(d=>d.items.filter(i=>!i.group).map(i=>({i, d})));
  // 1. după cod exact
  for(const x of all){ if(!x.i.cod) continue; const f = live.find(d=>!used.has(d.id) && codeIn(d.name, x.i.cod)); if(f){ x.doc=f; used.add(f.id); } }
  // 2. după cuvinte cheie / denumire (un document general poate acoperi o singură poziție)
  for(const x of all){
    if(x.doc) continue;
    const cands = live.filter(d=>!used.has(d.id) && !(x.i.cod && hasSeriesCode(d.name, x.i.cod)));
    let f = null;
    const phrases = x.i.kws || (x.i.kw ? [x.i.kw] : []);
    if(phrases.length || x.i.rx){
      // dintre fișierele care conțin toate cuvintele unei fraze cheie îl alegem pe cel cu denumirea cea mai scurtă
      // („Declarația executantului” nu trebuie să ia locul „Declarației de conformitate a executantului”)
      const needs = phrases.map(words), nots = (x.i.not||[]).map(words);
      f = cands.filter(d=>{
            const h = new Set(words(d.name+" "+d.path));
            if(nots.some(n=>n.every(w=>h.has(w)))) return false;
            return needs.some(n=>n.every(w=>h.has(w))) || (x.i.rx && x.i.rx.test(norm(d.name)));
          })
          .sort((a,b)=> inDos(b,x.d.id) - inDos(a,x.d.id) || words(a.name).length - words(b.name).length)[0] || null;
    }
    if(f){ x.doc=f; used.add(f.id); }
  }
  // 3. după denumire: toate perechile document așteptat – fișier primesc un scor,
  //    iar perechile cele mai bune se atribuie primele („armare fundații” nu mai ia locul „săpăturii”)
  const pairs = [];
  for(const x of all){
    if(x.doc) continue;
    for(const d of live){
      if(used.has(d.id) || (x.i.cod && hasSeriesCode(d.name, x.i.cod))) continue;
      const sc = ctNameScore(x.i.den, d.name);
      if(sc >= 0.75) pairs.push({x, d, sc});
    }
  }
  pairs.sort((a,b)=>b.sc-a.sc);
  for(const pr of pairs){ if(pr.x.doc || used.has(pr.d.id)) continue; pr.x.doc = pr.d; used.add(pr.d.id); }
  for(const d of dos){
    const xs = all.filter(x=>x.d===d);
    d.total = xs.length; d.got = xs.filter(x=>x.doc).length;
    d.items.forEach(i=>{ const x = xs.find(x=>x.i===i); if(x) i.doc = x.doc; });
  }
  return dos;
}
function ctMissing(includeLater){
  const dos = ctMatch(); if(!dos) return [];
  return dos.filter(d=>includeLater || !d.later).flatMap(d=>d.items.filter(i=>!i.group && !i.doc));
}

function viewCarte(){
  if(!S.ct) S.ct = {tpl:"lea-fo", p:{nr:"", cod:"", cond:"OPGW", tronsoane:"", balize:"", prize:""}};
  if(!CT_TPL[S.ct.tpl]) S.ct.tpl = "lea-fo";
  const T = CT_TPL[S.ct.tpl];
  const p = S.ct.p;
  const dos = ctMatch();
  const inLips = new Set(S.lipsuri.map(l=>norm(lden(l))));
  const miss = ctMissing(false).filter(i=>!inLips.has(norm(lden(i))));
  const tot = dos.filter(d=>!d.later).reduce((a,d)=>a+d.total,0), got = dos.filter(d=>!d.later).reduce((a,d)=>a+d.got,0);
  const nPV = dos.filter(d=>d.id==="B2").flatMap(d=>d.items).filter(i=>!i.group && /^PV/.test(i.den)).length;
  const nBul = dos.filter(d=>d.id==="B3").flatMap(d=>d.items).filter(i=>!i.group && /^Buletin/.test(i.den)).length;
  const field = f => {
    const v = p[f.k] ?? "";
    const inner = f.type==="select" ? `<select data-ctp="${f.k}">${f.opts.map(o=>`<option ${String(v||f.opts[0])===o?"selected":""}>${o}</option>`).join("")}</select>`
      : f.type==="area" ? `<textarea rows="5" data-ctp="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`
      : `<input type="text" data-ctp="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||"")}">`;
    return `<div${f.wide?' class="wide"':""}><span class="lbl">${f.label}</span>${inner}</div>`;
  };
  const bar = (g,t,muted) => `<div class="bar ${muted?"mut":""}"><i style="width:${t?Math.round(g/t*100):0}%"></i></div>`;
  return `
  <div class="note"><b>Cartea tehnică.</b> Alegi tipul lucrării și completezi parametrii; aplicația generează toate documentele așteptate pe dosare, după structura din HG 343/2017 (Anexa 6), le caută în inventar și îți arată situația pe fiecare dosar.</div>

  <div class="card">
    <h3>Parametrii lucrării</h3>
    <div class="grid2">
      <div class="wide"><span class="lbl">Tipul lucrării</span><select data-cttpl>${Object.entries(CT_TPL).map(([k,t])=>`<option value="${k}" ${S.ct.tpl===k?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
      ${T.params.filter(f=>f.type!=="area").map(field).join("")}
    </div>
    <div class="grid2" style="margin-top:12px">
      ${T.params.filter(f=>f.type==="area").map(field).join("")}
    </div>
    <p class="muted" style="margin:10px 0 0">Din parametri rezultă <b>${nPV}</b> procese-verbale de execuție și <b>${nBul}</b> buletine. Repere normative: ${esc(T.norme)}.</p>
  </div>

  <div class="card">
    <h3>Situația <span class="muted">· capitolele A și B: ${got} din ${tot} documente găsite în inventar</span></h3>
    ${["A","B","C","D"].map(ch=>{
      const ds = dos.filter(d=>d.ch===ch);
      return `<div class="ct-ch"><div class="ct-cht">${CT_CH[ch]}</div>
        ${ds.map(d=>`<div class="ct-row">
          <b>Dosar ${d.id}</b>
          ${bar(d.got,d.total,d.later)}
          <span class="num">${d.got} / ${d.total}</span>
          ${d.later && d.got<d.total ? `<span class="tag t-none">de completat ${d.later}</span>` : d.got===d.total ? `<span class="tag t-viz">complet</span>` : `<span class="tag t-late">${d.total-d.got} lipsă</span>`}
        </div>`).join("")}</div>`;
    }).join("")}
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">
      <button class="btn" id="ctToLips" ${miss.length?"":"disabled"}>Trimite ${miss.length} ${miss.length===1?"lipsă":"lipsuri"} la Lipsuri</button>
      <button class="btn o" id="ctPrint">Tipărește borderourile</button>
    </div>
    <p class="muted" style="margin:8px 0 0">Lipsurile din capitolele A și B ajung la <b>Lipsuri</b>, cu „de la cine” completat, ca să le poți cere la <b>Cereri</b>. Capitolele C și D nu se trimit: se completează la recepție și în exploatare.</p>
  </div>

  ${dos.map(d=>`<details class="card ct-det" ${d.got<d.total && !d.later ? "open":""}>
    <summary><b>Dosar ${d.id}</b> <span class="muted">· ${CT_CH[d.ch].split(" – ")[1]}</span> <span class="num" style="margin-left:auto">${d.got} / ${d.total}</span></summary>
    <div class="tw" style="max-height:none;margin-top:10px"><table>
      <thead><tr><th style="width:150px">Cod</th><th>Document</th><th style="width:130px">Stare</th><th style="width:34%">Fișier din inventar</th></tr></thead>
      <tbody>${d.items.map(i=> i.group ? `<tr class="grp-row"><td colspan="4">${esc(i.group)}</td></tr>` : `<tr>
        <td class="num">${esc(i.cod||"")}</td><td>${esc(i.den)}</td>
        <td>${i.doc ? `<span class="tag t-viz">găsit</span>` : d.later ? `<span class="tag t-none">de completat</span>` : `<span class="tag t-late">lipsă</span>`}</td>
        <td class="fn">${i.doc ? esc(i.doc.name) : ""}</td></tr>`).join("")}</tbody>
    </table></div>
  </details>`).join("")}`;
}

function buildBorderouri(){
  const dos = ctMatch(); const m = S.meta, p = S.ct.p;
  return dos.map(d=>{
    let n = 0;
    const rows = d.items.map(i=>{
      if(i.group){ n++; return `<div class="bd-i">${String(n).padStart(2,"0")}. ${esc(i.group)}</div>`; }
      if(i.cod) return `<div class="bd-s">${esc(i.cod)} – ${esc(i.den.replace(/^PV /,"PV "))}${i.doc?"":` <span class="bd-miss">${d.later?"de completat":"LIPSĂ"}</span>`}</div>`;
      n++; return `<div class="bd-i">${String(n).padStart(2,"0")}. ${esc(i.den)}${i.doc?"":` <span class="bd-miss">${d.later?"de completat":"LIPSĂ"}</span>`}</div>`;
    }).join("");
    return `<div class="bd">
      <table class="bd-h"><tbody>
        ${p.nr?`<tr><td>Lucrare nr.:</td><td>${esc(p.nr)}</td></tr>`:""}
        <tr><td>Faza:</td><td>Carte tehnică</td></tr>
        <tr><td>Lucrare:</td><td>${esc(m.proiect||"")}</td></tr>
        ${m.emitent?`<tr><td>Executant:</td><td>${esc(m.emitent)}</td></tr>`:""}
        <tr><td>Beneficiar:</td><td>${esc(m.beneficiar||"")}</td></tr>
      </tbody></table>
      <div class="bd-t">BORDEROU PIESE ÎNDOSARIATE<br>DOSAR ${d.id}</div>
      <div class="bd-c">${esc(CT_CH[d.ch])}</div>
      <div class="bd-a">A. PIESE SCRISE</div>
      ${rows}
    </div>`;
  }).join("");
}

function cfState(){
  if(!S.conf) S.conf = {faza:"executie", ac:"da", isc:"da", cladire:"nu", marks:{}};
  if(!S.conf.marks) S.conf.marks = {};
  return S.conf;
}
function cfDetect(r){
  if(r.auto==="carte"){
    if(!S.ct) return {state:"nu", info:"Completează parametrii la Carte tehnică"};
    const miss = ctMissing(false).length;
    return miss ? {state:"nu", info:`${miss} documente lipsă în capitolele A și B`} : {state:"da", info:"capitolele A și B complete"};
  }
  const live = S.docs.filter(d=>!d.dup);
  for(const d of live){
    const h = new Set(words(d.name+" "+d.path));
    if((r.notKws||[]).some(k=>words(k).every(w=>h.has(w)))) continue;   // ex.: avizele de însoțire nu sunt avize de proiectare
    if((r.kws||[]).some(k=>words(k).every(w=>h.has(w))) || (r.rx && r.rx.test(norm(d.name)))) return {state:"da", doc:d};
  }
  return {state:"nu"};
}
function cfEval(){
  const c = cfState();
  const cur = CF_FAZE.findIndex(f=>f.id===c.faza);
  return CF_RULES.map(r=>{
    const fi = CF_FAZE.findIndex(f=>f.id===r.faza);
    const mark = c.marks[r.id];
    if(r.cond && !r.cond(c)) return {r, st:"na", why:"nu se aplică acestei lucrări"};
    if(mark==="na") return {r, st:"na", why:"marcat „nu se aplică”"};
    const det = cfDetect(r);
    if(det.state==="da") return {r, st:"ok", det};
    if(mark==="ok") return {r, st:"ok", det:{info:"confirmat manual"}};
    return {r, st: fi>cur ? "later" : "miss", det};
  });
}

function viewConformitate(){
  const c = cfState();
  const ev = cfEval();
  const miss = ev.filter(x=>x.st==="miss");
  const blocante = miss.filter(x=>x.r.grav!=="recom");
  const opt = (k, vals) => vals.map(([v,t])=>`<option value="${v}" ${c[k]===v?"selected":""}>${t}</option>`).join("");
  const stTag = x => x.st==="ok" ? `<span class="tag t-viz">găsit</span>`
    : x.st==="na" ? `<span class="tag t-none">nu se aplică</span>`
    : x.st==="later" ? `<span class="tag t-none">fază ulterioară</span>`
    : `<span class="tag ${CF_GRAV[x.r.grav].tag}">lipsă · ${CF_GRAV[x.r.grav].txt}</span>`;
  const inLips = new Set(S.lipsuri.map(l=>norm(lden(l))));
  return `
  <div class="note"><b>Verificare conform normelor.</b> Aplicația caută în inventar documentele cerute de legislație la fiecare fază și semnalează ce lipsește, cu temeiul legal. Verificarea se face după denumirea fișierelor: dacă ai un document pe care nu l-a recunoscut, apasă „Am documentul”.</div>

  <div class="card">
    <h3>Lucrarea</h3>
    <div class="grid2">
      <div><span class="lbl">Faza în care se află lucrarea</span><select data-cf="faza">${opt("faza",[["inainte","Înainte de începere"],["executie","În execuție"],["receptie","La recepția la terminare"],["finala","La recepția finală"]])}</select></div>
      <div><span class="lbl">Are autorizație de construire</span><select data-cf="ac">${opt("ac",[["da","Da"],["nu","Nu"],["nustiu","Nu știu"]])}</select></div>
      <div><span class="lbl">ISC participă la fazele determinante</span><select data-cf="isc">${opt("isc",[["da","Da"],["nu","Nu"],["nustiu","Nu știu"]])}</select></div>
      <div><span class="lbl">Este o clădire</span><select data-cf="cladire">${opt("cladire",[["nu","Nu (rețea, instalație etc.)"],["da","Da"]])}</select></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat ${blocante.length?"bad":"ok"}"><div class="v">${blocante.length}</div><div class="l">lipsuri care blochează controlul sau recepția</div></div>
    <div class="stat ${miss.length-blocante.length?"hot":""}"><div class="v">${miss.length-blocante.length}</div><div class="l">lipsuri recomandate</div></div>
    <div class="stat ok"><div class="v">${ev.filter(x=>x.st==="ok").length}</div><div class="l">cerințe îndeplinite</div></div>
    <div class="stat"><div class="v">${ev.filter(x=>x.st==="later").length}</div><div class="l">pentru fazele următoare</div></div>
  </div>

  ${miss.length ? `<div style="margin:-2px 0 14px"><button class="btn" id="cfToLips">Trimite lipsurile la Lipsuri</button></div>` : ""}

  ${CF_FAZE.map(f=>{
    const xs = ev.filter(x=>x.r.faza===f.id);
    return `<div class="card">
      <h3>${f.name}</h3>
      ${xs.map(x=>`<div class="cf-row ${x.st}">
        <div class="cf-main">
          <div class="cf-t">${esc(x.r.titlu)} ${stTag(x)} ${x.st==="miss" && inLips.has(norm(x.r.titlu)) ? `<span class="muted">· în Lipsuri</span>` : ""}</div>
          <div class="cf-why">${esc(x.r.deCe)}</div>
          <div class="cf-law">Temei: ${esc(x.r.temei)}</div>
          ${x.det && x.det.doc ? `<div class="cf-doc">Găsit: <span class="fn">${esc(x.det.doc.name)}</span></div>` : x.det && x.det.info ? `<div class="cf-doc">${esc(x.det.info)}</div>` : ""}
        </div>
        <div class="cf-act">
          ${x.r.auto ? `<button class="btn g sm" data-v-go="carte">Vezi cartea tehnică</button>` :
            x.st==="miss" || x.st==="later" ? `<button class="btn g sm" data-cfm="${x.r.id}:ok">Am documentul</button><button class="btn g sm" data-cfm="${x.r.id}:na">Nu se aplică</button>` :
            c.marks[x.r.id] ? `<button class="btn g sm" data-cfm="${x.r.id}:">Anulează marcajul</button>` : ""}
        </div>
      </div>`).join("")}
    </div>`;
  }).join("")}

  <p class="muted" style="line-height:1.5">Verificarea e orientativă și nu înlocuiește verificarea dirigintelui de șantier sau a comisiei de recepție. Surse (verificate în noiembrie 2026): HG 343/2017 – Regulamentul privind recepția construcțiilor (art. 9–10, 15, 24, 27, 37, Anexele 2, 4, 6); Legea 10/1995, art. 23; Ordinul MDRAP 1370/2014 – procedura de control ISC în faze determinante; HG 668/2017; deficiențele frecvente prezentate de ISC. Cerințele specifice beneficiarului (de exemplu, ale operatorului de rețea) se adaugă în lista-tip de la Carte tehnică.</p>`;
}

  {k:["receptie terminare","receptia la terminarea","termene receptie","comisie receptie","dureaza receptia","durata receptie","termen receptie","cate zile receptie"], a:()=>`La <b>recepția la terminarea lucrărilor</b>: executantul anunță terminarea; investitorul are <b>5 zile</b> să acționeze, autoritățile <b>10 zile</b> să-și numească reprezentanții, iar investitorul numește comisia în <b>3 zile</b>. Comisia lucrează cu cel puțin <b>2/3</b> din membri; dacă suspendă recepția, remedierile au cel mult <b>90 de zile</b>. Procesul-verbal se transmite în <b>5 zile</b>. <span class="bb-law">HG 343/2017, art. 9, 10, 15, 17, 23</span>`},

function bbLipsuri(){
  const out = [];
  if(!S.docs.length) return `Încă nu ai încărcat documente, așa că nu am ce verifica. Începe de la <b>Inventar → Adaugă folder</b>. ${go("inventar","Deschide Inventarul")}`;
  const ev = cfEval().filter(x=>x.st==="miss");
  const bl = ev.filter(x=>x.r.grav!=="recom");
  if(bl.length) out.push(`<b>${bl.length}</b> ${bl.length===1?"cerință legală lipsește":"cerințe legale lipsesc"} pentru faza curentă și pot bloca controlul ISC sau recepția:<ul>${bl.slice(0,6).map(x=>`<li>${esc(x.r.titlu)} <span class="bb-law">${esc(x.r.temei)}</span></li>`).join("")}</ul>${bl.length>6?`și încă ${bl.length-6}.`:""}`);
  if(S.ct){ const m = ctMissing(false); if(m.length) out.push(`În cartea tehnică (capitolele A și B) lipsesc <b>${m.length}</b> documente, de exemplu: ${m.slice(0,3).map(i=>esc(lden(i))).join("; ")}.`); }
  const lo = openLipsuri().length; if(lo) out.push(`În lista de Lipsuri ai <b>${lo}</b> ${lo===1?"document deschis":"documente deschise"}.`);
  if(!out.length) return `Nu găsesc nimic lipsă pentru faza curentă. Verifică totuși faza aleasă la Conformitate și, dacă e cazul, completează parametrii cărții tehnice. ${go("conformitate","Deschide Conformitate")}`;
  return out.join("<br><br>") + `<br>${go("conformitate","Vezi Conformitate")} ${go("lipsuri","Vezi Lipsuri")}`;
}
function bbCereri(){
  if(!S.cereri.length) return `Nu ai trimis încă nicio cerere. Le pregătești de la <b>Cereri</b>, din lipsurile grupate pe expeditor. ${go("cereri","Deschide Cereri")}`;
  const late = S.cereri.map(c=>({c, st:cerStatus(c)})).filter(x=>x.st.late);

}
function bbNext(){
  if(!S.docs.length) return `Primul pas: încarcă documentele lucrării de la <b>Inventar → Adaugă folder</b>. ${go("inventar","Deschide Inventarul")}`;
  const nev = dupGroups().filter(x=>!x.docs.some(d=>d.viz)).length;
  if(nev) return `Ai <b>${nev}</b> ${nev===1?"grup":"grupuri"} de duplicate fără versiunea în vigoare aleasă. Rezolvă-le întâi, ca opisul și verificările să lucreze pe documentele corecte. ${go("duplicate","Deschide Duplicate")}`;
  const bl = cfEval().filter(x=>x.st==="miss" && x.r.grav!=="recom").length;
  if(bl) return `Verifică lipsurile legale: ${bl} ${bl===1?"cerință":"cerințe"} la Conformitate. Cele care nu sunt de fapt lipsă le marchezi „Am documentul”; restul le trimiți la Lipsuri și le ceri de la Cereri. ${go("conformitate","Deschide Conformitate")}`;
  const nec = openLipsuri().filter(l=>!lipsaCerere(l)).length;
  if(nec) return `Ai ${nec} ${nec===1?"lipsă necerută":"lipsuri necerute"}. Pregătește cererile către cei care trebuie să le trimită. ${go("cereri","Deschide Cereri")}`;
  const est = S.docs.filter(d=>d.dataSrc==="estimat").length;
  if(est) return `Corectează cele ${est} date estimate (portocalii) din Inventar, ca opisul să aibă datele reale ale actelor. ${go("inventar","Deschide Inventarul")}`;
  return `Dosarul arată bine. Poți genera opisul și borderourile pentru predare. ${go("rezultate","Opis")} ${go("carte","Borderouri")}`;
}
const BB_CTX = [
  {k:["ce lipseste","lipsa","lipsesc","ce mai am nevoie","ce imi trebuie","ce documente"], a:bbLipsuri},
  {k:["cine intarzie","cine imi datoreaza","cereri intarziate","termen depasit","cine nu a trimis"], a:bbCereri},
  {k:["ce fac acum","pasul urmator","ce urmeaza","de unde incep","ce trebuie sa fac"], a:bbNext}
];

function bbAnswer(q){
  const have = new Set(words(q));
  if(!have.size) return null;
  let best = null, bs = 0;
  // „opis” se potrivește cu „opisul”: comparăm după început, de la 4 litere în sus
  const hv = [...have];
  const has = w => have.has(w) || (w.length>=4 && hv.some(h=>h.length>=4 && (h.startsWith(w) || w.startsWith(h))));
  // o frază întreagă câștigă (cu cât mai lungă, cu atât mai specifică); parțial doar cu minimum două cuvinte comune
  const score = phrases => { let m = 0; for(const p of phrases){ const w = words(p); if(!w.length) continue; const hit = w.filter(has).length; const s = hit===w.length ? 10 + w.length : (hit>=2 ? hit/w.length*5 : 0); if(s>m) m=s; } return m; };
  for(const e of BB_CTX.concat(BB_KB)){ const s = score(e.k); if(s>bs){ bs=s; best=e; } }
  // cerințele din Conformitate răspund după titlul lor
  for(const r of CF_RULES){ const s = score([r.titlu.replace(/\(.*?\)/g,""), ...(r.kws||[])]); if(s>bs){ bs=s; best={a:()=>`<b>${esc(r.titlu)}</b>. ${esc(r.deCe)} <span class="bb-law">${esc(r.temei)}</span> ${go("conformitate","Vezi în Conformitate")}`}; } }
  return bs >= 2.5 ? best.a() : null;
}

function metrics(){
  const d = S.docs;
  const tot = d.length;
  const dupCount = dupGroups().reduce((a,g)=>a+g.docs.length,0);
  const superseded = d.filter(x=>x.dup).length;
  const ncl = d.filter(x=>x.cap==="Neclasificat").length;
  const scans = d.filter(x=>isScan(x.name)).length;
  const est = d.filter(x=>x.dataSrc==="estimat").length;
  const byCap = {};
  for(const c of CAPS) byCap[c] = d.filter(x=>x.cap===c).length;
  const cer = S.cereri.map(cerStatus);
  return {tot, dupCount, superseded, ncl, scans, est, byCap, lipsuri:openLipsuri().length,
    cerDeschise: cer.filter(x=>!x.done).length, cerIntarziate: cer.filter(x=>x.late).length,
    necerute: openLipsuri().filter(l=>!lipsaCerere(l)).length};
}

function buildOpis(){
  const m = S.meta;
  const order = CAPS.filter(c=>c!=="Neclasificat").concat(["Neclasificat"]);
  const roman = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  let n = 0, rows = "";
  order.forEach((cap, i)=>{
    const ds = S.docs.filter(d=>d.cap===cap && !d.dup);
    const ls = openLipsuri().filter(l=>l.cap===cap);
    if(!ds.length && !ls.length) return;
    rows += `<tr class="cap"><td colspan="5">${roman[i]||""}. ${esc(cap)}</td></tr>`;
    ds.sort((a,b)=>(a.data||"").localeCompare(b.data||"")||a.name.localeCompare(b.name));
    for(const d of ds){
      n++;
      rows += `<tr><td>${String(n).padStart(3,"0")}</td><td>${esc(d.name)}</td><td>${esc(d.sursa==="primit"?("primit · "+(d.dela||"—")):(d.sursa==="propriu"?"propriu":"—"))}</td><td>${esc(d.dataSrc==="estimat"?"":roDate(d.data))}</td><td>atașat</td></tr>`;
    }
    for(const l of ls){
      n++;
      rows += `<tr class="miss"><td>${String(n).padStart(3,"0")}</td><td>${esc(lden(l))}</td><td>${esc(l.dela||"—")}</td><td>—</td><td>LIPSĂ</td></tr>`;
    }
  });
  const now = new Date();
  const dt = now.toLocaleDateString("ro-RO")+", ora "+now.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
  return `
  <div class="opis-h">
    <h2>OPIS — ${esc(m.proiect||"Proiect")}</h2>
    <div class="m">
      Firma: ${esc(m.firma||"—")} · Beneficiar: ${esc(m.beneficiar||"—")} · Contract: ${esc(m.contract||"—")}<br>
      Amplasament: ${esc(m.amplasament||"—")} · Emis ${dt} · ${n} poziții, din care ${openLipsuri().length} lipsă
    </div>
  </div>
  <table class="opis">
    <thead><tr><th style="width:38px">Poz.</th><th>Denumire document</th><th style="width:150px">Sursă</th><th style="width:74px">Data</th><th style="width:60px">Stare</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="5">Niciun document.</td></tr>`}</tbody>
  </table>
  <div class="pf">Opis generat cu Schela · Atelier. Documentele marcate LIPSĂ nu se regăsesc în dosarul predat și se recuperează de la sursele indicate.</div>`;
}

function roDate(iso){
  if(!iso) return "";
  const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}
function csvEsc(v){ const s=String(v??""); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportCsv(){
  const src = {nume:"din denumire", estimat:"estimata (data fisierului)", manual:"introdusa manual"};
  const head = ["Denumire","Cale","Capitol","Data document","Sursa datei","Sursa","De la cine","In vigoare","Inlocuit","In grup de duplicate","Extensie","Marime (bytes)","SHA-256"];
  const lines = [head.join(";")].concat(S.docs.map(d=>[
    d.name, d.path, d.cap, d.data, src[d.dataSrc]||"", d.sursa, d.dela, d.viz?"da":"", d.dup?"da":"", d.grp?"da":"", d.ext, d.size, d.hash||""
  ].map(csvEsc).join(";")));
  download((S.meta.proiect||"inventar").replace(/[^\w\-]+/g,"_")+"_inventar.csv", "﻿"+lines.join("\r\n"), "text/csv;charset=utf-8");
}

    ["Date estimate (nemodificate)", m.est],
    ["Procent scanuri", (m.tot?Math.round(m.scans/m.tot*100):0)+"%"],
    ...CAPS.map(c=>["Documente — "+c, m.byCap[c]])
  ];
  download((S.meta.proiect||"statistici").replace(/[^\w\-]+/g,"_")+"_statistici.csv",
    "﻿"+[["Indicator","Valoare"].join(";")].concat(rows.map(r=>r.map(csvEsc).join(";"))).join("\r\n"),
    "text/csv;charset=utf-8");
}

/* ---------------- binding ---------------- */
function bind(){
  const v = $("#view");

  const fit = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
  v.querySelectorAll("[data-meta]").forEach(el=>{
    el.oninput = () => {
      if(el.classList.contains("grow")){ el.value = el.value.replace(/\n/g," "); fit(el); }
      S.meta[el.dataset.meta] = el.value; autosave(); $("#vsub").textContent = S.meta.proiect?"· "+S.meta.proiect:"";
    };
    if(el.classList.contains("grow")){
      el.onkeydown = e => { if(e.key==="Enter") e.preventDefault(); };   // un singur paragraf, fără rânduri noi
      fit(el);
    }
  });
  const nt = v.querySelector("[data-note]");
  if(nt) nt.oninput = () => { S.note = nt.value; autosave(); };


  const bdemo=$("#btnDemo"); if(bdemo) bdemo.onclick=async()=>{
    if((S.docs.length || S.lipsuri.length) && !confirm("Exemplul înlocuiește proiectul curent din pagină. Ai salvat proiectul?")) return;
    try{
      const r = await fetch("exemple/Demo_LEA_Nord-Sud_schela.json", {cache:"no-store"});
      const o = await r.json(); if(!o || !o.meta) throw new Error("format");
      S = Object.assign(blank(), o); migrate(); markDups(); VIEW = "carte"; render();
    }catch(e){ alert("Exemplul nu a putut fi încărcat."); }
  };
  const bc=$("#btnClear");
  if(bc) bc.onclick=()=>{ if(confirm("Ștergi tot proiectul curent din pagină?")){ S=blank(); render(); } };

  // file inputs
  const bd=$("#btnPickDir"), bf=$("#btnPickFiles"), ind=$("#inDir"), inf=$("#inFiles");
  if(bd&&ind){ bd.onclick=()=>ind.click(); ind.onchange=()=>{ if(ind.files.length) addFiles([...ind.files]); ind.value=""; }; }
  if(bf&&inf){ bf.onclick=()=>inf.click(); inf.onchange=()=>{ if(inf.files.length) addFiles([...inf.files]); inf.value=""; }; }

  // filters
  const fq=$("#fq"); if(fq) fq.oninput=()=>{ FILTER.q=fq.value; const p=fq.selectionStart; render(); const n=$("#fq"); if(n){n.focus(); n.setSelectionRange(p,p);} };
  const fc=$("#fcap"); if(fc) fc.onchange=()=>{ FILTER.cap=fc.value; render(); };
  const fs=$("#fstare"); if(fs) fs.onchange=()=>{ FILTER.stare=fs.value; render(); };

  // row edits
  v.querySelectorAll("[data-f]").forEach(el=>{
    const h=()=>{
      const d=S.docs.find(x=>x.id===el.dataset.id); if(!d) return;
      d[el.dataset.f]=el.value;
      if(el.dataset.f==="data"){ d.dataSrc = el.value ? "manual" : ""; el.classList.remove("isest"); const s=el.nextElementSibling; if(s) s.remove(); }
      autosave();
    };
    el.onchange=h;
    if(el.tagName==="INPUT"&&el.type==="text") el.oninput=h;
  });
  v.querySelectorAll("[data-sel]").forEach(el=>{
    el.onchange=()=>{ const d=S.docs.find(x=>x.id===el.dataset.sel); if(d){ d.sel=el.checked; el.closest("tr").classList.toggle("sel",el.checked);} autosave(); };
  });

  // bulk
  const ba=$("#btnSelAll"); if(ba) ba.onclick=()=>{ const ids=new Set(filtered().map(d=>d.id)); S.docs.forEach(d=>{ if(ids.has(d.id)) d.sel=true; }); render(); };
  const bn=$("#btnSelNone"); if(bn) bn.onclick=()=>{ S.docs.forEach(d=>d.sel=false); render(); };
  const bcap=$("#bulkCap"); if(bcap) bcap.onchange=()=>{ if(!bcap.value) return; let n=0; S.docs.forEach(d=>{ if(d.sel){ d.cap=bcap.value; n++; } }); markDups(); render(); if(!n) alert("Nu ai selectat niciun document."); };
  const bsrc=$("#bulkSrc"); if(bsrc) bsrc.onchange=()=>{ if(!bsrc.value) return; S.docs.forEach(d=>{ if(d.sel) d.sursa=bsrc.value; }); render(); };
  const bdel=$("#btnDel"); if(bdel) bdel.onclick=()=>{ const n=S.docs.filter(d=>d.sel).length; if(!n) return alert("Nu ai selectat nimic."); if(!confirm("Scoți "+n+" documente din inventar?")) return; S.docs=S.docs.filter(d=>!d.sel); markDups(); render(); };

  const brc=$("#btnReclass"); if(brc) brc.onclick=()=>{
    let n=0;
    S.docs.forEach(d=>{ if(d.cap==="Neclasificat"){ const c=guessCap(d.name,d.path); if(c!=="Neclasificat"){ d.cap=c; n++; } } });
    render(); alert(n ? n+" documente încadrate. Verifică-le cu filtrul pe capitol." : "Niciun document neclasificat nu se potrivește cu regulile.");
  };

  // duplicate
  v.querySelectorAll("[data-viz]").forEach(b=>b.onclick=()=>{
    const d=S.docs.find(x=>x.id===b.dataset.viz); if(!d) return;
    const g=dupGroups().find(g=>g.docs.includes(d));
    if(g) g.docs.forEach(x=>x.viz=false);
    d.viz=true; markDups(); render();
  });

  // lipsuri
  const bal=$("#btnAddL");
  if(bal) bal.onclick=()=>{
    const den=$("#lDen").value.trim();
    if(!den) return alert("Scrie denumirea documentului.");
    S.lipsuri.push({id:newId("l"), den, cap:$("#lCap").value, dela:$("#lDela").value.trim()});
    $("#lDen").value=""; $("#lDela").value=""; render();
  };
  v.querySelectorAll("[data-dell]").forEach(b=>b.onclick=()=>{
    const [l] = S.lipsuri.splice(+b.dataset.dell,1);
    if(l) S.cereri.forEach(c=>{ c.items = c.items.filter(id=>id!==l.id); });
    S.cereri = S.cereri.filter(c=>c.items.length);
    render();
  });
  v.querySelectorAll("[data-unrez]").forEach(b=>b.onclick=()=>{ delete S.lipsuri[+b.dataset.unrez].rez; render(); });

  // conformitate
  v.querySelectorAll("[data-cf]").forEach(el=>el.onchange=()=>{ cfState()[el.dataset.cf] = el.value; render(); });
  v.querySelectorAll("[data-cfm]").forEach(b=>b.onclick=()=>{
    const [id, val] = b.dataset.cfm.split(":"); const c = cfState();
    if(val) c.marks[id] = val; else delete c.marks[id];
    render();
  });
  v.querySelectorAll("[data-v-go]").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.vGo; render(); });
  const cfl=$("#cfToLips"); if(cfl) cfl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l))));
    let n = 0;
    for(const x of cfEval().filter(x=>x.st==="miss" && !x.r.auto)){
      if(have.has(norm(x.r.titlu))) continue;
      S.lipsuri.push({id:newId("l"), cod:"", den:x.r.titlu, cap:x.r.cap, dela:x.r.dela||""}); n++;
    }
    render(); alert(n ? `${pl(n,"cerință adăugată","cerințe adăugate")} la Lipsuri, cu „de la cine” completat.` : "Toate lipsurile sunt deja în listă.");
  };

  // carte tehnică
  v.querySelectorAll("[data-ctp]").forEach(el=>el.onchange=()=>{ S.ct.p[el.dataset.ctp] = el.value; render(); });
  const ctt = v.querySelector("[data-cttpl]"); if(ctt) ctt.onchange=()=>{
    // fiecare tip de lucrare își păstrează parametrii; numărul lucrării și codul se preiau
    const ct = S.ct; ct.pp = ct.pp || {};
    ct.pp[ct.tpl] = ct.p;
    ct.tpl = ctt.value;
    ct.p = ct.pp[ct.tpl] || {nr: ct.p.nr||"", cod: ct.p.cod||""};
    render();
  };
  const ctl=$("#ctToLips"); if(ctl) ctl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l))));
    let n = 0;
    for(const i of ctMissing(false)){
      if(have.has(norm(lden(i)))) continue;
      S.lipsuri.push({id:newId("l"), cod:i.cod||"", den:i.den, cap:i.cap, dela:i.dela||""}); n++;
    }
    render(); alert(n ? `${pl(n,"document adăugat","documente adăugate")} la Lipsuri, cu „de la cine” completat.` : "Toate lipsurile sunt deja în listă.");
  };
  const ctp=$("#ctPrint"); if(ctp) ctp.onclick=()=>{ $("#print").innerHTML = buildBorderouri(); setTimeout(()=>window.print(), 60); };

  // cereri
  v.querySelectorAll("[data-setdela]").forEach(el=>el.onchange=()=>{
    const who = el.value.trim(); if(!who) return;
    el.dataset.setdela.split(",").forEach(id=>{ const l=lipsaById(id); if(l) l.dela = who; });
    render();
  });
  v.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{
    const card = b.closest(".grp");
    const ids = [...card.querySelectorAll("[data-lid]:checked")].map(x=>x.dataset.lid);
    if(!ids.length) return alert("Bifează cel puțin un document.");
    const g = pendingGroups()[+b.dataset.prep];
    openComposer("new", {id:newId("c"), catre:g.name, email:"", items:ids, termen:card.querySelector("[data-term]").value, trimis:"", reamintiri:[], inchisa:false});
  });
  const cById = id => S.cereri.find(c=>c.id===id);
  v.querySelectorAll("[data-cview]").forEach(b=>b.onclick=()=>openComposer("view", cById(b.dataset.cview)));
  v.querySelectorAll("[data-crem]").forEach(b=>b.onclick=()=>{
    const c = cById(b.dataset.crem); if(!c) return;
    const base = c.termen && c.termen > todayIso() ? c.termen : todayIso();
    openComposer("rem", c, addDays(base, 3));
  });
  v.querySelectorAll("[data-cclose]").forEach(b=>b.onclick=()=>{ const c=cById(b.dataset.cclose); if(c){ c.inchisa=!c.inchisa; render(); } });
  v.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{
    const c=cById(b.dataset.cdel); if(!c) return;
    if(!confirm(`Ștergi cererea către ${c.catre}? Documentele lipsă rămân în listă și pot fi cerute din nou.`)) return;
    S.cereri = S.cereri.filter(x=>x!==c); render();
  });

  // rezultate
  const bo=$("#btnOpis"); if(bo) bo.onclick=()=>{ $("#print").innerHTML=buildOpis(); setTimeout(()=>window.print(),60); };
  const bcsv=$("#btnCsv"); if(bcsv) bcsv.onclick=exportCsv;
  const brap=$("#btnRaport"); if(brap) brap.onclick=exportRaport;
}

/* Boloboc */
$("#bbFab").onclick = () => { const b = $("#bb"); b.classList.toggle("on"); if(b.classList.contains("on")) bbRender(); };

/* top bar */
$("#btnSave").onclick=()=>{
  const name=(S.meta.proiect||"proiect").replace(/[^\w\-]+/g,"_")+"_schela.json";
  download(name, JSON.stringify(S,null,2));
};
$("#btnLoad").onclick=()=>$("#fileLoad").click();
$("#fileLoad").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||!o.meta) throw new Error("format");
      S=Object.assign(blank(),o);
      migrate(); markDups(); render(); alert("Proiect încărcat: "+(S.meta.proiect||"fără nume")+" — "+S.docs.length+" documente.");
    }catch(err){ alert("Fișierul nu pare a fi un proiect Schela."); }
  };
  r.readAsText(f); e.target.value="";
};


window.addEventListener("beforeunload", autosave);
// la redimensionarea ferestrei, câmpurile care cresc își recalculează înălțimea
window.addEventListener("resize", ()=>document.querySelectorAll("textarea.grow").forEach(el=>{ el.style.height="auto"; el.style.height=el.scrollHeight+2+"px"; }));

autoload();
markDups();
render();
</script>
</body>
