  {k:["semnaturi","pv nesemnat","pv nesemnate","cine semneaza pv","semnaturi lipsa"], a:()=>`La <b>Execuție → Semnături pe PV-uri</b> apar toate procesele-verbale din inventar. Bifezi cine a semnat: RTE și dirigintele la orice PV, iar la fazele determinante și la natura terenului și proiectantul și ISC. Cele incomplete le trimiți la Lipsuri. ${CUR?go("executie:sem","Vezi semnăturile"):""}`},

  {k:["aranjeaza dosarul","foldere dosare","copiez fisierele","stick","organizez dosarul","dosar pe calculator"], a:()=>`La <b>Carte tehnică → Aranjează dosarul pe calculator</b> aplicația face un folder cu subfolderele Dosar A1 … Dosar D1 și pune în ele copii ale fișierelor găsite, numerotate ca în borderou, plus lista documentelor. Originalele nu se ating. Merge în Chrome și Edge, pe calculator. ${CUR?go("carte","Deschide Cartea tehnică"):""}`},
  {k:["scan","nume neclar","citeste pdf","text pdf","continut pdf","ocr"], a:()=>`Din PDF-uri aplicația citește local începutul textului, ca să recunoască și fișierele cu nume neclar, de exemplu „scan001.pdf”. Pentru documentele deja în inventar apasă <b>Inventar → Citește textul din PDF-uri</b> și alege din nou folderul. Scanurile fără strat de text nu pot fi citite: pentru ele ar trebui OCR; redenumește-le sau leagă-le manual.`},
  // --- noțiuni de specialitate ---
  {k:["faza determinanta","faze determinante"], a:()=>`O <b>fază determinantă</b> e o etapă de execuție hotărâtoare pentru rezistența și stabilitatea construcției. Proiectantul le stabilește în <b>programul de control pe faze determinante</b>, beneficiarul și verificatorul îl acceptă, iar ISC îl aprobă. Executantul convoacă ISC cu <b>cel puțin 3 zile lucrătoare</b> înainte, iar lucrarea continuă doar după acceptul scris, consemnat în procesul-verbal de control. <span class="bb-law">Ordinul MDRAP 1370/2014, art. 9, 15, 18; Legea 10/1995, art. 23 lit. d)</span>`},
  {k:["lucrari ascunse","pv lucrari ascunse"], a:()=>`<b>PV-ul de lucrări ascunse</b> consemnează calitatea lucrărilor care urmează să fie acoperite (fundații, armături, prize de pământ îngropate etc.) și nu mai pot fi verificate ulterior. Se semnează de executant (RTE) și de dirigintele de șantier și intră în capitolul B al cărții tehnice. <span class="bb-law">HG 343/2017, Anexa 6, pct. 8 lit. b)</span>`},

  {k:["ce lipseste","lipsa","lipsesc","ce mai am nevoie","ce imi trebuie","ce documente"], a:bbLipsuri},
  {k:["cine intarzie","cine imi datoreaza","cereri intarziate","termen depasit","cine nu a trimis"], a:bbCereri},

function bbAnswer(q){
  const have = new Set(words(q));
  if(!have.size) return null;
  let best = null, bs = 0;
  // „opis” se potrivește cu „opisul”: comparăm după început, de la 4 litere în sus
  const hv = [...have];
  const has = w => have.has(w) || (w.length>=4 && hv.some(h=>h.length>=4 && (h.startsWith(w) || w.startsWith(h))));
  // o frază întreagă câștigă (cu cât mai lungă, cu atât mai specifică); parțial doar cu minimum două cuvinte comune
  const score = phrases => { let m = 0; for(const p of phrases){ const w = words(p); if(!w.length) continue; const hit = w.filter(has).length; const s = hit===w.length ? 10 + w.length : (hit>=2 ? hit/w.length*5 : 0); if(s>m) m=s; } return m; };
  for(const e of BB_CTX.concat(BB_KB)){ const s = score(e.k); if(s>bs){ bs=s; best=e; } }
  // cerințele din Conformitate răspund după titlul lor
  for(const r of CF_RULES){ const s = score([r.titlu.replace(/\(.*?\)/g,""), ...(r.kws||[])]); if(s>bs){ bs=s; best={a:()=>`<b>${esc(r.titlu)}</b>. ${esc(r.deCe)} <span class="bb-law">${esc(r.temei)}</span> ${go("conformitate","Vezi în Conformitate")}`}; } }
  return bs >= 2.5 ? best.a() : null;
}

function metrics(){
  const d = S.docs;
  const tot = d.length;
  const dupCount = dupGroups().reduce((a,g)=>a+g.docs.length,0);
  const superseded = d.filter(x=>x.dup).length;
  const ncl = d.filter(x=>x.cap==="Neclasificat").length;
  const scans = d.filter(x=>isScan(x.name)).length;
  const est = d.filter(x=>x.dataSrc==="estimat").length;
  const byCap = {};
  for(const c of CAPS) byCap[c] = d.filter(x=>x.cap===c).length;
  const cer = S.cereri.map(cerStatus);
  return {tot, dupCount, superseded, ncl, scans, est, byCap, lipsuri:openLipsuri().length,
    cerDeschise: cer.filter(x=>!x.done).length, cerIntarziate: cer.filter(x=>x.late).length,
    necerute: openLipsuri().filter(l=>!lipsaCerere(l)).length};
}

function buildOpis(){
  const m = S.meta;
  const order = CAPS.filter(c=>c!=="Neclasificat").concat(["Neclasificat"]);
  const roman = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  let n = 0, rows = "";
  order.forEach((cap, i)=>{
    const ds = S.docs.filter(d=>d.cap===cap && !d.dup);
    const ls = openLipsuri().filter(l=>l.cap===cap);
    if(!ds.length && !ls.length) return;
    rows += `<tr class="cap"><td colspan="5">${roman[i]||""}. ${esc(cap)}</td></tr>`;
    ds.sort((a,b)=>(a.data||"").localeCompare(b.data||"")||a.name.localeCompare(b.name));
    for(const d of ds){
      n++;
      rows += `<tr><td>${String(n).padStart(3,"0")}</td><td>${esc(d.name)}</td><td>${esc(d.sursa==="primit"?("primit · "+(d.dela||"—")):(d.sursa==="propriu"?"propriu":"—"))}</td><td>${esc(d.dataSrc==="estimat"?"":roDate(d.data))}</td><td>atașat</td></tr>`;
    }
    for(const l of ls){
      n++;
      rows += `<tr class="miss"><td>${String(n).padStart(3,"0")}</td><td>${esc(lden(l))}</td><td>${esc(l.dela||"—")}</td><td>—</td><td>LIPSĂ</td></tr>`;
    }
  });
  const now = new Date();
  const dt = now.toLocaleDateString("ro-RO")+", ora "+now.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
  return `
  <div class="opis-h">
    <h2>OPIS — ${esc(m.proiect||"Proiect")}</h2>
    <div class="m">
      Firma: ${esc(m.firma||"—")} · Beneficiar: ${esc(m.beneficiar||"—")} · Contract: ${esc(m.contract||"—")}<br>
      Amplasament: ${esc(m.amplasament||"—")} · Emis ${dt} · ${n} poziții, din care ${openLipsuri().length} lipsă
    </div>
  </div>
  <table class="opis">
    <thead><tr><th style="width:38px">Poz.</th><th>Denumire document</th><th style="width:150px">Sursă</th><th style="width:74px">Data</th><th style="width:60px">Stare</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="5">Niciun document.</td></tr>`}</tbody>
  </table>
  <div class="pf">Opis generat cu Schela · Atelier. Documentele marcate LIPSĂ nu se regăsesc în dosarul predat și se recuperează de la sursele indicate.</div>`;
}

function roDate(iso){
  if(!iso) return "";
  const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}
function csvEsc(v){ const s=String(v??""); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportCsv(){
  const src = {nume:"din denumire", text:"din textul documentului", estimat:"estimata (data fisierului)", manual:"introdusa manual"};
  const head = ["Denumire","Cale","Capitol","Nr. document","Data document","Sursa datei","Sursa","De la cine","In vigoare","Inlocuit","In grup de duplicate","Extensie","Marime (bytes)","SHA-256"];
  const lines = [head.join(";")].concat(S.docs.map(d=>[
    d.name, d.path, d.cap, d.nr||"", d.data, src[d.dataSrc]||"", d.sursa, d.dela, d.viz?"da":"", d.dup?"da":"", d.grp?"da":"", d.ext, d.size, d.hash||""
  ].map(csvEsc).join(";")));
  download((S.meta.proiect||"inventar").replace(/[^\w\-]+/g,"_")+"_inventar.csv", "﻿"+lines.join("\r\n"), "text/csv;charset=utf-8");
}

    ["Cereri intarziate", m.cerIntarziate],
    ["Documente neincadrate", m.ncl],
    ["Scanuri si poze", m.scans],
    ["Date estimate (nemodificate)", m.est],
    ["Procent scanuri", (m.tot?Math.round(m.scans/m.tot*100):0)+"%"],
    ...CAPS.map(c=>["Documente — "+c, m.byCap[c]])
  ];
  download((S.meta.proiect||"statistici").replace(/[^\w\-]+/g,"_")+"_statistici.csv",
    "﻿"+[["Indicator","Valoare"].join(";")].concat(rows.map(r=>r.map(csvEsc).join(";"))).join("\r\n"),
    "text/csv;charset=utf-8");
}

/* ---------------- binding ---------------- */
function bind(){
  const v = $("#view");

  const fit = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
  v.querySelectorAll("[data-meta]").forEach(el=>{
    el.oninput = () => {
      if(el.classList.contains("grow")){ el.value = el.value.replace(/\n/g," "); fit(el); }
      S.meta[el.dataset.meta] = el.value; autosave(); $("#vsub").textContent = S.meta.proiect?"· "+S.meta.proiect:"";
    };
    if(el.classList.contains("grow")){
      el.onkeydown = e => { if(e.key==="Enter") e.preventDefault(); };   // un singur paragraf, fără rânduri noi
      fit(el);
    }
  });
  const nt = v.querySelector("[data-note]");
  if(nt) nt.oninput = () => { S.note = nt.value; autosave(); };


  const bdemo=$("#btnDemo"); if(bdemo) bdemo.onclick=async()=>{
    if(IDX.some(l=>l.id==="demo-lea-nord-sud") && !confirm("Exemplul există deja în listă. Îl redeschizi de la zero?")) return;
    try{
      const r = await fetch("exemple/Demo_LEA_Nord-Sud_schela.json", {cache:"no-store"});
      const o = await r.json(); if(!o || !o.meta) throw new Error("format");
      importLucrare(o, "demo-lea-nord-sud"); VIEW = "carte"; render();
    }catch(e){ alert("Exemplul nu a putut fi încărcat."); }
  };
  const bc=$("#btnClear");
  if(bc) bc.onclick=()=>{ if(confirm(`Ștergi lucrarea „${S.meta.proiect||"fără nume"}” din acest browser?`)){ deleteLucrare(S.id); render(); } };

  // pagina de intrare și pagina domeniului
  v.querySelectorAll("[data-dom-open]").forEach(b=>b.onclick=()=>{ DSEL=b.dataset.domOpen; VIEW="domeniu"; render(); v.scrollTop=0; });
  v.querySelectorAll("[data-lopen]").forEach(b=>b.onclick=()=>openLucrare(b.dataset.lopen));
  v.querySelectorAll("[data-ldel]").forEach(b=>b.onclick=()=>{
    const l = IDX.find(x=>x.id===b.dataset.ldel); if(!l) return;
    if(confirm(`Ștergi lucrarea „${l.proiect||"fără nume"}” din acest browser? Dacă ai salvat-o în fișier, o poți redeschide de acolo.`)){ deleteLucrare(l.id); render(); }
  });
  const bnl=$("#btnNewL"); if(bnl) bnl.onclick=()=>newLucrare(DSEL);

  // domeniile și tipurile de lucrări
  v.querySelectorAll("[data-dom]").forEach(el=>el.onchange=()=>{
    const id = el.dataset.dom;
    S.dom = el.checked ? DOM.map(d=>d.id).filter(x=>x===id || S.dom.includes(x)) : S.dom.filter(x=>x!==id);
    if(el.checked && S.pers.length) S.pers.forEach(p=>{ if(S.dom.length===1 && !p.dom.length) p.dom=[id]; });
    if(!el.checked) S.pers.forEach(p=>{ p.dom = p.dom.filter(x=>x!==id); });
    render();
  });
  v.querySelectorAll("[data-sub]").forEach(el=>el.onchange=()=>{
    const id = el.dataset.sub, all = domById("electrice").tpls;
    S.sub = el.checked ? all.filter(x=>x===id || S.sub.includes(x)) : S.sub.filter(x=>x!==id);
    render();
  });

  // persoane
  const bap=$("#btnAddPers"); if(bap) bap.onclick=()=>{
    S.pers.push({id:newId("p"), nume:"", rol: S.pers.some(p=>p.rol===ROLURI[0]) ? ROLURI[1] : ROLURI[0], dom: S.dom.length===1 ? [S.dom[0]] : []});
    render(); const ins = v.querySelectorAll('[data-pf$=":nume"]'); if(ins.length) ins[ins.length-1].focus();
  };
  v.querySelectorAll("[data-pf]").forEach(el=>{
    const [i, k] = el.dataset.pf.split(":"); const p = S.pers[+i]; if(!p) return;
    if(el.tagName==="SELECT") el.onchange=()=>{ p[k]=el.value; render(); };
    else { el.oninput=()=>{ p[k]=el.value; autosave(); }; el.onchange=()=>render(); }
  });
  v.querySelectorAll("[data-pdom]").forEach(el=>el.onchange=()=>{
    const [i, d] = el.dataset.pdom.split(":"); const p = S.pers[+i]; if(!p) return;
    p.dom = el.checked ? S.dom.filter(x=>x===d || p.dom.includes(x)) : p.dom.filter(x=>x!==d);
    render();
  });
  v.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ S.pers.splice(+b.dataset.pdel,1); render(); });

  // file inputs
  const bd=$("#btnPickDir"), bf=$("#btnPickFiles"), ind=$("#inDir"), inf=$("#inFiles");
  if(bd&&ind){ bd.onclick=()=>ind.click(); ind.onchange=()=>{ if(ind.files.length) addFiles([...ind.files]); ind.value=""; }; }
  if(bf&&inf){ bf.onclick=()=>inf.click(); inf.onchange=()=>{ if(inf.files.length) addFiles([...inf.files]); inf.value=""; }; }

  // filters
  const fq=$("#fq"); if(fq) fq.oninput=()=>{ FILTER.q=fq.value; const p=fq.selectionStart; render(); const n=$("#fq"); if(n){n.focus(); n.setSelectionRange(p,p);} };
  const fc=$("#fcap"); if(fc) fc.onchange=()=>{ FILTER.cap=fc.value; render(); };
  const fs=$("#fstare"); if(fs) fs.onchange=()=>{ FILTER.stare=fs.value; render(); };

  // row edits
  v.querySelectorAll("[data-f]").forEach(el=>{
    const h=()=>{
      const d=S.docs.find(x=>x.id===el.dataset.id); if(!d) return;
      d[el.dataset.f]=el.value;
      if(el.dataset.f==="data"){ d.dataSrc = el.value ? "manual" : ""; el.classList.remove("isest"); const s=el.nextElementSibling; if(s) s.remove(); }
      autosave();
    };
    el.onchange=h;

  v.querySelectorAll("[data-sel]").forEach(el=>{
    el.onchange=()=>{ const d=S.docs.find(x=>x.id===el.dataset.sel); if(d){ d.sel=el.checked; el.closest("tr").classList.toggle("sel",el.checked);} autosave(); };
  });

  // bulk
  const ba=$("#btnSelAll"); if(ba) ba.onclick=()=>{ const ids=new Set(filtered().map(d=>d.id)); S.docs.forEach(d=>{ if(ids.has(d.id)) d.sel=true; }); render(); };
  const bn=$("#btnSelNone"); if(bn) bn.onclick=()=>{ S.docs.forEach(d=>d.sel=false); render(); };
  const bcap=$("#bulkCap"); if(bcap) bcap.onchange=()=>{ if(!bcap.value) return; let n=0; S.docs.forEach(d=>{ if(d.sel){ d.cap=bcap.value; n++; } }); markDups(); render(); if(!n) alert("Nu ai selectat niciun document."); };
  const bsrc=$("#bulkSrc"); if(bsrc) bsrc.onchange=()=>{ if(!bsrc.value) return; S.docs.forEach(d=>{ if(d.sel) d.sursa=bsrc.value; }); render(); };
  const bdel=$("#btnDel"); if(bdel) bdel.onclick=()=>{ const n=S.docs.filter(d=>d.sel).length; if(!n) return alert("Nu ai selectat nimic."); if(!confirm("Scoți "+n+" documente din inventar?")) return; S.docs=S.docs.filter(d=>!d.sel); markDups(); render(); };

  const brc=$("#btnReclass"); if(brc) brc.onclick=()=>{
    let n=0;
    S.docs.forEach(d=>{ if(d.cap==="Neclasificat"){ const c=guessCap(d.name,d.path); if(c!=="Neclasificat"){ d.cap=c; n++; } } });
    render(); alert(n ? n+" documente încadrate. Verifică-le cu filtrul pe capitol." : "Niciun document neclasificat nu se potrivește cu regulile.");
  };

  // duplicate
  v.querySelectorAll("[data-viz]").forEach(b=>b.onclick=()=>{
    const d=S.docs.find(x=>x.id===b.dataset.viz); if(!d) return;
    const g=dupGroups().find(g=>g.docs.includes(d));
    if(g) g.docs.forEach(x=>x.viz=false);
    d.viz=true; markDups(); render();
  });

  // lipsuri
  const bal=$("#btnAddL");
  if(bal) bal.onclick=()=>{
    const den=$("#lDen").value.trim();
    if(!den) return alert("Scrie denumirea documentului.");
    S.lipsuri.push({id:newId("l"), den, cap:$("#lCap").value, dela:$("#lDela").value.trim()});

  };
  v.querySelectorAll("[data-dell]").forEach(b=>b.onclick=()=>{
    const [l] = S.lipsuri.splice(+b.dataset.dell,1);
    if(l) S.cereri.forEach(c=>{ c.items = c.items.filter(id=>id!==l.id); });
    S.cereri = S.cereri.filter(c=>c.items.length);
    render();

  v.querySelectorAll("[data-unrez]").forEach(b=>b.onclick=()=>{ delete S.lipsuri[+b.dataset.unrez].rez; render(); });

  const cfl=$("#cfToLips"); if(cfl) cfl.onclick=()=>{

  const ctl=$("#ctToLips"); if(ctl) ctl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l))));

      if(have.has(norm(lden(i)))) continue;

  const ma=$("#matAdd"); if(ma) ma.onclick=()=>{

  v.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{ S.mat.splice(+b.dataset.mdel,1); render(); });

    }
    render(); alert(n ? `${pl(n,"document adăugat","documente adăugate")} la Lipsuri; le poți cere de la Cereri, grupate pe furnizori.` : "Toate lipsurile sunt deja în listă.");

  v.querySelectorAll("[data-fconv]").forEach(b=>b.onclick=()=>{ const f=S.faze[+b.dataset.fconv]; if(f) openTextModal("Convocare ISC – model", convocareText(f), "Model de pornire: completează ora, persoana de contact și antetul firmei; verifică forma cerută de inspectoratul județean."); });
  v.querySelectorAll("[data-sg]").forEach(el=>el.onchange=()=>{ const [id,k] = el.dataset.sg.split(":"); (S.sem[id] = S.sem[id] || {})[k] = el.checked; render(); });
  const stl=$("#semToLips"); if(stl) stl.onclick=()=>{
    const have = new Set(S.lipsuri.map(l=>norm(lden(l)))); let n = 0;
    const nm = Object.fromEntries(SIGN);
    for(const d of pvNesemnate()){
      const den = `Semnături lipsă (${pvState(d).miss.map(k=>nm[k]).join(", ")}) – ${d.name.replace(/\.[a-z0-9]{1,5}$/i,"")}`;
      if(have.has(norm(den))) continue;
      S.lipsuri.push({id:newId("l"), cod:"", den, cap:"Execuție", dela:"Executant"}); n++;
    }
    render(); alert(n ? `${pl(n,"PV adăugat","PV-uri adăugate")} la Lipsuri.` : "Toate sunt deja în listă.");
  };
  const dim=$("#dispImport"); if(dim) dim.onclick=()=>{
    for(const d of dispNeinregistrate()){
      // ce modifică: textul de după număr și dată, dacă documentul are text
      let desc = "";
      if(d.txt){ desc = d.txt.replace(/^.*?dispozi\w*\s+de\s+santier/,"").replace(/^\s*nr\.?\s*[:.]?\s*[0-9a-z./-]+/,"").replace(new RegExp("^\\s*(din|data)?\\s*[:.]?\\s*([0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4}|[0-9]{1,2}\\s+(" + LUNI.join("|") + ")\\s+[0-9]{4})"),"").replace(/^[\s\-–:,.]+/,"").slice(0,140); }
      S.disp.push({id:newId("s"), nr:d.nr||findNr(d.name), data: d.dataSrc==="estimat" ? "" : (d.data||""), desc, desen:false, asbuilt:false, docId:d.id});
    }
    render();
  };
  const dad=$("#dispAdd"); if(dad) dad.onclick=()=>{ S.disp.push({id:newId("s"), nr:"", data:"", desc:"", desen:false, asbuilt:false, docId:""}); render(); };
  v.querySelectorAll("[data-df]").forEach(el=>{ const [i,k] = el.dataset.df.split(":"); el.onchange=()=>{ const x=S.disp[+i]; if(x){ x[k]=el.value; render(); } }; });
  v.querySelectorAll("[data-dck]").forEach(el=>el.onchange=()=>{ const [i,k] = el.dataset.dck.split(":"); const x=S.disp[+i]; if(x){ x[k]=el.checked; render(); } });
  v.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=()=>{ S.disp.splice(+b.dataset.ddel,1); render(); });

  v.querySelectorAll("[data-addfiles]").forEach(b=>b.onclick=()=>$("#inGlobal").click());
  const csa=$("#csugAdd"); if(csa) csa.onclick=()=>{
    const sg = certSugestii(); let n = 0;
    v.querySelectorAll("[data-csug]").forEach(el=>{ if(!el.checked) return; const x = sg[+el.dataset.csug]; if(!x) return; S.mat.push({id:newId("m"), den:x.i.den, furn:x.i.furn, kw:"", docId:x.d.id, ok:false}); n++; });
    render(); if(n) alert(`${pl(n,"material adăugat","materiale adăugate")}, fiecare legat de certificatul lui. Verifică dacă documentul corespunde și bifează „Corespunde”.`);
  };

  const bpt=$("#btnPdfTxt"), ipt=$("#inPdfTxt"); if(bpt&&ipt){ bpt.onclick=()=>ipt.click(); ipt.onchange=()=>{ if(ipt.files.length) readPdfTexts([...ipt.files]); ipt.value=""; }; }

  // rezultate
  const bo=$("#btnOpis"); if(bo) bo.onclick=()=>{ $("#print").innerHTML=buildOpis(); setTimeout(()=>window.print(),60); };
  const bcsv=$("#btnCsv"); if(bcsv) bcsv.onclick=exportCsv;
  const brap=$("#btnRaport"); if(brap) brap.onclick=exportRaport;
}

/* Boloboc */
$("#bbFab").onclick = () => { const b = $("#bb"); b.classList.toggle("on"); if(b.classList.contains("on")) bbRender(); };

/* top bar */
$("#btnSave").onclick=()=>{
  if(!CUR) return;
  const name=(S.meta.proiect||"proiect").replace(/[^\w\-]+/g,"_")+"_schela.json";
  download(name, JSON.stringify(S,null,2));

$("#btnLoad").onclick=()=>$("#fileLoad").click();
$("#fileLoad").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||!o.meta) throw new Error("format");
      // aceeași lucrare (același identificator) se înlocuiește; altfel intră în listă ca lucrare nouă
      if(o.id && IDX.some(l=>l.id===o.id) && !confirm(`Lucrarea „${o.meta.proiect||"fără nume"}” există deja în listă. O înlocuiești cu versiunea din fișier?`)) o.id = "";
      autosave();
      importLucrare(o); VIEW="proiect"; render();
      alert("Lucrare deschisă: "+(S.meta.proiect||"fără nume")+" — "+S.docs.length+" documente.");
    }catch(err){ alert("Fișierul nu pare a fi un proiect Schela."); }
  };
  r.readAsText(f); e.target.value="";
};
$("#inGlobal").onchange=e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length && CUR) addFiles(fs); };
$(".brand").onclick=()=>{ if(CUR) closeLucrare(); VIEW="acasa"; render(); };


window.addEventListener("beforeunload", autosave);
// la redimensionarea ferestrei, câmpurile care cresc își recalculează înălțimea
window.addEventListener("resize", ()=>document.querySelectorAll("textarea.grow").forEach(el=>{ el.style.height="auto"; el.style.height=el.scrollHeight+2+"px"; }));

autoload();
markDups();
render();
</script>
</body>
</html>
